<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  禁止外部资源。

  控制台跑在本机回环上，引用任何外部 CDN 都会把"本机管理界面"的
  加载行为暴露给第三方，也会让离线环境下的控制台变成一片空白。
  所有样式与脚本都来自这个二进制自己。
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' ws://127.0.0.1:* ws://localhost:*; img-src 'self' data:; form-action 'none'; base-uri 'none'">
<title data-i18n="web.title"></title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">ISC</span>
    <span class="subtitle" data-i18n="web.subtitle"></span>
  </div>
  <div class="meta" id="topMeta">
    <span class="pill" id="pillVersion">—</span>
    <span class="pill" id="pillConn" data-i18n="web.conn.connecting"></span>
  </div>
</header>

<div id="bootError" class="boot-error" hidden></div>

<nav class="tabs" id="tabs">
  <button data-tab="overview" class="active" data-i18n="web.tab.overview"></button>
  <button data-tab="ip" data-i18n="web.tab.ip"></button>
  <button data-tab="credentials" data-i18n="web.tab.credentials"></button>
  <button data-tab="tasks" data-i18n="web.tab.tasks"></button>
  <button data-tab="records" data-i18n="web.tab.records"></button>
  <button data-tab="proxy" data-i18n="web.tab.proxy"></button>
        <button data-tab="certs" data-i18n="web.tab.certs"></button>
        <button data-tab="notify" data-i18n="web.tab.notify"></button>
        <button data-tab="service" data-i18n="web.tab.service"></button>
        <button data-tab="events" data-i18n="web.tab.events"></button>
  <button data-tab="raw" data-i18n="web.tab.raw"></button>
</nav>

<main>

<!-- ==================== 概览 ==================== -->
<section id="tab-overview" class="tab-panel active">
  <h2 data-i18n="web.ov.title"></h2>
  <div class="grid" id="overviewCards"></div>

  <h2 data-i18n="web.ov.cap_title"></h2>
  <p class="hint" data-i18n-html="web.overview.p1"></p>
  <table class="data" id="capTable">
    <thead><tr></tr></thead>
    <tbody></tbody>
  </table>
</section>

<!-- ==================== IP 与前缀 ==================== -->
<section id="tab-ip" class="tab-panel">
  <h2 data-i18n="web.ip.title"></h2>
  <p class="hint" data-i18n-html="web.ip.p2"></p>
  <div class="row">
    <button id="ipRefresh" data-i18n="web.ip.refresh"></button>
  </div>
  <div class="grid" id="ipPrimary"></div>
  <div id="ipList"></div>
</section>

<!-- ==================== 凭据 ==================== -->
<section id="tab-credentials" class="tab-panel">
  <h2 data-i18n="web.cred.title"></h2>
  <p class="hint" data-i18n-html="web.credentials.p3"></p>
  <div class="row">
    <button id="credRefresh" data-i18n="web.cred.refresh"></button>
    <button id="credNew" class="primary" data-i18n="web.cred.new"></button>
  </div>
  <div id="credForm" class="form-card" hidden></div>
  <div id="credList"></div>
</section>

<!-- ==================== 动态解析 ==================== -->
<section id="tab-tasks" class="tab-panel">
  <h2 data-i18n="web.task.title"></h2>
  <p class="hint" data-i18n-html="web.tasks.p4"></p>
  <div class="row">
    <button id="taskRefresh" data-i18n="web.task.refresh"></button>
    <button id="taskNew" class="primary" data-i18n="web.task.new"></button>
  </div>
  <div id="taskForm" class="form-card" hidden></div>
  <div id="taskList"></div>
</section>

<!-- ==================== DNS 记录 ==================== -->
<section id="tab-records" class="tab-panel">
  <h2 data-i18n="web.rec.title"></h2>
  <p class="hint" data-i18n-html="web.records.p5"></p>
  <div class="row">
    <label><span data-i18n="web.rec.l_cred"></span> <select id="recCred"></select></label>
    <label><span data-i18n="web.rec.l_zone"></span> <select id="recZone" disabled><option data-i18n="web.rec.pick_cred"></option></select></label>
    <button id="recLoad" data-i18n="web.rec.load"></button>
    <button id="recNew" class="primary" disabled data-i18n="web.rec.new"></button>
  </div>
  <div id="recCapNote" class="hint"></div>
  <div id="recForm" class="form-card" hidden></div>
  <div id="recList"></div>
</section>

<!-- ==================== 反向代理 ==================== -->
<section id="tab-proxy" class="tab-panel">
  <h2 data-i18n="web.px.title"></h2>
  <p class="hint" data-i18n-html="web.proxy.p6"></p>

  <div class="card">
    <div class="row">
      <label class="check">
        <input type="checkbox" id="pxEnabled">
        <span data-i18n="web.px.l_enable"></span>
      </label>
      <label><span data-i18n="web.px.l_port"></span> <input type="number" id="pxPort" min="1" max="65535" style="width:6rem"></label>
      <label class="check">
        <input type="checkbox" id="pxTls">
        <span data-i18n="web.px.l_https"></span>
      </label>
      <button id="pxSave" class="primary" data-i18n="web.px.save"></button>
      <button id="pxStatus" data-i18n="web.px.status"></button>
    </div>
    <div id="pxState" class="hint"></div>
  </div>

  <h3 data-i18n="web.px.rules"></h3>
  <p class="hint" data-i18n-html="web.proxy.p7"></p>
  <div class="row">
    <button id="pxRefresh" data-i18n="web.px.refresh"></button>
    <button id="pxNew" class="primary" data-i18n="web.px.new"></button>
  </div>
  <div id="pxForm" class="form-card" hidden></div>
  <div id="pxList"></div>
</section>

<!-- ==================== 证书 ==================== -->
<section id="tab-certs" class="tab-panel">
  <h2 data-i18n="web.cert.title"></h2>
  <p class="hint" data-i18n-html="web.certs.p8"></p>
  <div class="row">
    <button id="certRefresh" data-i18n="web.cert.refresh"></button>
    <button id="certRenew" class="primary" data-i18n="web.cert.renew"></button>
  </div>
  <div id="certList"></div>
</section>

<!-- ==================== 通知 ==================== -->
<section id="tab-notify" class="tab-panel">
  <h2 data-i18n="web.nt.title"></h2>
  <p class="hint" data-i18n-html="web.notify.p9"></p>
  <div class="row">
    <button id="ntRefresh" data-i18n="web.nt.refresh"></button>
    <button id="ntNew" class="primary" data-i18n="web.nt.new"></button>
    <button id="ntTest" data-i18n="web.nt.test"></button>
  </div>
  <div id="ntForm" class="form-card" hidden></div>
  <div id="ntList"></div>

  <h3 data-i18n="web.nt.recent"></h3>
  <p class="hint" data-i18n-html="web.notify.p10"></p>
  <div id="ntDeliveries"></div>
</section>

<!-- ==================== 系统服务 ==================== -->
<section id="tab-service" class="tab-panel">
  <h2 data-i18n="web.svc.title"></h2>
  <p class="hint" data-i18n-html="web.service.p11"></p>

  <div class="card">
    <div id="svcState" class="hint" data-i18n="web.common.loading"></div>
    <div class="row">
      <button id="svcRefresh" data-i18n="web.svc.refresh"></button>
      <button id="svcStart" data-i18n="web.svc.start"></button>
      <button id="svcStop" data-i18n="web.svc.stop"></button>
    </div>
  </div>

  <h3 data-i18n="web.svc.install_h"></h3>
  <div class="card">
    <div class="row">
      <label class="check">
        <input type="checkbox" id="svcAuto" checked>
        <span data-i18n="web.svc.l_autostart"></span>
      </label>
      <label class="check">
        <input type="checkbox" id="svcRestart" checked>
        <span data-i18n="web.svc.l_restart"></span>
      </label>
    </div>
    <div class="row">
      <button id="svcInstall" class="primary" data-i18n="web.svc.install"></button>
      <button id="svcUninstall" class="danger" data-i18n="web.svc.uninstall"></button>
    </div>
    <p class="hint" data-i18n-html="web.service.p12"></p>
  </div>
</section>

<!-- ==================== 事件流 ==================== -->
<section id="tab-events" class="tab-panel">
  <h2 data-i18n="web.ev.title"></h2>
  <p class="hint" data-i18n-html="web.events.p13"></p>
  <div class="row">
    <button id="evConnect" data-i18n="web.ev.connect"></button>
    <button id="evDisconnect" disabled data-i18n="web.ev.disconnect"></button>
    <button id="evClear" data-i18n="web.ev.clear"></button>
    <label class="inline"><input type="checkbox" id="evFollow" checked> <span data-i18n="web.ev.l_follow"></span></label>
  </div>
  <div id="evLog" class="event-log"></div>
</section>

<!-- ==================== 原始接口 ==================== -->
<section id="tab-raw" class="tab-panel">
  <h2 data-i18n="web.raw.title"></h2>
  <p class="hint" data-i18n-html="web.raw.p14"></p>
  <div class="row">
    <label><span data-i18n="web.raw.l_method"></span> <select id="rawMethod">
      <option>GET</option><option>POST</option><option>PATCH</option>
      <option>PUT</option><option>DELETE</option>
    </select></label>
    <label class="grow"><span data-i18n="web.raw.l_path"></span> <input id="rawPath" value="/v1/meta" spellcheck="false"></label>
    <button id="rawSend" class="primary" data-i18n="web.raw.send"></button>
  </div>
  <label class="block"><span data-i18n="web.raw.l_body"></span>
    <textarea id="rawBody" rows="6" spellcheck="false"></textarea>
  </label>
  <div class="raw-out">
    <div class="raw-status" id="rawStatus">—</div>
    <pre id="rawResult"></pre>
  </div>
</section>

</main>

<footer class="statusbar">
  <span id="statusText" data-i18n="web.raw.ready"></span>
</footer>

<script src="i18n.js"></script>
<script src="panels.js"></script>
  <script src="app.js"></script>
</body>
</html>
