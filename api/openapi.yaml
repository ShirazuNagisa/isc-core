openapi: 3.1.0

info:
  title: ISC Core API
  version: 0.1.0
  description: |
    ISC（接入编排器）内核的本地管理接口。

    ## 设计约束

    - **仅本机可达**：内核只监听命名管道 / Unix socket / 回环，绝不对外暴露。
      所有请求（含回环）都必须携带 `Authorization: Bearer <token>`，
      token 从数据目录下的 `runtime.json` 读取。见 docs/DECISIONS.md D09。
    - **快同步 + 慢异步**：列表与详情查询同步返回；所有可能耗时的操作
      （证书签发、凭据校验、防火墙应用、外部可达性验证）返回 `202` 与
      `job_id`，进度通过 `GET /v1/jobs/{id}` 或 WebSocket 事件流获取。
      见 docs/DECISIONS.md D08。
    - **契约优先**：本文件是接口的唯一真理。Go 服务端接口由 oapi-codegen 生成，
      前端类型由 openapi-typescript 生成。修改接口必须先改本文件。

    ## M0 阶段范围

    当前仅有元信息、健康检查、事件流与任务引擎。业务端点随里程碑加入。

servers:
  - url: http://localhost
    description: 实际地址由运行时的 runtime.json 决定（命名管道 / Unix socket / 回环）

tags:
  - name: Meta
    description: 版本、平台能力与健康状态
  - name: Events
    description: 实时事件流
  - name: Jobs
    description: 异步任务
  - name: Providers
    description: DNS 服务商元信息与能力矩阵
  - name: Credentials
    description: DNS 服务商凭据（加密存储）
  - name: IP
    description: 本机地址与 IPv6 前缀
  - name: DdnsTasks
    description: 动态解析任务
  - name: Zones
    description: DNS 区域（Tier-1 服务商）
  - name: Records
    description: DNS 记录管理（Tier-1 服务商）
  - name: Settings
    description: 运行时设置
  - name: Audit
    description: 审计日志
  - name: Config
    description: 配置导入导出与迁移
  - name: Debug
    description: 仅用于管线自检的调试端点，不属于产品接口

security:
  - bearerAuth: []

paths:
  /v1/health:
    get:
      tags: [Meta]
      operationId: getHealth
      summary: 存活检查
      description: 不依赖任何子系统的最小存活探针，供 CLI 与 GUI 判断内核是否在运行。
      security: []
      responses:
        "200":
          description: 内核存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"

  /v1/meta:
    get:
      tags: [Meta]
      operationId: getMeta
      summary: 元信息与平台能力
      description: |
        返回版本、构建信息、运行平台，以及各平台后端（防火墙 / 服务管理 /
        网卡监控 / 密钥库 / 传输 / 低端口绑定）的实现状态。

        下游 GUI 应当依据 `capabilities` 决定是否置灰相关功能，
        而不是自己去猜 `runtime.GOOS`。
      responses:
        "200":
          description: 元信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        default:
          $ref: "#/components/responses/Problem"

  /v1/events:
    get:
      tags: [Events]
      operationId: subscribeEvents
      summary: 订阅事件流（WebSocket）
      description: |
        升级为 WebSocket 连接后，服务端持续推送内核事件。

        事件带单调递增的 `seq`。客户端断线重连时携带 `lastEventId`，
        服务端会补发序号大于该值的事件；若请求的序号已超出环形缓冲范围，
        则先推送一条 `events.gap` 事件告知客户端需要重新拉取全量状态。
      parameters:
        - name: lastEventId
          in: query
          required: false
          description: 客户端已收到的最后一个事件序号，用于断线补发。
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "101":
          description: 协议升级成功，开始推送事件
        "400":
          description: |
            无法升级为 WebSocket（例如缺少 Upgrade 头）。
            该响应为普通 HTTP 响应，不是 WebSocket 帧。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: 任务列表
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          description: 按状态过滤，可重复传入。
          schema:
            type: array
            items:
              $ref: "#/components/schemas/JobStatus"
          style: form
          explode: true
        - name: kind
          in: query
          required: false
          description: 按任务类型过滤。
          schema:
            type: string
      responses:
        "200":
          description: 任务列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/jobs/{id}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: 任务详情
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/jobs/{id}/cancel:
    post:
      tags: [Jobs]
      operationId: cancelJob
      summary: 取消任务
      description: |
        请求取消一个尚未结束的任务。取消是协作式的：任务实现需自行响应
        `context.Context` 的取消信号。对已结束的任务调用返回 `409`。
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: 已受理取消请求（任务可能仍处于 canceling 状态）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/debug/noop:
    post:
      tags: [Debug]
      operationId: runNoopJob
      summary: 提交一个空转任务（仅用于管线自检）
      description: |
        **非产品接口。** 提交一个按步进上报进度的空转任务，用于验证
        任务引擎与事件流是否正常。计划在 M1 之后移除。

        `steps` 控制步数，`step_ms` 控制每步耗时。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoopRequest"
      responses:
        "202":
          description: 任务已提交
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # DNS 服务商元信息
  # ---------------------------------------------------------------------------

  /v1/providers:
    get:
      tags: [Providers]
      operationId: listProviders
      summary: 列出支持的 DNS 服务商及其能力与凭据字段
      description: |
        返回内核支持的全部 DNS 服务商，以及每家所需的凭据字段定义。

        **这是下游 GUI 渲染凭据表单的唯一依据** —— GUI 不需要为每家服务商
        写死表单，只需遍历 `credential_fields` 生成输入框。新增服务商时
        内核与 GUI 都不用改代码。

        `capabilities` 声明该服务商支持哪些操作（区域列表、记录增删改查、
        全记录类型、TTL、代理开关、能否用于 ACME DNS-01 校验）。
        GUI 应当据此置灰不支持的功能，而不是等用户点了才报错。
      responses:
        "200":
          description: 服务商列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Provider"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 凭据
  # ---------------------------------------------------------------------------

  /v1/credentials:
    get:
      tags: [Credentials]
      operationId: listCredentials
      summary: 列出全部凭据
      description: |
        返回的凭据中，**敏感字段一律以掩码形式呈现**（例如 `abcd****wxyz`），
        明文永不离开内核。客户端提交更新时若某字段的值等于掩码，
        内核会保留原值而不是把掩码当作新值写入。
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 凭据列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialList"
        default:
          $ref: "#/components/responses/Problem"

    post:
      tags: [Credentials]
      operationId: createCredential
      summary: 新建凭据
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialInput"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          description: 同名凭据已存在
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/credentials/{id}:
    parameters:
      - $ref: "#/components/parameters/CredentialId"

    get:
      tags: [Credentials]
      operationId: getCredential
      summary: 凭据详情
      responses:
        "200":
          description: 凭据详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

    patch:
      tags: [Credentials]
      operationId: updateCredential
      summary: 修改凭据
      description: |
        只更新请求体中出现的字段。敏感字段若提交掩码值则保留原值 ——
        这让"改个标签"不需要重新输入密钥。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialInput"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

    delete:
      tags: [Credentials]
      operationId: deleteCredential
      summary: 删除凭据
      responses:
        "204":
          description: 已删除
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: 凭据仍被引用（例如有动态解析任务或证书在使用它）
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 设置
  # ---------------------------------------------------------------------------

  /v1/settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: 读取运行时设置
      responses:
        "200":
          description: 设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Problem"

    patch:
      tags: [Settings]
      operationId: updateSettings
      summary: 修改运行时设置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: 修改后的完整设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 审计
  # ---------------------------------------------------------------------------

  /v1/audit:
    get:
      tags: [Audit]
      operationId: listAudit
      summary: 查询审计日志
      description: |
        记录所有**写操作**（谁、什么时候、对什么、做了什么、结果如何）。

        存在的意义：内核以系统服务身份运行、能改防火墙、能重写整个 DNS 区域。
        出问题时"最后一次改动是什么、谁改的"是排查的第一入口。
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: action
          in: query
          required: false
          description: 按动作过滤。
          schema:
            type: string
        - name: result
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AuditResult"
      responses:
        "200":
          description: 审计记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 配置导入导出
  # ---------------------------------------------------------------------------

  /v1/config/export:
    get:
      tags: [Config]
      operationId: exportConfig
      summary: 导出配置
      description: |
        导出为 YAML，用于备份与迁移。

        `include_secrets` 默认为 **false**：导出的凭据字段为掩码，
        导入到另一台机器时需要重新填写密钥。这是刻意的默认值 ——
        一个"顺手导出"产生的明文密钥文件是常见的事故来源。
      parameters:
        - name: include_secrets
          in: query
          required: false
          description: 设为 true 才会导出明文凭据（务必妥善保管导出文件）。
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: 配置 YAML
          content:
            application/yaml:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"

  /v1/config/import:
    get:
      tags: [Config]
      operationId: describeImport
      summary: 说明导入行为
      description: |
        该端点只做说明，不做任何事。真正的导入用 POST。

        （保留它是因为 OpenAPI 3.1 的 `GET` 与 `POST` 语义需要分开表达，
        而客户端需要能发现"导入会做什么、会不会覆盖现有配置"。）
      responses:
        "200":
          description: 导入行为的说明
          content:
            application/json:
              schema:
                type: object
                properties:
                  dry_run_supported:
                    type: boolean
                  notes:
                    type: string
        default:
          $ref: "#/components/responses/Problem"

    post:
      tags: [Config]
      operationId: importConfig
      summary: 导入配置
      description: |
        `dry_run` 默认为 **true**：先返回"将会发生什么"（新建多少条、
        覆盖多少条、哪些会失败），确认后再以 `dry_run=false` 提交。

        这与 `docs/DECISIONS.md` D10 的"计划 → 预览 → 应用 → 回滚"
        是同一套思路：导入是破坏性操作，不该一步到位。
      parameters:
        - name: dry_run
          in: query
          required: false
          schema:
            type: boolean
            default: true
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: 导入结果（dry_run 时为预览）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/config/import/ddns-go:
    post:
      tags: [Config]
      operationId: importDdnsGoConfig
      summary: 导入 ddns-go 配置
      description: |
        把 ddns-go 的 YAML 配置迁移为 ISC 的凭据与动态解析任务。

        迁移要点：
        - ddns-go 的每个 `dnsconf` 条目里，`dns.name` / `dns.id` / `dns.secret`
          被抽取为一个凭据（多条条目共用同一凭据时只建一个）；
        - `ipv4` / `ipv6` 的获取方式（网卡 / URL / 命令）与域名列表
          被转换为动态解析任务；
        - ddns-go 的 webhook 配置被转换为一个通知通道（M4 接入通知中心后生效）。
      parameters:
        - name: dry_run
          in: query
          required: false
          schema:
            type: boolean
            default: true
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
      responses:
        "200":
          description: 迁移结果（dry_run 时为预览）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # IP 状态
  # ---------------------------------------------------------------------------

  /v1/ip/current:
    get:
      tags: [IP]
      operationId: getCurrentIP
      summary: 读取当前网卡地址与 IPv6 前缀
      description: |
        返回全部物理网卡的地址，以及**可用于公网访问的 IPv6 地址所对应的前缀**。

        前缀是本产品的核心概念：ISP 重拨后变化的是整个 /64 前缀，
        该前缀下的所有 AAAA 记录都要重写，而不是只改一个地址。

        回环与虚拟网卡（Docker 网桥、VPN 隧道等）被排除 ——
        它们的变化与"公网地址变了"毫无关系。
      responses:
        "200":
          description: 当前地址状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IPStatus"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 动态解析任务
  # ---------------------------------------------------------------------------

  /v1/ddns-tasks:
    get:
      tags: [DdnsTasks]
      operationId: listDdnsTasks
      summary: 列出动态解析任务
      responses:
        "200":
          description: 任务列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdnsTaskList"
        default:
          $ref: "#/components/responses/Problem"

    post:
      tags: [DdnsTasks]
      operationId: createDdnsTask
      summary: 新建动态解析任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DdnsTaskInput"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdnsTask"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/ddns-tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/DdnsTaskId"

    get:
      tags: [DdnsTasks]
      operationId: getDdnsTask
      summary: 任务详情
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdnsTask"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

    patch:
      tags: [DdnsTasks]
      operationId: updateDdnsTask
      summary: 修改任务
      description: |
        修改后内核会**清空该任务的防抖缓存**，使下一次执行必定与服务商比对。

        没有这一步的话，用户改了域名却发现"半天没生效" ——
        因为防抖逻辑认为地址没变、还没到比对时机。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DdnsTaskInput"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdnsTask"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

    delete:
      tags: [DdnsTasks]
      operationId: deleteDdnsTask
      summary: 删除任务
      responses:
        "204":
          description: 已删除
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/ddns-tasks/{id}/run:
    parameters:
      - $ref: "#/components/parameters/DdnsTaskId"
    post:
      tags: [DdnsTasks]
      operationId: runDdnsTask
      summary: 立即执行一次任务
      description: |
        忽略防抖缓存，立刻执行一次。用于"配好了想马上验证"。

        返回 202 与任务 ID：一次执行可能包含多个域名的更新，
        在服务商限流时可能耗时数秒，做成同步会让界面卡住。
      responses:
        "202":
          description: 已开始执行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # DNS 区域与记录（Tier-1 服务商）
  # ---------------------------------------------------------------------------

  /v1/credentials/{id}/zones:
    parameters:
      - $ref: "#/components/parameters/CredentialId"
    get:
      tags: [Zones]
      operationId: listZones
      summary: 列出该凭据可管理的 DNS 区域
      description: |
        路径里带上凭据 ID 而不是把区域 ID 做成全局唯一：区域存在于服务商
        那边，内核不持久化它们。若把 (凭据, 区域) 压成一个本地 ID，
        就得维护一份缓存并处理它过期的问题 —— 而每次实时查询既简单又准确。

        `capabilities.zone_list` 为 false 的服务商会返回 400，
        而不是一个空列表：空列表会让用户以为"我这个账号下没有域名"。
      responses:
        "200":
          description: 区域列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneList"
        "400":
          description: 该服务商不支持列出区域
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/credentials/{id}/zones/{zoneId}/records:
    parameters:
      - $ref: "#/components/parameters/CredentialId"
      - $ref: "#/components/parameters/ZoneId"
    get:
      tags: [Records]
      operationId: listRecords
      summary: 列出区域内的 DNS 记录
      parameters:
        - name: type
          in: query
          required: false
          description: 按记录类型过滤。
          schema:
            type: string
        - name: name
          in: query
          required: false
          description: 按记录名精确过滤（完整域名）。
          schema:
            type: string
      responses:
        "200":
          description: 记录列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordList"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

    post:
      tags: [Records]
      operationId: createRecord
      summary: 新增 DNS 记录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordInput"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/credentials/{id}/zones/{zoneId}/records/{recordId}:
    parameters:
      - $ref: "#/components/parameters/CredentialId"
      - $ref: "#/components/parameters/ZoneId"
      - $ref: "#/components/parameters/RecordId"
    get:
      tags: [Records]
      operationId: getRecord
      summary: 读取单条记录
      responses:
        "200":
          description: 记录详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

    put:
      tags: [Records]
      operationId: updateRecord
      summary: 修改 DNS 记录
      description: |
        用 PUT 而不是 PATCH：请求体是**完整的记录**，服务商那边也是
        整体替换语义。用 PATCH 的话，"清空备注"这类操作需要显式传 null，
        而各家对 null 的处理不一致，容易产生歧义。

        注意：部分服务商（如 GoDaddy）的记录没有独立 ID，
        且"同名同类型"可以有多条值。那类服务商的删除语义会退化为
        "删除该名字该类型的全部记录" —— 详见 `docs/PROVIDER-MATRIX.md`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordInput"
      responses:
        "200":
          description: 修改后的记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

    delete:
      tags: [Records]
      operationId: deleteRecord
      summary: 删除 DNS 记录
      responses:
        "204":
          description: 已删除
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        token 位于数据目录的 `runtime.json` 中（字段 `token`），
        由内核首次启动时生成的 32 字节随机值经 base64url 编码得到。

  parameters:
    JobId:
      name: id
      in: path
      required: true
      description: 任务 ID
      schema:
        type: string
        minLength: 1
    CredentialId:
      name: id
      in: path
      required: true
      description: 凭据 ID
      schema:
        type: string
        minLength: 1
    DdnsTaskId:
      name: id
      in: path
      required: true
      description: 动态解析任务 ID
      schema:
        type: string
        minLength: 1
    ZoneId:
      name: zoneId
      in: path
      required: true
      description: 服务商侧的 DNS 区域 ID
      schema:
        type: string
        minLength: 1
    RecordId:
      name: recordId
      in: path
      required: true
      description: 服务商侧的记录 ID
      schema:
        type: string
        minLength: 1
    Cursor:
      name: cursor
      in: query
      required: false
      description: 分页游标，取自上一次响应的 next_cursor。
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: 单页条数。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  responses:
    Problem:
      description: 错误响应（RFC 9457 problem+json）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    # ------------------------------------------------------------------
    # 错误
    # ------------------------------------------------------------------

    Problem:
      type: object
      description: RFC 9457 定义的错误对象。
      required: [type, title, status]
      properties:
        type:
          type: string
          description: 标识错误类型的 URI。
          examples: ["https://isc.local/problems/not-found"]
        title:
          type: string
          description: 简短的人类可读摘要（已本地化）。
        status:
          type: integer
          description: HTTP 状态码。
          minimum: 100
          maximum: 599
        detail:
          type: string
          description: 本次错误的具体说明（已本地化）。
        instance:
          type: string
          description: 出错的具体请求路径。
        code:
          type: string
          description: |
            稳定的机器可读错误码，供客户端分支判断。
            与 title/detail 不同，该字段不随语言变化。
          examples: ["job_not_found", "job_not_cancelable"]
        request_id:
          type: string
          description: 请求 ID，便于在内核日志中定位。

    # ------------------------------------------------------------------
    # 元信息
    # ------------------------------------------------------------------

    Health:
      type: object
      required: [status, uptime_seconds]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: degraded 表示存活但至少有子系统不可用。
        uptime_seconds:
          type: integer
          format: int64
          minimum: 0
        version:
          type: string

    Meta:
      type: object
      required: [version, api_version, os, arch, started_at, capabilities]
      properties:
        version:
          type: string
          description: 内核版本，开发构建为 dev。
        api_version:
          type: string
          description: 本接口的版本，当前为 v1。
        commit:
          type: string
          description: 构建时的 git commit，未知时为空串。
        build_time:
          type: string
          description: 构建时间（RFC 3339），未知时为空串。
        os:
          type: string
          description: 运行平台（GOOS）。
          examples: [windows, linux, darwin]
        arch:
          type: string
          description: 运行架构（GOARCH）。
          examples: [amd64, arm64]
        started_at:
          type: string
          format: date-time
        capabilities:
          $ref: "#/components/schemas/Capabilities"

    Capabilities:
      type: object
      description: 各平台后端的实现状态。不可用的后端意味着对应功能降级为引导模式。
      required: [firewall, service_manager, ip_monitor, secret_store, transport, low_port_binder]
      properties:
        firewall:
          $ref: "#/components/schemas/ImplState"
        service_manager:
          $ref: "#/components/schemas/ImplState"
        ip_monitor:
          $ref: "#/components/schemas/ImplState"
        secret_store:
          $ref: "#/components/schemas/ImplState"
        transport:
          $ref: "#/components/schemas/ImplState"
        low_port_binder:
          $ref: "#/components/schemas/ImplState"

    ImplState:
      type: object
      required: [available, backend]
      properties:
        available:
          type: boolean
          description: 为 false 时该功能降级为引导模式（只提示用户该做什么）。
        backend:
          type: string
          description: 后端名称。
          examples: ["nftables", "netsh", "unsupported:firewall"]
        note:
          type: string
          description: 给用户看的补充说明（已本地化）。

    # ------------------------------------------------------------------
    # 任务
    # ------------------------------------------------------------------

    JobStatus:
      type: string
      enum:
        - pending
        - running
        - succeeded
        - failed
        - canceled
      description: |
        pending  已提交，尚未开始
        running  执行中
        succeeded 成功结束
        failed   失败结束（见 error 字段）
        canceled 被取消

    Job:
      type: object
      required: [id, kind, status, progress, created_at]
      properties:
        id:
          type: string
        kind:
          type: string
          description: 任务类型标识，供客户端分类展示。
          examples: ["debug.noop", "credentials.verify", "certs.issue"]
        status:
          $ref: "#/components/schemas/JobStatus"
        progress:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: 进度，0 到 1。未知进度时为 0。
        message:
          type: string
          description: 当前步骤的人类可读描述（已本地化）。
        result:
          description: 任务成功时的结果，结构由任务类型决定。
        error:
          $ref: "#/components/schemas/Problem"
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time

    JobAccepted:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string

    JobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        next_cursor:
          type: string
          description: 为空表示没有更多数据。

    NoopRequest:
      type: object
      properties:
        steps:
          type: integer
          minimum: 1
          maximum: 100
          default: 5
        step_ms:
          type: integer
          minimum: 0
          maximum: 10000
          default: 200
        fail_at_step:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
          description: 大于 0 时在第 N 步失败，用于验证失败路径。

    # ------------------------------------------------------------------
    # DNS 服务商
    # ------------------------------------------------------------------

    Provider:
      type: object
      required: [name, display_name, capabilities, credential_fields]
      properties:
        name:
          type: string
          description: 服务商标识，用于凭据的 provider 字段。
          examples: [cloudflare, alidns, dnspod]
        display_name:
          type: string
          description: 展示名称（已本地化）。
        tier:
          type: integer
          enum: [1, 2]
          description: |
            能力分层：
              1 = 完整记录 CRUD + 动态解析（Tier-1）
              2 = 仅 A/AAAA 动态解析（Tier-2，移植自 ddns-go）
        capabilities:
          $ref: "#/components/schemas/ProviderCapabilities"
        credential_fields:
          type: array
          description: |
            该服务商所需的凭据字段。GUI 遍历它生成表单，
            因此**不需要为每家服务商写死界面**。
          items:
            $ref: "#/components/schemas/ProviderField"

    ProviderField:
      type: object
      required: [key, label, secret, required]
      properties:
        key:
          type: string
          description: 字段名，用作凭据 fields 中的键。
          examples: [id, secret, ext_param]
        label:
          type: string
          description: 展示名称（已本地化）。
        secret:
          type: boolean
          description: |
            为 true 时该字段是敏感值：读取时被掩码，界面应使用密码输入框，
            且不参与日志与导出（除非显式要求导出明文）。
        required:
          type: boolean
        placeholder:
          type: string
          description: 输入提示。
        help:
          type: string
          description: 补充说明，例如"在何处获取该密钥"。
        example:
          type: string

    ProviderCapabilities:
      type: object
      description: 该服务商实际支持的操作。GUI 据此置灰不支持的功能。
      required:
        - available
        - verify
        - dynamic
        - zone_list
        - record_list
        - record_create
        - record_update
        - record_delete
        - all_record_types
        - custom_ttl
        - proxy
        - dns01
      properties:
        available:
          type: boolean
          description: |
            该服务商的实现是否已就绪。

        verify:
          type: boolean
          description: |
            能否校验凭据（"测试连接"）。

            为 false 时界面必须把"测试连接"藏起来或置灰，而不是让用户
            点了才发现这家服务商根本没有只读的校验端点。阿里云 / 腾讯云 /
            华为云 / GoDaddy 当前都没有 —— 用"列一次域名"来冒充会要求
            额外的权限，把只有 DNS 编辑权限的最小权限账号误判为无效。

            为 false 时，服务商出现在列表里只是为了让配置导入与界面展示
            完整，其能力位一律为 false。GUI 应当明确显示"尚未实现"，
            而不是让用户对着一排灰按钮猜原因。
        dynamic:
          type: boolean
          description: |
            能执行动态解析：把 A/AAAA 记录更新到指定 IP。

            Tier-2 服务商只有这一项能力为 true —— 它们存在的意义就是让
            动态地址能被解析，记录管理交给 Tier-1。
        zone_list:
          type: boolean
          description: 能列出账号下的 DNS 区域。
        record_list:
          type: boolean
        record_create:
          type: boolean
        record_update:
          type: boolean
        record_delete:
          type: boolean
        all_record_types:
          type: boolean
          description: 支持 A/AAAA 之外的记录类型（CNAME/MX/TXT/NS/SRV/CAA 等）。
        custom_ttl:
          type: boolean
        proxy:
          type: boolean
          description: 支持 CDN 代理开关（如 Cloudflare 的橙云）。
        dns01:
          type: boolean
          description: 可用于 ACME DNS-01 证书校验。

    # ------------------------------------------------------------------
    # 凭据
    # ------------------------------------------------------------------

    Credential:
      type: object
      required: [id, provider, label, fields, created_at, updated_at]
      properties:
        id:
          type: string
        provider:
          type: string
        label:
          type: string
          description: 用户可读的备注名，用于在界面上区分同一服务商的多组凭据。
        fields:
          type: object
          additionalProperties:
            type: string
          description: |
            凭据字段。**敏感字段一律为掩码值**，明文永不通过接口返回。
            客户端提交更新时若原样回传掩码，内核会保留原值。
        capabilities:
          $ref: "#/components/schemas/ProviderCapabilities"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_verified_at:
          type: string
          format: date-time
        last_verify_ok:
          type: boolean
        last_verify_error:
          type: string

    CredentialInput:
      type: object
      required: [provider, label]
      properties:
        provider:
          type: string
        label:
          type: string
          minLength: 1
        fields:
          type: object
          additionalProperties:
            type: string
          description: |
            凭据字段明文。更新时只提交需要修改的字段；
            敏感字段若提交掩码值则保留原值。

    CredentialList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Credential"
        next_cursor:
          type: string

    # ------------------------------------------------------------------
    # 设置
    # ------------------------------------------------------------------

    Settings:
      type: object
      required: [lang, log_level]
      properties:
        lang:
          type: string
          enum: [zh-CN, en]
        log_level:
          type: string
          enum: [debug, info, warn, error]
        event_buffer_size:
          type: integer
          minimum: 100
          maximum: 100000
          description: 事件环形缓冲容量。调大可延长断线补发的覆盖窗口。
        notify_on_ip_change:
          type: boolean
          description: 地址或 IPv6 前缀变化时是否发送通知（M4 起生效）。

    SettingsPatch:
      type: object
      description: 只提交需要修改的字段。
      properties:
        lang:
          type: string
          enum: [zh-CN, en]
        log_level:
          type: string
          enum: [debug, info, warn, error]
        event_buffer_size:
          type: integer
          minimum: 100
          maximum: 100000
        notify_on_ip_change:
          type: boolean

    # ------------------------------------------------------------------
    # 审计
    # ------------------------------------------------------------------

    AuditResult:
      type: string
      enum: [success, failure, denied]

    AuditEntry:
      type: object
      required: [id, ts, action, result]
      properties:
        id:
          type: integer
          format: int64
        ts:
          type: string
          format: date-time
        action:
          type: string
          description: 稳定的机器可读动作名。
          examples: ["credential.create", "credential.update", "config.import"]
        target:
          type: string
          description: 操作对象的标识（例如凭据 ID 或名称）。
        result:
          $ref: "#/components/schemas/AuditResult"
        detail:
          type: string
          description: 补充说明（已本地化，**不含敏感值**）。
        request_id:
          type: string
        remote:
          type: string
          description: 来源描述。本机管理通道下通常是传输类型而非 IP。

    AuditList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_cursor:
          type: string

    # ------------------------------------------------------------------
    # 配置导入导出
    # ------------------------------------------------------------------

    ImportResult:
      type: object
      required: [dry_run, summary]
      properties:
        dry_run:
          type: boolean
        summary:
          $ref: "#/components/schemas/ImportSummary"
        warnings:
          type: array
          description: 不会导致失败、但用户应当知晓的问题（已本地化）。
          items:
            type: string
        errors:
          type: array
          description: 导致对应条目被跳过的错误（已本地化）。
          items:
            type: string

    ImportSummary:
      type: object
      properties:
        credentials_created:
          type: integer
        credentials_updated:
          type: integer
        credentials_skipped:
          type: integer
        tasks_created:
          type: integer
        tasks_updated:
          type: integer
        tasks_skipped:
          type: integer
        settings_updated:
          type: integer

    # ------------------------------------------------------------------
    # IP 状态
    # ------------------------------------------------------------------

    IPStatus:
      type: object
      required: [interfaces]
      properties:
        interfaces:
          type: array
          description: 参与解析的网卡（已排除回环与虚拟网卡）。
          items:
            $ref: "#/components/schemas/InterfaceAddrs"
        # 便捷字段：多数用户只有一个上联网卡，界面上直接展示它即可。
        primary_ipv4:
          type: string
        primary_ipv6:
          type: string
        primary_prefix:
          type: string

    InterfaceAddrs:
      type: object
      required: [name]
      properties:
        name:
          type: string
        index:
          type: integer
        ipv4:
          type: array
          items:
            type: string
        ipv6:
          type: array
          description: 全部 IPv6 地址（含链路本地，供排查用）。
          items:
            type: string
        global_ipv6:
          type: array
          description: |
            可用于公网访问的 IPv6 地址（已排除链路本地、ULA、回环）。
            动态解析只该用这些地址。
          items:
            type: string
        prefixes:
          type: array
          description: |
            该网卡的 IPv6 委派前缀，例如 240e:3b0:1234:5600::/64。
            **这是 ISP 重拨后真正变化的东西。**
          items:
            type: string
        is_up:
          type: boolean

    # ------------------------------------------------------------------
    # 动态解析任务
    # ------------------------------------------------------------------

    DdnsTask:
      type: object
      required: [id, credential_id, label, enabled, ipv4, ipv6, created_at, updated_at]
      properties:
        id:
          type: string
        credential_id:
          type: string
        label:
          type: string
        enabled:
          type: boolean
        ipv4:
          $ref: "#/components/schemas/DdnsSource"
        ipv6:
          $ref: "#/components/schemas/DdnsSource"
        ttl:
          type: string
          description: 记录生存时间（秒）。空串表示使用服务商默认值。
        http_interface:
          type: string
          description: 发送请求时绑定的网卡名；为空表示默认网卡。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

        # --- 运行状态（只读，由内核写入） ---
        last_run_at:
          type: string
          format: date-time
        last_status:
          $ref: "#/components/schemas/DdnsStatus"
        last_message:
          type: string
          description: 上次执行的说明（已本地化）。
        last_ipv4:
          type: string
        last_ipv6:
          type: string

    DdnsStatus:
      type: string
      enum: ["", success, unchanged, failed]
      description: |
        空串表示从未执行过。

        unchanged 与 success 的区别很重要：前者表示"记录本来就是对的"，
        不该触发通知；后者表示"真的改动了"，值得告诉用户。

    DdnsSource:
      type: object
      required: [enable, get_type, value, domains]
      properties:
        enable:
          type: boolean
          description: 为 false 时该记录类型不参与解析。
        get_type:
          type: string
          enum: [netInterface, url, cmd]
          description: |
            netInterface  从网卡读取（走内核的地址快照，已过滤不可用于公网的地址）
            url           通过外部接口查询，可填多个并用逗号分隔
            cmd           执行命令并从输出中抓取
        value:
          type: string
          description: 网卡名 / URL 列表 / 命令，含义由 get_type 决定。
        domains:
          type: array
          items:
            type: string
          description: |
            要更新的域名。支持两种写法：

              www.example.com   自动识别根域名
              www:example.com   显式指定"子域名:根域名"

            后者用于 publicsuffix 无法正确判断的域名。
        selector:
          type: string
          description: |
            仅 IPv6 使用：地址选择器。

              "@2"        取第 2 个（从 1 开始）
              "^240e:.*"  正则筛选，取第一个匹配的
              留空        取第一个

    DdnsTaskInput:
      type: object
      required: [credential_id, label]
      properties:
        credential_id:
          type: string
        label:
          type: string
          minLength: 1
        enabled:
          type: boolean
        ipv4:
          $ref: "#/components/schemas/DdnsSource"
        ipv6:
          $ref: "#/components/schemas/DdnsSource"
        ttl:
          type: string
        http_interface:
          type: string

    DdnsTaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DdnsTask"

    # ------------------------------------------------------------------
    # DNS 区域与记录
    # ------------------------------------------------------------------

    ZoneList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Zone"

    Zone:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: 服务商侧的区域 ID，用于后续的记录操作。
        name:
          type: string
          description: 区域名，例如 example.com（**不含结尾的点**）。

    Record:
      type: object
      required: [id, name, type, content]
      properties:
        id:
          type: string
          description: |
            服务商侧的记录 ID。

            注意：少数服务商（如 GoDaddy）没有记录 ID，此时内核会合成一个
            稳定标识。合成 ID 在记录内容变化后会失效 —— 详见
            `docs/PROVIDER-MATRIX.md`。
        name:
          type: string
          description: 完整记录名，例如 www.example.com。
        type:
          type: string
          description: 记录类型，例如 A / AAAA / CNAME / MX / TXT / NS / SRV / CAA。
        content:
          type: string
        ttl:
          type: integer
          description: 生存时间（秒）。0 表示使用服务商默认值。
        proxied:
          type: boolean
          description: CDN 代理开关。仅部分服务商的部分记录类型支持。
        comment:
          type: string
        priority:
          type: integer
          description: MX / SRV 记录的优先级。

    RecordInput:
      type: object
      required: [name, type, content]
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        content:
          type: string
        ttl:
          type: integer
          minimum: 0
        proxied:
          type: boolean
        comment:
          type: string
        priority:
          type: integer

    RecordList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Record"
