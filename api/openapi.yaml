openapi: 3.1.0

info:
  title: ISC Core API
  version: 0.1.0
  description: |
    ISC（接入编排器）内核的本地管理接口。

    ## 设计约束

    - **仅本机可达**：内核只监听命名管道 / Unix socket / 回环，绝不对外暴露。
      所有请求（含回环）都必须携带 `Authorization: Bearer <token>`，
      token 从数据目录下的 `runtime.json` 读取。见 docs/DECISIONS.md D09。
    - **快同步 + 慢异步**：列表与详情查询同步返回；所有可能耗时的操作
      （证书签发、凭据校验、防火墙应用、外部可达性验证）返回 `202` 与
      `job_id`，进度通过 `GET /v1/jobs/{id}` 或 WebSocket 事件流获取。
      见 docs/DECISIONS.md D08。
    - **契约优先**：本文件是接口的唯一真理。Go 服务端接口由 oapi-codegen 生成，
      前端类型由 openapi-typescript 生成。修改接口必须先改本文件。

    ## M0 阶段范围

    当前仅有元信息、健康检查、事件流与任务引擎。业务端点随里程碑加入。

servers:
  - url: http://localhost
    description: 实际地址由运行时的 runtime.json 决定（命名管道 / Unix socket / 回环）

tags:
  - name: Meta
    description: 版本、平台能力与健康状态
  - name: Events
    description: 实时事件流
  - name: Jobs
    description: 异步任务
  - name: Providers
    description: DNS 服务商元信息与能力矩阵
  - name: Credentials
    description: DNS 服务商凭据（加密存储）
  - name: IP
    description: 本机地址与 IPv6 前缀
  - name: DdnsTasks
    description: 动态解析任务
  - name: Zones
    description: DNS 区域（Tier-1 服务商）
  - name: Records
    description: DNS 记录管理（Tier-1 服务商）
  - name: Reach
    description: 可达性（让服务能从公网访问）
  - name: Changes
    description: 系统变更记录与撤销
  - name: Verify
    description: 引导式外部验证
  - name: Certs
    description: TLS 证书的申请与续期
  - name: Notify
    description: 通知通道与投递记录
  - name: Service
    description: 把内核注册为系统服务（开机自启、崩溃重启）
  - name: Settings
    description: 运行时设置
  - name: Audit
    description: 审计日志
  - name: Config
    description: 配置导入导出与迁移
  - name: Phecda
    description: Phecda 项目元数据、只读源码扫描和部署状态
  - name: Debug
    description: 仅用于管线自检的调试端点，不属于产品接口

security:
  - bearerAuth: []

paths:
  /v1/health:
    get:
      tags: [Meta]
      operationId: getHealth
      summary: 存活检查
      description: 不依赖任何子系统的最小存活探针，供 CLI 与 GUI 判断内核是否在运行。
      security: []
      responses:
        "200":
          description: 内核存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"

  /v1/meta:
    get:
      tags: [Meta]
      operationId: getMeta
      summary: 元信息与平台能力
      description: |
        返回版本、构建信息、运行平台，以及各平台后端（防火墙 / 服务管理 /
        网卡监控 / 密钥库 / 传输 / 低端口绑定）的实现状态。

        下游 GUI 应当依据 `capabilities` 决定是否置灰相关功能，
        而不是自己去猜 `runtime.GOOS`。
      responses:
        "200":
          description: 元信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        default:
          $ref: "#/components/responses/Problem"

  /v1/events:
    get:
      tags: [Events]
      operationId: subscribeEvents
      summary: 订阅事件流（WebSocket）
      description: |
        升级为 WebSocket 连接后，服务端持续推送内核事件。

        事件带单调递增的 `seq`。客户端断线重连时携带 `lastEventId`，
        服务端会补发序号大于该值的事件；若请求的序号已超出环形缓冲范围，
        则先推送一条 `events.gap` 事件告知客户端需要重新拉取全量状态。
      parameters:
        - name: lastEventId
          in: query
          required: false
          description: 客户端已收到的最后一个事件序号，用于断线补发。
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "101":
          description: 协议升级成功，开始推送事件
        "400":
          description: |
            无法升级为 WebSocket（例如缺少 Upgrade 头）。
            该响应为普通 HTTP 响应，不是 WebSocket 帧。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: 任务列表
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          description: 按状态过滤，可重复传入。
          schema:
            type: array
            items:
              $ref: "#/components/schemas/JobStatus"
          style: form
          explode: true
        - name: kind
          in: query
          required: false
          description: 按任务类型过滤。
          schema:
            type: string
      responses:
        "200":
          description: 任务列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/jobs/{id}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: 任务详情
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/jobs/{id}/cancel:
    post:
      tags: [Jobs]
      operationId: cancelJob
      summary: 取消任务
      description: |
        请求取消一个尚未结束的任务。取消是协作式的：任务实现需自行响应
        `context.Context` 的取消信号。对已结束的任务调用返回 `409`。
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: 已受理取消请求（任务可能仍处于 canceling 状态）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/phecda/presets:
    get:
      tags: [Phecda]
      operationId: listPhecdaPresets
      summary: 列出 Phecda 建站预设
      responses:
        "200":
          description: Phecda 预设目录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhecdaPresetCatalog"
        default:
          $ref: "#/components/responses/Problem"

  /v1/phecda/projects:
    get:
      tags: [Phecda]
      operationId: listPhecdaProjects
      summary: 列出 Phecda 项目
      responses:
        "200":
          description: 项目列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhecdaProjectList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [Phecda]
      operationId: createPhecdaProject
      summary: 登记 Phecda 项目来源
      description: Docker 和非 Docker 来源互斥；image/command Docker 来源不要求源码目录。登记不会执行命令或改变公网配置。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhecdaProjectInput"
      responses:
        "201":
          description: 项目已登记
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhecdaProject"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/phecda/projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Phecda]
      operationId: getPhecdaProject
      summary: 读取 Phecda 项目
      responses:
        "200":
          description: 项目详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhecdaProject"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [Phecda]
      operationId: deletePhecdaProject
      summary: 删除 Phecda 项目登记
      description: 只删除项目元数据，不删除源文件、部署进程、Docker 资源或 DNS 配置。
      responses:
        "204":
          description: 项目登记已删除
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/phecda/projects/{id}/scan:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Phecda]
      operationId: scanPhecdaProject
      summary: 对项目执行只读技术栈扫描
      description: 不执行源码、安装脚本或 Docker 命令；敏感文件和版本控制目录不得进入结果。Docker 使用独立检测器。
      responses:
        "200":
          description: 扫描结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhecdaScanResult"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/phecda/deployments:
    post:
      tags: [Phecda]
      operationId: createPhecdaDeployment
      summary: 登记或更新一个部署状态
      description: 记录 Supervisor 的部署状态；不会由 ISC-Core 执行构建或启动命令。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhecdaDeploymentInput"
      responses:
        "201":
          description: 部署状态已登记
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhecdaDeployment"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    get:
      tags: [Phecda]
      operationId: listPhecdaDeployments
      summary: 列出部署状态
      responses:
        "200":
          description: 部署列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhecdaDeploymentList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/phecda/deployments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Phecda]
      operationId: getPhecdaDeployment
      summary: 读取部署状态
      responses:
        "200":
          description: 部署状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhecdaDeployment"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/debug/noop:
    post:
      tags: [Debug]
      operationId: runNoopJob
      summary: 提交一个空转任务（仅用于管线自检）
      description: |
        **非产品接口。** 提交一个按步进上报进度的空转任务，用于验证
        任务引擎与事件流是否正常。计划在 M1 之后移除。

        `steps` 控制步数，`step_ms` 控制每步耗时。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoopRequest"
      responses:
        "202":
          description: 任务已提交
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # DNS 服务商元信息
  # ---------------------------------------------------------------------------

  /v1/providers:
    get:
      tags: [Providers]
      operationId: listProviders
      summary: 列出支持的 DNS 服务商及其能力与凭据字段
      description: |
        返回内核支持的全部 DNS 服务商，以及每家所需的凭据字段定义。

        **这是下游 GUI 渲染凭据表单的唯一依据** —— GUI 不需要为每家服务商
        写死表单，只需遍历 `credential_fields` 生成输入框。新增服务商时
        内核与 GUI 都不用改代码。

        `capabilities` 声明该服务商支持哪些操作（区域列表、记录增删改查、
        全记录类型、TTL、代理开关、能否用于 ACME DNS-01 校验）。
        GUI 应当据此置灰不支持的功能，而不是等用户点了才报错。
      responses:
        "200":
          description: 服务商列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Provider"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 凭据
  # ---------------------------------------------------------------------------

  /v1/credentials:
    get:
      tags: [Credentials]
      operationId: listCredentials
      summary: 列出全部凭据
      description: |
        返回的凭据中，**敏感字段一律以掩码形式呈现**（例如 `abcd****wxyz`），
        明文永不离开内核。客户端提交更新时若某字段的值等于掩码，
        内核会保留原值而不是把掩码当作新值写入。
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 凭据列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialList"
        default:
          $ref: "#/components/responses/Problem"

    post:
      tags: [Credentials]
      operationId: createCredential
      summary: 新建凭据
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialInput"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          description: 同名凭据已存在
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/credentials/{id}:
    parameters:
      - $ref: "#/components/parameters/CredentialId"

    get:
      tags: [Credentials]
      operationId: getCredential
      summary: 凭据详情
      responses:
        "200":
          description: 凭据详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

    patch:
      tags: [Credentials]
      operationId: updateCredential
      summary: 修改凭据
      description: |
        只更新请求体中出现的字段。敏感字段若提交掩码值则保留原值 ——
        这让"改个标签"不需要重新输入密钥。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialInput"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

    delete:
      tags: [Credentials]
      operationId: deleteCredential
      summary: 删除凭据
      responses:
        "204":
          description: 已删除
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: 凭据仍被引用（例如有动态解析任务或证书在使用它）
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 设置
  # ---------------------------------------------------------------------------

  /v1/settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: 读取运行时设置
      responses:
        "200":
          description: 设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Problem"

    patch:
      tags: [Settings]
      operationId: updateSettings
      summary: 修改运行时设置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: 修改后的完整设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 审计
  # ---------------------------------------------------------------------------

  /v1/audit:
    get:
      tags: [Audit]
      operationId: listAudit
      summary: 查询审计日志
      description: |
        记录所有**写操作**（谁、什么时候、对什么、做了什么、结果如何）。

        存在的意义：内核以系统服务身份运行、能改防火墙、能重写整个 DNS 区域。
        出问题时"最后一次改动是什么、谁改的"是排查的第一入口。
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: action
          in: query
          required: false
          description: 按动作过滤。
          schema:
            type: string
        - name: result
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AuditResult"
      responses:
        "200":
          description: 审计记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 配置导入导出
  # ---------------------------------------------------------------------------

  /v1/config/export:
    get:
      tags: [Config]
      operationId: exportConfig
      summary: 导出配置
      description: |
        导出为 YAML，用于备份与迁移。

        `include_secrets` 默认为 **false**：导出的凭据字段为掩码，
        导入到另一台机器时需要重新填写密钥。这是刻意的默认值 ——
        一个"顺手导出"产生的明文密钥文件是常见的事故来源。
      parameters:
        - name: include_secrets
          in: query
          required: false
          description: 设为 true 才会导出明文凭据（务必妥善保管导出文件）。
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: 配置 YAML
          content:
            application/yaml:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"

  /v1/config/import:
    get:
      tags: [Config]
      operationId: describeImport
      summary: 说明导入行为
      description: |
        该端点只做说明，不做任何事。真正的导入用 POST。

        （保留它是因为 OpenAPI 3.1 的 `GET` 与 `POST` 语义需要分开表达，
        而客户端需要能发现"导入会做什么、会不会覆盖现有配置"。）
      responses:
        "200":
          description: 导入行为的说明
          content:
            application/json:
              schema:
                type: object
                properties:
                  dry_run_supported:
                    type: boolean
                  notes:
                    type: string
        default:
          $ref: "#/components/responses/Problem"

    post:
      tags: [Config]
      operationId: importConfig
      summary: 导入配置
      description: |
        `dry_run` 默认为 **true**：先返回"将会发生什么"（新建多少条、
        覆盖多少条、哪些会失败），确认后再以 `dry_run=false` 提交。

        这与 `docs/DECISIONS.md` D10 的"计划 → 预览 → 应用 → 回滚"
        是同一套思路：导入是破坏性操作，不该一步到位。
      parameters:
        - name: dry_run
          in: query
          required: false
          schema:
            type: boolean
            default: true
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: 导入结果（dry_run 时为预览）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/config/import/ddns-go:
    post:
      tags: [Config]
      operationId: importDdnsGoConfig
      summary: 导入 ddns-go 配置
      description: |
        把 ddns-go 的 YAML 配置迁移为 ISC 的凭据与动态解析任务。

        迁移要点：
        - ddns-go 的每个 `dnsconf` 条目里，`dns.name` / `dns.id` / `dns.secret`
          被抽取为一个凭据（多条条目共用同一凭据时只建一个）；
        - `ipv4` / `ipv6` 的获取方式（网卡 / URL / 命令）与域名列表
          被转换为动态解析任务；
        - ddns-go 的 webhook 配置被转换为一个通知通道（M4 接入通知中心后生效）。
      parameters:
        - name: dry_run
          in: query
          required: false
          schema:
            type: boolean
            default: true
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
      responses:
        "200":
          description: 迁移结果（dry_run 时为预览）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # IP 状态
  # ---------------------------------------------------------------------------

  /v1/ip/current:
    get:
      tags: [IP]
      operationId: getCurrentIP
      summary: 读取当前网卡地址与 IPv6 前缀
      description: |
        返回全部物理网卡的地址，以及**可用于公网访问的 IPv6 地址所对应的前缀**。

        前缀是本产品的核心概念：ISP 重拨后变化的是整个 /64 前缀，
        该前缀下的所有 AAAA 记录都要重写，而不是只改一个地址。

        回环与虚拟网卡（Docker 网桥、VPN 隧道等）被排除 ——
        它们的变化与"公网地址变了"毫无关系。
      responses:
        "200":
          description: 当前地址状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IPStatus"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 动态解析任务
  # ---------------------------------------------------------------------------

  /v1/ddns-tasks:
    get:
      tags: [DdnsTasks]
      operationId: listDdnsTasks
      summary: 列出动态解析任务
      responses:
        "200":
          description: 任务列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdnsTaskList"
        default:
          $ref: "#/components/responses/Problem"

    post:
      tags: [DdnsTasks]
      operationId: createDdnsTask
      summary: 新建动态解析任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DdnsTaskInput"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdnsTask"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/ddns-tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/DdnsTaskId"

    get:
      tags: [DdnsTasks]
      operationId: getDdnsTask
      summary: 任务详情
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdnsTask"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

    patch:
      tags: [DdnsTasks]
      operationId: updateDdnsTask
      summary: 修改任务
      description: |
        修改后内核会**清空该任务的防抖缓存**，使下一次执行必定与服务商比对。

        没有这一步的话，用户改了域名却发现"半天没生效" ——
        因为防抖逻辑认为地址没变、还没到比对时机。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DdnsTaskInput"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdnsTask"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

    delete:
      tags: [DdnsTasks]
      operationId: deleteDdnsTask
      summary: 删除任务
      responses:
        "204":
          description: 已删除
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/ddns-tasks/{id}/run:
    parameters:
      - $ref: "#/components/parameters/DdnsTaskId"
    post:
      tags: [DdnsTasks]
      operationId: runDdnsTask
      summary: 立即执行一次任务
      description: |
        忽略防抖缓存，立刻执行一次。用于"配好了想马上验证"。

        返回 202 与任务 ID：一次执行可能包含多个域名的更新，
        在服务商限流时可能耗时数秒，做成同步会让界面卡住。
      responses:
        "202":
          description: 已开始执行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # DNS 区域与记录（Tier-1 服务商）
  # ---------------------------------------------------------------------------

  /v1/credentials/{id}/verify:
    post:
      tags: [Credentials]
      operationId: verifyCredential
      summary: 校验凭据是否可用（"测试连接"）
      description: |
        **不是所有服务商都支持。** 阿里云 / 腾讯云 / 华为云 / GoDaddy 没有
        只读的校验端点，而用"列一次域名"来冒充会要求额外的权限 —— 那会把
        只有 DNS 编辑权限的最小权限账号误判为无效。

        不支持时返回 `ok: false`，而 `message` 会说明是**不支持**而不是
        **连不上** —— 否则用户会去查一个根本不存在的连接问题。

        这个端点始终返回 200：校验失败是一种**结果**，而不是请求错误。
        用 4xx/5xx 表达它会让客户端难以区分"凭据不可用"与"请求本身有问题"。
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "200":
          description: 校验结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialVerifyResult"
        default:
          $ref: "#/components/responses/Problem"
  /v1/credentials/{id}/zones:
    parameters:
      - $ref: "#/components/parameters/CredentialId"
    get:
      tags: [Zones]
      operationId: listZones
      summary: 列出该凭据可管理的 DNS 区域
      description: |
        路径里带上凭据 ID 而不是把区域 ID 做成全局唯一：区域存在于服务商
        那边，内核不持久化它们。若把 (凭据, 区域) 压成一个本地 ID，
        就得维护一份缓存并处理它过期的问题 —— 而每次实时查询既简单又准确。

        `capabilities.zone_list` 为 false 的服务商会返回 400，
        而不是一个空列表：空列表会让用户以为"我这个账号下没有域名"。
      responses:
        "200":
          description: 区域列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneList"
        "400":
          description: 该服务商不支持列出区域
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/credentials/{id}/zones/{zoneId}/records:
    parameters:
      - $ref: "#/components/parameters/CredentialId"
      - $ref: "#/components/parameters/ZoneId"
    get:
      tags: [Records]
      operationId: listRecords
      summary: 列出区域内的 DNS 记录
      parameters:
        - name: type
          in: query
          required: false
          description: 按记录类型过滤。
          schema:
            type: string
        - name: name
          in: query
          required: false
          description: 按记录名精确过滤（完整域名）。
          schema:
            type: string
      responses:
        "200":
          description: 记录列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordList"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

    post:
      tags: [Records]
      operationId: createRecord
      summary: 新增 DNS 记录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordInput"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/credentials/{id}/zones/{zoneId}/records/{recordId}:
    parameters:
      - $ref: "#/components/parameters/CredentialId"
      - $ref: "#/components/parameters/ZoneId"
      - $ref: "#/components/parameters/RecordId"
    get:
      tags: [Records]
      operationId: getRecord
      summary: 读取单条记录
      responses:
        "200":
          description: 记录详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

    put:
      tags: [Records]
      operationId: updateRecord
      summary: 修改 DNS 记录
      description: |
        用 PUT 而不是 PATCH：请求体是**完整的记录**，服务商那边也是
        整体替换语义。用 PATCH 的话，"清空备注"这类操作需要显式传 null，
        而各家对 null 的处理不一致，容易产生歧义。

        注意：部分服务商（如 GoDaddy）的记录没有独立 ID，
        且"同名同类型"可以有多条值。那类服务商的删除语义会退化为
        "删除该名字该类型的全部记录" —— 详见 `docs/PROVIDER-MATRIX.md`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordInput"
      responses:
        "200":
          description: 修改后的记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

    delete:
      tags: [Records]
      operationId: deleteRecord
      summary: 删除 DNS 记录
      responses:
        "204":
          description: 已删除
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 可达性
  # ---------------------------------------------------------------------------

  /v1/reach/providers:
    get:
      tags: [Reach]
      operationId: listReachProviders
      summary: 列出全部可达方式
      description: |
        「可达方式」是让本机服务能从公网访问的途径。

        默认是 IPv6 直连（不需要公网 IPv4、不需要中转服务器、
        流量不经过第三方）。后续会加入经中转服务器的方案，
        供运营商封禁入站连接时换路。
      responses:
        "200":
          description: 可达方式列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReachProviderList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/reach/providers/{name}/probe:
    parameters:
      - $ref: "#/components/parameters/ReachProviderName"
    get:
      tags: [Reach]
      operationId: probeReachProvider
      summary: 探测某种可达方式当前是否可用
      description: |
        **只读操作**，不产生任何系统变更。

        返回的检测项按「从下到上」排列（本机地址 → 委派前缀 →
        防火墙后端 → 服务监听 → 上游可达性），用户按顺序逐项修复即可。

        注意 `scope` 字段：

        - `local`    本机做的检测，失败说明本机还需要配置
        - `upstream` 需要外部视角才能做的检测

        本机**无法**验证上游可达性 —— 从本机访问自己的公网地址通常走
        回环（NAT 发夹），无论运营商是否放行都会"成功"。因此那一项
        永远是 `unknown`，必须用手机流量做外部验证才能确认。
      responses:
        "200":
          description: 探测结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReachReadiness"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 变更记录
  # ---------------------------------------------------------------------------

  /v1/changes:
    get:
      tags: [Changes]
      operationId: listChanges
      summary: 列出历史系统变更
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 变更记录列表（按时间倒序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/changes/{planId}:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    get:
      tags: [Changes]
      operationId: getChange
      summary: 读取单条变更记录
      responses:
        "200":
          description: 变更记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRecord"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/changes/interrupted:
    get:
      tags: [Changes]
      operationId: listInterruptedChanges
      summary: 列出被中断的变更
      description: |
        返回停留在「执行中」状态的变更 —— 它们说明内核上次没有走完
        整个流程（多半是异常退出），系统里可能留有半成品。

        **内核不会自动撤销它们**，这是刻意的：一次执行中的变更可能
        已经部分生效，而用户可能正依赖那部分（例如他已经通过新开的
        端口连上了服务）。启动时擅自撤掉会拿走用户正在用的东西，
        而他完全不知道发生了什么。

        因此这里只报告，由用户决定是否撤销。
      responses:
        "200":
          description: 被中断的变更列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeList"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 外部验证
  # ---------------------------------------------------------------------------

  /v1/verify/sessions:
    get:
      tags: [Verify]
      operationId: listVerifySessions
      summary: 列出外部验证会话
      responses:
        "200":
          description: 会话列表（最近的在前）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifySessionList"
        default:
          $ref: "#/components/responses/Problem"

    post:
      tags: [Verify]
      operationId: startVerifySession
      summary: 开始一次外部验证
      description: |
        在本机临时监听一个端口，生成一个带随机路径的 URL，
        引导用户用手机（关闭 Wi-Fi，走 4G/5G）打开它。

        这是唯一能回答"从外面到底能不能连上"的手段 —— 本机做不到，
        因为从本机访问自己的公网地址走的是回环或直连，无论运营商
        是否放行都会"成功"。

        **判断依据是来源地址**，分三档：

        - 来自公网地址        → `reachable`，链路确实通
        - 只来自本机/内网地址  → `hairpin_only`，**什么也证明不了**
        - 超时没有收到任何访问 → `unreachable`，结合本机检测全绿，
          结论指向上游封禁
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyStartRequest"
      responses:
        "201":
          description: 会话已开始
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifySession"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/verify/sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/VerifySessionId"
    get:
      tags: [Verify]
      operationId: getVerifySession
      summary: 读取验证会话
      responses:
        "200":
          description: 会话详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifySession"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

    delete:
      tags: [Verify]
      operationId: stopVerifySession
      summary: 停止验证会话
      description: |
        关闭临时监听并保留记录 —— 用户可能想回看上次验证的结果。
      responses:
        "204":
          description: 已停止
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/reach/providers/{name}/plan:
    parameters:
      - $ref: "#/components/parameters/ReachProviderName"
    post:
      tags: [Reach]
      operationId: planReachExpose
      summary: 生成一份"放行端口"的变更计划
      description: |
        **不产生任何系统变更** —— 它只计算差异并把计划登记在内核里，
        返回一份可读的预览。

        确认之后调用 `POST /v1/changes/{planId}/apply` 才会真正执行。

        计划在内核里保留 10 分钟后过期。过期是刻意的：预览里的差异是
        基于**当时**的系统状态算出来的，放太久之后状态可能已经变了
        （别人手工加了规则），那时再应用会让实际效果与用户看到的
        差异不符。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExposeRequest"
      responses:
        "200":
          description: 计划预览
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePreview"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/changes/pending:
    get:
      tags: [Changes]
      operationId: listPendingChanges
      summary: 列出待确认的变更计划
      responses:
        "200":
          description: 待确认的计划（最近的在前）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePreviewList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/changes/{planId}/apply:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    post:
      tags: [Changes]
      operationId: applyChange
      summary: 应用一个已确认的变更计划
      description: |
        计划在取出时即被消费，因此**重复调用会返回 404** ——
        用户双击"应用"不会执行两次。

        失败时内核会**自动按相反顺序撤销已生效的步骤**。若自动回滚
        本身也失败，状态会是 `rollback_failed`，那意味着系统处于
        既非原状也非目标的中间态 —— 界面必须显著提示。
      responses:
        "200":
          description: 执行结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRecord"
        "404":
          description: 计划不存在或已过期，需要重新生成
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/changes/{planId}/rollback:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    post:
      tags: [Changes]
      operationId: rollbackChange
      summary: 撤销一次已生效的变更
      description: |
        它走各后端登记的撤销器，因此**跨越内核重启依然可用**。

        幂等：已经撤销过的计划再撤一次会返回成功。用户重试是常见操作
        （网络卡了、按钮点重了），把重试当失败会让他以为撤销没生效，
        进而做出更激进的处置。
      responses:
        "200":
          description: 撤销结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRecord"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: |
            变更仍处于执行中状态，暂时不能撤销 —— 那个进程可能还在写
            系统状态，两边同时动手会得到谁也没预料到的结果。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 反向代理
  # ---------------------------------------------------------------------------

  /v1/proxy/status:
    get:
      tags: [Proxy]
      operationId: getProxyStatus
      summary: 读取反向代理的运行时状态
      responses:
        "200":
          description: 状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyStatus"
        default:
          $ref: "#/components/responses/Problem"

  /v1/proxy/routes:
    get:
      tags: [Proxy]
      operationId: listProxyRoutes
      summary: 列出全部转发规则
      responses:
        "200":
          description: 规则列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyRouteList"
        default:
          $ref: "#/components/responses/Problem"

    put:
      tags: [Proxy]
      operationId: replaceProxyRoutes
      summary: 整体替换转发规则
      description: |
        **整体替换**，不是增删改。

        规则表必须始终自洽：同一个域名不能同时指向两个上游。增量修改会
        让"检查冲突"变成一件需要跨多次调用才能完成的事，而中间任何一个
        时刻的状态都可能有冲突 —— 那期间进来的请求会打到哪一条是不确定的。

        整体替换让"检查 + 生效"变成一次原子操作。保存成功后会**立即生效**，
        不需要重启监听（在途请求不会被切断）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProxyRouteList"
      responses:
        "200":
          description: 保存后的规则列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyRouteList"
        "400":
          description: |
            规则不合法。常见的几种：上游不是本机地址、上游缺少端口、
            域名格式不对、同一个域名被两条路由使用。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 证书
  # ---------------------------------------------------------------------------

  /v1/certs:
    get:
      tags: [Certs]
      operationId: listCerts
      summary: 列出证书与它们的续期状态
      description: |
        每张证书会带上 `needs_renew` 与 `reason` —— 后者解释**为什么**
        需要续期。用户在界面上看到"需要续期"时的第一个问题就是"为什么"，
        少了理由他只能猜。
      responses:
        "200":
          description: 证书列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/certs/renew:
    post:
      tags: [Certs]
      operationId: renewCerts
      summary: 立即检查并为全部 HTTPS 路由申请（或续期）证书
      description: |
        正常情况下证书会在到期前自动续期。这个端点用于**手动触发**——
        典型场景是刚加了一条 HTTPS 路由，想立刻拿到证书而不想等下一轮检查。

        它是**幂等**的：已经有效的证书不会被重新签发（那会白白消耗
        ACME 的配额）。
      responses:
        "200":
          description: 续期后的证书列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertList"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 通知
  # ---------------------------------------------------------------------------

  /v1/notify/channels:
    get:
      tags: [Notify]
      operationId: listNotifyChannels
      summary: 列出通知通道
      responses:
        "200":
          description: 通道列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifyChannelList"
        default:
          $ref: "#/components/responses/Problem"

    put:
      tags: [Notify]
      operationId: replaceNotifyChannels
      summary: 整体替换通知通道
      description: |
        **整体替换**，理由是顺序与冲突（同一个 ID）在整体替换下才有
        明确的语义。

        保存前会**逐个构造一遍**：模板语法错误之类的"构造期才暴露"的
        问题因此在这里就被挡住，而不是等到某天真的要发通知时才发现。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifyChannelList"
      responses:
        "200":
          description: 保存后的通道列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifyChannelList"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/notify/deliveries:
    get:
      tags: [Notify]
      operationId: listNotifyDeliveries
      summary: 列出最近的通知投递结果
      description: |
        回答那个配置通道时最常被问到的问题：**"我的通知到底发出去了没有"**。

        只写日志的话，用户得去翻日志文件才答得上来。
      responses:
        "200":
          description: 投递记录（最新的在前）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifyDeliveryList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/notify/test:
    post:
      tags: [Notify]
      operationId: testNotifyChannels
      summary: 向全部通道发送一条测试通知
      description: |
        **绕过去重与队列**：用户点了按钮之后期待立刻看到结果，
        而不是等下一个投递循环。

        返回每个通道的结果 —— 某个通道配错了应当立刻看得出来。
      responses:
        "200":
          description: 各通道的投递结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifyDeliveryList"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 系统服务
  # ---------------------------------------------------------------------------

  /v1/service/status:
    get:
      tags: [Service]
      operationId: getServiceStatus
      summary: 查询系统服务状态
      description: |
        它同时报出两件事：

        	daemon_reachable   内核现在是否真的能连通（**不需要权限**）
        	status             操作系统里的服务状态（**需要管理员权限**）

        分开报是有原因的：Windows 上**查询**服务状态同样需要管理员
        （打开 SCM 要完全访问权），而用户真正想知道的往往是前者。
        因此服务查询失败时 `error` 有值、`status` 缺省，而接口本身
        仍然返回 200。
      responses:
        "200":
          description: 服务状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStatusInfo"
        default:
          $ref: "#/components/responses/Problem"

  /v1/service/install:
    post:
      tags: [Service]
      operationId: installService
      summary: 安装系统服务（需要管理员权限）
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInstallRequest"
      responses:
        "200":
          $ref: "#/components/responses/ServiceOK"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/service/uninstall:
    post:
      tags: [Service]
      operationId: uninstallService
      summary: 停止并删除系统服务（需要管理员权限）
      description: |
        **幂等**：服务本来就不存在时返回成功。报错会让"先卸再装"这类
        部署脚本失败，而那是最常见的写法。

        数据目录**不会**被删除。
      responses:
        "200":
          $ref: "#/components/responses/ServiceOK"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/service/start:
    post:
      tags: [Service]
      operationId: startService
      summary: 启动系统服务（需要管理员权限）
      responses:
        "200":
          $ref: "#/components/responses/ServiceOK"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/service/stop:
    post:
      tags: [Service]
      operationId: stopService
      summary: 停止系统服务（需要管理员权限）
      responses:
        "200":
          $ref: "#/components/responses/ServiceOK"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        token 位于数据目录的 `runtime.json` 中（字段 `token`），
        由内核首次启动时生成的 32 字节随机值经 base64url 编码得到。

  parameters:
    JobId:
      name: id
      in: path
      required: true
      description: 任务 ID
      schema:
        type: string
        minLength: 1
    CredentialId:
      name: id
      in: path
      required: true
      description: 凭据 ID
      schema:
        type: string
        minLength: 1
    DdnsTaskId:
      name: id
      in: path
      required: true
      description: 动态解析任务 ID
      schema:
        type: string
        minLength: 1
    ZoneId:
      name: zoneId
      in: path
      required: true
      description: 服务商侧的 DNS 区域 ID
      schema:
        type: string
        minLength: 1
    RecordId:
      name: recordId
      in: path
      required: true
      description: 服务商侧的记录 ID
      schema:
        type: string
        minLength: 1
    ReachProviderName:
      name: name
      in: path
      required: true
      description: 可达方式标识，例如 ipv6-native
      schema:
        type: string
        minLength: 1
    PlanId:
      name: planId
      in: path
      required: true
      description: 变更计划 ID
      schema:
        type: string
        minLength: 1
    VerifySessionId:
      name: id
      in: path
      required: true
      description: 外部验证会话 ID
      schema:
        type: string
        minLength: 1
    Cursor:
      name: cursor
      in: query
      required: false
      description: 分页游标，取自上一次响应的 next_cursor。
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: 单页条数。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  responses:
    ServiceOK:
      description: 操作成功
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ServiceActionResult"
    Problem:
      description: 错误响应（RFC 9457 problem+json）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    # ------------------------------------------------------------------
    # 错误
    # ------------------------------------------------------------------

    Problem:
      type: object
      description: RFC 9457 定义的错误对象。
      required: [type, title, status]
      properties:
        type:
          type: string
          description: 标识错误类型的 URI。
          examples: ["https://isc.local/problems/not-found"]
        title:
          type: string
          description: 简短的人类可读摘要（已本地化）。
        status:
          type: integer
          description: HTTP 状态码。
          minimum: 100
          maximum: 599
        detail:
          type: string
          description: 本次错误的具体说明（已本地化）。
        instance:
          type: string
          description: 出错的具体请求路径。
        code:
          type: string
          description: |
            稳定的机器可读错误码，供客户端分支判断。
            与 title/detail 不同，该字段不随语言变化。
          examples: ["job_not_found", "job_not_cancelable"]
        request_id:
          type: string
          description: 请求 ID，便于在内核日志中定位。

    # ------------------------------------------------------------------
    # 元信息
    # ------------------------------------------------------------------

    Health:
      type: object
      required: [status, uptime_seconds]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: degraded 表示存活但至少有子系统不可用。
        uptime_seconds:
          type: integer
          format: int64
          minimum: 0
        version:
          type: string

    Meta:
      type: object
      required: [version, api_version, os, arch, started_at, capabilities]
      properties:
        version:
          type: string
          description: 内核版本，开发构建为 dev。
        api_version:
          type: string
          description: 本接口的版本，当前为 v1。
        commit:
          type: string
          description: 构建时的 git commit，未知时为空串。
        build_time:
          type: string
          description: 构建时间（RFC 3339），未知时为空串。
        os:
          type: string
          description: 运行平台（GOOS）。
          examples: [windows, linux, darwin]
        arch:
          type: string
          description: 运行架构（GOARCH）。
          examples: [amd64, arm64]
        started_at:
          type: string
          format: date-time
        capabilities:
          $ref: "#/components/schemas/Capabilities"

    Capabilities:
      type: object
      description: 各平台后端的实现状态。不可用的后端意味着对应功能降级为引导模式。
      required: [firewall, service_manager, ip_monitor, secret_store, transport, low_port_binder]
      properties:
        firewall:
          $ref: "#/components/schemas/ImplState"
        service_manager:
          $ref: "#/components/schemas/ImplState"
        ip_monitor:
          $ref: "#/components/schemas/ImplState"
        secret_store:
          $ref: "#/components/schemas/ImplState"
        transport:
          $ref: "#/components/schemas/ImplState"
        low_port_binder:
          $ref: "#/components/schemas/ImplState"

    ImplState:
      type: object
      required: [available, backend]
      properties:
        available:
          type: boolean
          description: 为 false 时该功能降级为引导模式（只提示用户该做什么）。
        backend:
          type: string
          description: 后端名称。
          examples: ["nftables", "netsh", "unsupported:firewall"]
        note:
          type: string
          description: 给用户看的补充说明（已本地化）。

    # ------------------------------------------------------------------
    # 任务
    # ------------------------------------------------------------------

    JobStatus:
      type: string
      enum:
        - pending
        - running
        - succeeded
        - failed
        - canceled
      description: |
        pending  已提交，尚未开始
        running  执行中
        succeeded 成功结束
        failed   失败结束（见 error 字段）
        canceled 被取消

    Job:
      type: object
      required: [id, kind, status, progress, created_at]
      properties:
        id:
          type: string
        kind:
          type: string
          description: 任务类型标识，供客户端分类展示。
          examples: ["debug.noop", "credentials.verify", "certs.issue"]
        status:
          $ref: "#/components/schemas/JobStatus"
        progress:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: 进度，0 到 1。未知进度时为 0。
        message:
          type: string
          description: 当前步骤的人类可读描述（已本地化）。
        result:
          description: 任务成功时的结果，结构由任务类型决定。
        error:
          $ref: "#/components/schemas/Problem"
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time

    JobAccepted:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string

    JobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        next_cursor:
          type: string
          description: 为空表示没有更多数据。

    PhecdaPresetCatalog:
      type: object
      required: [non_docker, docker]
      properties:
        non_docker:
          type: array
          items:
            $ref: "#/components/schemas/PhecdaPreset"
        docker:
          type: array
          items:
            $ref: "#/components/schemas/PhecdaPreset"

    PhecdaPreset:
      type: object
      required: [id, version, title, runtime, docker_only, default_port, detector_files]
      properties:
        id: {type: string}
        version: {type: string}
        title: {type: string}
        runtime:
          type: string
          enum: [staticFiles, node, python, php, go, java, docker]
        docker_only: {type: boolean}
        default_port: {type: integer, minimum: 1, maximum: 65535}
        detector_files:
          type: array
          items: {type: string}

    PhecdaProjectInput:
      type: object
      required: [name, purpose, source]
      properties:
        name: {type: string, minLength: 1}
        purpose:
          type: string
          enum: [website, api, gameServer, fileService, custom]
        source:
          $ref: "#/components/schemas/PhecdaProjectSource"

    PhecdaProjectSource:
      oneOf:
        - $ref: "#/components/schemas/PhecdaNonDockerSource"
        - $ref: "#/components/schemas/PhecdaDockerSource"

    PhecdaNonDockerSource:
      type: object
      required: [mode, value]
      properties:
        mode:
          type: string
          enum: [directory, archive, git]
        value: {type: string}
        ref: {type: string}

    PhecdaDockerSource:
      type: object
      required: [mode, value]
      properties:
        mode:
          type: string
          enum: [composeFile, dockerfileDirectory, image, command]
        value: {type: string}

    PhecdaProject:
      type: object
      required: [id, name, purpose, source, evidence]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        purpose: {type: string}
        source:
          $ref: "#/components/schemas/PhecdaProjectSource"
        detected_runtime:
          type: string
          enum: [staticFiles, node, python, php, go, java, docker]
        selected_preset_id: {type: string}
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/PhecdaScanEvidence"

    PhecdaProjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PhecdaProject"

    PhecdaScanEvidence:
      type: object
      required: [file, signal, confidence]
      properties:
        file: {type: string}
        signal: {type: string}
        confidence: {type: number, minimum: 0, maximum: 1}

    PhecdaScanResult:
      type: object
      required: [project_id, read_only, evidence, candidates]
      properties:
        project_id: {type: string, format: uuid}
        read_only: {type: boolean}
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/PhecdaScanEvidence"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/PhecdaPreset"
        warning: {type: string}

    PhecdaDeploymentInput:
      type: object
      required: [project_id, preset_id, state]
      properties:
        project_id: {type: string, format: uuid}
        preset_id: {type: string}
        state:
          type: string
          enum: [draft, scanning, preparing, building, running, stopped, failed]
        local_port: {type: integer}
        last_error: {type: string}

    PhecdaDeployment:
      type: object
      required: [id, project_id, preset_id, state]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        preset_id: {type: string}
        state:
          type: string
          enum: [draft, scanning, preparing, building, running, stopped, failed]
        local_port: {type: integer}
        last_error: {type: string}

    PhecdaDeploymentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PhecdaDeployment"

    NoopRequest:
      type: object
      properties:
        steps:
          type: integer
          minimum: 1
          maximum: 100
          default: 5
        step_ms:
          type: integer
          minimum: 0
          maximum: 10000
          default: 200
        fail_at_step:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
          description: 大于 0 时在第 N 步失败，用于验证失败路径。

    # ------------------------------------------------------------------
    # DNS 服务商
    # ------------------------------------------------------------------

    Provider:
      type: object
      required: [name, display_name, capabilities, credential_fields]
      properties:
        name:
          type: string
          description: 服务商标识，用于凭据的 provider 字段。
          examples: [cloudflare, alidns, dnspod]
        display_name:
          type: string
          description: 展示名称（已本地化）。
        tier:
          type: integer
          enum: [1, 2]
          description: |
            能力分层：
              1 = 完整记录 CRUD + 动态解析（Tier-1）
              2 = 仅 A/AAAA 动态解析（Tier-2，移植自 ddns-go）
        capabilities:
          $ref: "#/components/schemas/ProviderCapabilities"
        credential_fields:
          type: array
          description: |
            该服务商所需的凭据字段。GUI 遍历它生成表单，
            因此**不需要为每家服务商写死界面**。
          items:
            $ref: "#/components/schemas/ProviderField"

    ProviderField:
      type: object
      required: [key, label, secret, required]
      properties:
        key:
          type: string
          description: 字段名，用作凭据 fields 中的键。
          examples: [id, secret, ext_param]
        label:
          type: string
          description: 展示名称（已本地化）。
        secret:
          type: boolean
          description: |
            为 true 时该字段是敏感值：读取时被掩码，界面应使用密码输入框，
            且不参与日志与导出（除非显式要求导出明文）。
        required:
          type: boolean
        placeholder:
          type: string
          description: 输入提示。
        help:
          type: string
          description: 补充说明，例如"在何处获取该密钥"。
        example:
          type: string

    ProviderCapabilities:
      type: object
      description: 该服务商实际支持的操作。GUI 据此置灰不支持的功能。
      required:
        - available
        - verify
        - dynamic
        - zone_list
        - record_list
        - record_create
        - record_update
        - record_delete
        - all_record_types
        - custom_ttl
        - proxy
        - dns01
      properties:
        available:
          type: boolean
          description: |
            该服务商的实现是否已就绪。

        verify:
          type: boolean
          description: |
            能否校验凭据（"测试连接"）。

            为 false 时界面必须把"测试连接"藏起来或置灰，而不是让用户
            点了才发现这家服务商根本没有只读的校验端点。阿里云 / 腾讯云 /
            华为云 / GoDaddy 当前都没有 —— 用"列一次域名"来冒充会要求
            额外的权限，把只有 DNS 编辑权限的最小权限账号误判为无效。

            为 false 时，服务商出现在列表里只是为了让配置导入与界面展示
            完整，其能力位一律为 false。GUI 应当明确显示"尚未实现"，
            而不是让用户对着一排灰按钮猜原因。
        dynamic:
          type: boolean
          description: |
            能执行动态解析：把 A/AAAA 记录更新到指定 IP。

            Tier-2 服务商只有这一项能力为 true —— 它们存在的意义就是让
            动态地址能被解析，记录管理交给 Tier-1。
        zone_list:
          type: boolean
          description: 能列出账号下的 DNS 区域。
        record_list:
          type: boolean
        record_create:
          type: boolean
        record_update:
          type: boolean
        record_delete:
          type: boolean
        all_record_types:
          type: boolean
          description: 支持 A/AAAA 之外的记录类型（CNAME/MX/TXT/NS/SRV/CAA 等）。
        custom_ttl:
          type: boolean
        proxy:
          type: boolean
          description: 支持 CDN 代理开关（如 Cloudflare 的橙云）。
        dns01:
          type: boolean
          description: 可用于 ACME DNS-01 证书校验。

    # ------------------------------------------------------------------
    # 凭据
    # ------------------------------------------------------------------

    Credential:
      type: object
      required: [id, provider, label, fields, created_at, updated_at]
      properties:
        id:
          type: string
        provider:
          type: string
        label:
          type: string
          description: 用户可读的备注名，用于在界面上区分同一服务商的多组凭据。
        fields:
          type: object
          additionalProperties:
            type: string
          description: |
            凭据字段。**敏感字段一律为掩码值**，明文永不通过接口返回。
            客户端提交更新时若原样回传掩码，内核会保留原值。
        capabilities:
          $ref: "#/components/schemas/ProviderCapabilities"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_verified_at:
          type: string
          format: date-time
        last_verify_ok:
          type: boolean
        last_verify_error:
          type: string

    CredentialInput:
      type: object
      required: [provider, label]
      properties:
        provider:
          type: string
        label:
          type: string
          minLength: 1
        fields:
          type: object
          additionalProperties:
            type: string
          description: |
            凭据字段明文。更新时只提交需要修改的字段；
            敏感字段若提交掩码值则保留原值。

    CredentialList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Credential"
        next_cursor:
          type: string

    # ------------------------------------------------------------------
    # 设置
    # ------------------------------------------------------------------

    Settings:
      type: object
      required: [lang, log_level]
      properties:
        lang:
          type: string
          enum: [zh-CN, en]
        log_level:
          type: string
          enum: [debug, info, warn, error]
        event_buffer_size:
          type: integer
          minimum: 100
          maximum: 100000
          description: 事件环形缓冲容量。调大可延长断线补发的覆盖窗口。
        notify_on_ip_change:
          type: boolean
          description: 地址或 IPv6 前缀变化时是否发送通知。
        proxy_enabled:
          type: boolean
          description: |
            是否启动反向代理。

            默认**关闭**：反代监听在公网上，开启它是一个需要明确决定的
            动作。默认开着会让"我只是想用动态解析"的用户莫名其妙地多出
            一个对外的监听端口。
        proxy_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: |
            反向代理的监听端口。

            默认 443 而不是 8080：用户访问的地址里不该带端口号，
            而 443 是浏览器默认补的那个。
        proxy_tls:
          type: boolean
          description: |
            反向代理是否用 HTTPS 提供服务。

            开启它需要同时配置 ACME（DNS-01 凭据），否则证书签不出来，
            而症状是"浏览器报证书错误"。
        acme_email:
          type: string
          description: |
            ACME 账户的联系邮箱。

            它很重要：证书快要过期而自动续期失败时，CA 会用它来提醒。
            不填会让"续期静默失败"变成"站点某天突然打不开"。
        acme_directory:
          type: string
          description: |
            ACME 目录地址。留空用生产环境。

            测试环境（staging）签发的证书**不被浏览器信任**，但配额宽松
            得多 —— 首次配置时值得用它试一遍，因为生产环境的失败配额是
            每小时 5 次，调配置很容易把它用光。
        acme_dns_credential_id:
          type: string
          description: |
            做 DNS-01 校验用的凭据 ID。

            该凭据对应的服务商必须支持完整的记录管理（Tier-1 六家之一）——
            DNS-01 需要在你的 DNS 里创建一条 TXT 记录。

    SettingsPatch:
      type: object
      description: 只提交需要修改的字段。
      properties:
        proxy_enabled:
          type: boolean
        proxy_port:
          type: integer
          minimum: 1
          maximum: 65535
        proxy_tls:
          type: boolean
        acme_email:
          type: string
        acme_directory:
          type: string
        acme_dns_credential_id:
          type: string
        lang:
          type: string
          enum: [zh-CN, en]
        log_level:
          type: string
          enum: [debug, info, warn, error]
        event_buffer_size:
          type: integer
          minimum: 100
          maximum: 100000
        notify_on_ip_change:
          type: boolean

    # ------------------------------------------------------------------
    # 审计
    # ------------------------------------------------------------------

    AuditResult:
      type: string
      enum: [success, failure, denied]

    AuditEntry:
      type: object
      required: [id, ts, action, result]
      properties:
        id:
          type: integer
          format: int64
        ts:
          type: string
          format: date-time
        action:
          type: string
          description: 稳定的机器可读动作名。
          examples: ["credential.create", "credential.update", "config.import"]
        target:
          type: string
          description: 操作对象的标识（例如凭据 ID 或名称）。
        result:
          $ref: "#/components/schemas/AuditResult"
        detail:
          type: string
          description: 补充说明（已本地化，**不含敏感值**）。
        request_id:
          type: string
        remote:
          type: string
          description: 来源描述。本机管理通道下通常是传输类型而非 IP。

    AuditList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_cursor:
          type: string

    # ------------------------------------------------------------------
    # 配置导入导出
    # ------------------------------------------------------------------

    ImportResult:
      type: object
      required: [dry_run, summary]
      properties:
        dry_run:
          type: boolean
        summary:
          $ref: "#/components/schemas/ImportSummary"
        warnings:
          type: array
          description: 不会导致失败、但用户应当知晓的问题（已本地化）。
          items:
            type: string
        errors:
          type: array
          description: 导致对应条目被跳过的错误（已本地化）。
          items:
            type: string

    ImportSummary:
      type: object
      properties:
        credentials_created:
          type: integer
        credentials_updated:
          type: integer
        credentials_skipped:
          type: integer
        tasks_created:
          type: integer
        tasks_updated:
          type: integer
        tasks_skipped:
          type: integer
        settings_updated:
          type: integer

    # ------------------------------------------------------------------
    # IP 状态
    # ------------------------------------------------------------------

    IPStatus:
      type: object
      required: [interfaces]
      properties:
        interfaces:
          type: array
          description: 参与解析的网卡（已排除回环与虚拟网卡）。
          items:
            $ref: "#/components/schemas/InterfaceAddrs"
        # 便捷字段：多数用户只有一个上联网卡，界面上直接展示它即可。
        primary_ipv4:
          type: string
        primary_ipv6:
          type: string
        primary_prefix:
          type: string

    InterfaceAddrs:
      type: object
      required: [name]
      properties:
        name:
          type: string
        index:
          type: integer
        ipv4:
          type: array
          items:
            type: string
        ipv6:
          type: array
          description: 全部 IPv6 地址（含链路本地，供排查用）。
          items:
            type: string
        global_ipv6:
          type: array
          description: |
            可用于公网访问的 IPv6 地址（已排除链路本地、ULA、回环）。
            动态解析只该用这些地址。
          items:
            type: string
        prefixes:
          type: array
          description: |
            该网卡的 IPv6 委派前缀，例如 240e:3b0:1234:5600::/64。
            **这是 ISP 重拨后真正变化的东西。**
          items:
            type: string
        is_up:
          type: boolean

    # ------------------------------------------------------------------
    # 动态解析任务
    # ------------------------------------------------------------------

    DdnsTask:
      type: object
      required: [id, credential_id, label, enabled, ipv4, ipv6, created_at, updated_at]
      properties:
        id:
          type: string
        credential_id:
          type: string
        label:
          type: string
        enabled:
          type: boolean
        ipv4:
          $ref: "#/components/schemas/DdnsSource"
        ipv6:
          $ref: "#/components/schemas/DdnsSource"
        ttl:
          type: string
          description: 记录生存时间（秒）。空串表示使用服务商默认值。
        http_interface:
          type: string
          description: 发送请求时绑定的网卡名；为空表示默认网卡。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

        # --- 运行状态（只读，由内核写入） ---
        last_run_at:
          type: string
          format: date-time
        last_status:
          $ref: "#/components/schemas/DdnsStatus"
        last_message:
          type: string
          description: 上次执行的说明（已本地化）。
        last_ipv4:
          type: string
        last_ipv6:
          type: string

    DdnsStatus:
      type: string
      enum: ["", success, unchanged, failed]
      description: |
        空串表示从未执行过。

        unchanged 与 success 的区别很重要：前者表示"记录本来就是对的"，
        不该触发通知；后者表示"真的改动了"，值得告诉用户。

    DdnsSource:
      type: object
      required: [enable, get_type, value, domains]
      properties:
        enable:
          type: boolean
          description: 为 false 时该记录类型不参与解析。
        get_type:
          type: string
          enum: [netInterface, url, cmd]
          description: |
            netInterface  从网卡读取（走内核的地址快照，已过滤不可用于公网的地址）
            url           通过外部接口查询，可填多个并用逗号分隔
            cmd           执行命令并从输出中抓取
        value:
          type: string
          description: 网卡名 / URL 列表 / 命令，含义由 get_type 决定。
        domains:
          type: array
          items:
            type: string
          description: |
            要更新的域名。支持两种写法：

              www.example.com   自动识别根域名
              www:example.com   显式指定"子域名:根域名"

            后者用于 publicsuffix 无法正确判断的域名。
        selector:
          type: string
          description: |
            仅 IPv6 使用：地址选择器。

              "@2"        取第 2 个（从 1 开始）
              "^240e:.*"  正则筛选，取第一个匹配的
              留空        取第一个

    DdnsTaskInput:
      type: object
      required: [credential_id, label]
      properties:
        credential_id:
          type: string
        label:
          type: string
          minLength: 1
        enabled:
          type: boolean
        ipv4:
          $ref: "#/components/schemas/DdnsSource"
        ipv6:
          $ref: "#/components/schemas/DdnsSource"
        ttl:
          type: string
        http_interface:
          type: string

    DdnsTaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DdnsTask"

    # ------------------------------------------------------------------
    # DNS 区域与记录
    # ------------------------------------------------------------------

    ZoneList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Zone"

    CredentialVerifyResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        message:
          type: string
          description: |
            结果说明。校验失败时这里是**已经翻译过**的原因 ——
            服务商返回的原始错误文本不会告诉用户该去改什么。
    Zone:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: 服务商侧的区域 ID，用于后续的记录操作。
        name:
          type: string
          description: 区域名，例如 example.com（**不含结尾的点**）。

    Record:
      type: object
      required: [id, name, type, content]
      properties:
        id:
          type: string
          description: |
            服务商侧的记录 ID。

            注意：少数服务商（如 GoDaddy）没有记录 ID，此时内核会合成一个
            稳定标识。合成 ID 在记录内容变化后会失效 —— 详见
            `docs/PROVIDER-MATRIX.md`。
        name:
          type: string
          description: 完整记录名，例如 www.example.com。
        type:
          type: string
          description: 记录类型，例如 A / AAAA / CNAME / MX / TXT / NS / SRV / CAA。
        content:
          type: string
        ttl:
          type: integer
          description: 生存时间（秒）。0 表示使用服务商默认值。
        proxied:
          type: boolean
          description: CDN 代理开关。仅部分服务商的部分记录类型支持。
        comment:
          type: string
        priority:
          type: integer
          description: MX / SRV 记录的优先级。

    RecordInput:
      type: object
      required: [name, type, content]
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        content:
          type: string
        ttl:
          type: integer
          minimum: 0
        proxied:
          type: boolean
        comment:
          type: string
        priority:
          type: integer

    RecordList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Record"

    # ------------------------------------------------------------------
    # 可达性
    # ------------------------------------------------------------------

    ReachProviderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReachProvider"

    ReachProvider:
      type: object
      required: [name, display_name, description, needs_external_server, tier]
      properties:
        name:
          type: string
        display_name:
          type: string
        description:
          type: string
          description: 工作原理的简要说明，用户据此在多种方式间做选择。
        needs_external_server:
          type: boolean
          description: |
            是否依赖一台外部服务器。

            这是用户决策时最关键的一条信息：要不要另外买一台机器、
            流量会不会经过别人的设备。
        tier:
          type: integer
          description: 实现成熟度。1 = 完整实现，2 = 骨架。

    ReachReadiness:
      type: object
      required: [viable, checks, summary]
      properties:
        viable:
          type: boolean
          description: |
            当前是否可用。

            判定只看 `local` 作用域的检测项 —— 上游不通不代表本机
            配置有问题。
        summary:
          type: string
          description: 一句话结论，先给结论再给下一步。
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ReachCheck"

    ReachCheck:
      type: object
      required: [name, scope, status]
      properties:
        name:
          type: string
        scope:
          type: string
          enum: [local, upstream]
        status:
          type: string
          enum: [pass, fail, warn, unknown, blocked]
          description: |
            - `pass`    通过
            - `fail`    未通过，且这是**本机**能够修复的问题
            - `warn`    有隐患但不阻断
            - `unknown` 无法判定（例如需要外部视角）
            - `blocked` 本机一切正常，但**上游**挡住了

            `fail` 与 `blocked` 刻意分开：前者是"去改本机设置"，
            后者是"本机已经没得改了"。把它们混在一起正是让用户
            白白折腾几小时的原因。
        detail:
          type: string
          description: 观察到的具体事实。
        hint:
          type: string
          description: |
            **该怎么办**。

            这一栏是整套检测里最有价值的部分 —— 用户能自己看到
            "没有 IPv6 地址"，但他真正需要的是"去路由器的 IPv6 设置里
            确认前缀委派已开启"。

    # ------------------------------------------------------------------
    # 变更记录
    # ------------------------------------------------------------------

    ChangeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChangeRecord"

    # ------------------------------------------------------------------
    # 变更预览与应用
    # ------------------------------------------------------------------

    ExposeRequest:
      type: object
      required: [port]
      properties:
        port:
          type: integer
          minimum: 1
          maximum: 65535
        protocol:
          type: string
          enum: [tcp, udp]
          default: tcp
        label:
          type: string
          description: |
            规则的可读名称，例如服务名。它会出现在系统防火墙界面里，
            因此应当填一个用户认得出的名字。

            非 ASCII 字符会被丢弃 —— 防火墙规则的名称在不同平台上对
            字符集的要求不一致，塞进去会变成一条无法创建、也无法删除
            的幽灵规则。

    ChangePreviewList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChangePreview"

    ChangePreview:
      type: object
      required: [id, kind, title, risk, diff, steps, empty, created_at, expires_at]
      properties:
        id:
          type: string
        kind:
          type: string
        title:
          type: string
        risk:
          type: string
          enum: [low, medium, high]
        diff:
          type: array
          items:
            $ref: "#/components/schemas/ChangeDiffLine"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ChangeStepPreview"
        warnings:
          type: array
          items:
            type: string
          description: 界面上需要显著提示的内容。
        notes:
          type: array
          items:
            type: string
          description: 背景说明。
        empty:
          type: boolean
          description: |
            无需改动（已是目标状态）。

            界面应当把它显示成"无需改动"而不是"操作失败"：用户点
            "开放 443"而 443 已经开放时，那不是错误。
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: 超过这个时间计划会失效，需要重新生成。

    ChangeStepPreview:
      type: object
      required: [id, title, revertable]
      properties:
        id:
          type: string
        title:
          type: string
        details:
          type: string
        diff:
          type: array
          items:
            $ref: "#/components/schemas/ChangeDiffLine"
        revertable:
          type: boolean
          description: |
            这一步出问题时能否撤销。

            界面必须在应用**之前**显示它 —— 用户有权知道"这一步做错了
            能不能退"。

    # ------------------------------------------------------------------
    # 反向代理
    # ------------------------------------------------------------------

    ProxyStatus:
      type: object
      required: [running, port, routes]
      properties:
        running:
          type: boolean
        port:
          type: integer
        routes:
          type: integer
        error:
          type: string
          description: |
            最近一次启动失败的原因。

            它必须被展示 —— 端口被占用之类的失败如果只写进日志，
            用户在界面上看到的就是"代理没开"，而不知道为什么。

    ProxyRouteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProxyRoute"

    ProxyRoute:
      type: object
      required: [id, domains, upstream]
      properties:
        id:
          type: string
        label:
          type: string
          description: 用户可读的名称。
        domains:
          type: array
          items:
            type: string
          description: |
            要匹配的域名。支持两种写法：

              home.example.com    精确匹配
              *.example.com       匹配**一级**子域名

            `*.example.com` 不匹配 `example.com` 本身，也不匹配
            `a.b.example.com` —— 这与 TLS 证书的通配规则一致。
            放宽它的后果是用户拿到一个证书不匹配的域名，
            而浏览器只会说"证书无效"。
        upstream:
          type: string
          description: |
            转发目标，形如 `http://127.0.0.1:8096`。

            **必须是本机或内网地址。** 反代监听在公网上，若允许任意
            上游，任何人都能拿它当跳板 —— 而所有流量都记在用户头上。
        tls:
          type: boolean
          description: 该域名是否需要 HTTPS。

    # ------------------------------------------------------------------
    # 证书
    # ------------------------------------------------------------------

    CertList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CertStatus"

    CertStatus:
      type: object
      required: [name, needs_renew]
      properties:
        name:
          type: string
          description: 证书在存储里的名字（通常是主域名）。
        domains:
          type: array
          items:
            type: string
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        staging:
          type: boolean
          description: |
            是否来自 ACME 测试环境。

            必须暴露出来：测试环境签发的证书**不被浏览器信任**，
            而用户在界面上只会看到"证书无效"。
        needs_renew:
          type: boolean
        reason:
          type: string
          description: 为什么需要续期。
        error:
          type: string
          description: 最近一次签发失败的原因。

    # ------------------------------------------------------------------
    # 通知
    # ------------------------------------------------------------------

    NotifyChannelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotifyChannel"

    NotifyChannel:
      type: object
      required: [id, name, kind]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [webhook, log]
        enabled:
          type: boolean
        url:
          type: string
          description: Webhook 的目标地址。只允许 http / https。
        method:
          type: string
          description: HTTP 方法，默认 POST。
        headers:
          type: object
          additionalProperties:
            type: string
          description: |
            附加请求头。

            **不要在这里放明文密钥** —— 这个字段会被接口原样返回。
            需要鉴权时请让接收端校验来源地址。
        body_template:
          type: string
          description: |
            请求体模板，留空时发送默认的 JSON 结构。

            可用变量：`{{.Event}}` `{{.Title}}` `{{.Body}}`
            `{{.Severity}}` `{{.At}}`（RFC3339）。

            各家的消息格式差异很大（飞书要嵌套的 `msg_type`，
            Slack 只要一个 `text`），模板让用户不必等内核适配。

            模板**语法错误会在保存时被拒绝**，而不是等到发送时。
        min_severity:
          type: string
          enum: [info, warning, error]
          description: |
            该通道的最低发送级别。

            每个通道可以有自己的阈值 —— "错误发到手机，全部发到日志"
            是常见需求。
          default: info

    NotifyDeliveryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotifyDelivery"

    NotifyDelivery:
      type: object
      required: [channel, kind, ok, at]
      properties:
        channel:
          type: string
        kind:
          type: string
        ok:
          type: boolean
        error:
          type: string
        at:
          type: string
          format: date-time

    # ------------------------------------------------------------------
    # 系统服务
    # ------------------------------------------------------------------

    ServiceStatusInfo:
      type: object
      required: [daemon_reachable, backend]
      properties:
        daemon_reachable:
          type: boolean
          description: 内核现在是否真的能连通。这一项**不需要任何权限**。
        status:
          type: string
          enum: [unknown, stopped, running]
        backend:
          type: string
          description: 平台后端名，例如 windows-scm / systemd / launchd。
        error:
          type: string
          description: 查询服务状态失败的原因（通常是权限不足）。

    ServiceInstallRequest:
      type: object
      properties:
        auto_start:
          type: boolean
          description: 开机自启（Windows 上使用延迟自启，等网络就绪后再启动）。
          default: true
        restart_on_failure:
          type: boolean
          description: 崩溃后自动重启（递增延迟，避免持续崩溃时无限重启）。
          default: true

    ServiceActionResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        message:
          type: string

    ChangeRecord:
      type: object
      required: [plan_id, kind, title, risk, status, steps, created_at, updated_at]
      properties:
        plan_id:
          type: string
        kind:
          type: string
          description: 变更类型，例如 firewall.expose_port。
        title:
          type: string
        risk:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [applying, applied, failed, rolled_back, rollback_failed]
          description: |
            - `applying`        正在执行。**这个状态停着不动说明内核上次异常退出**
            - `applied`         全部步骤成功
            - `failed`          有步骤失败，但已完成自动回滚
            - `rolled_back`     已撤销
            - `rollback_failed` 回滚本身失败 —— 系统处于中间态，最严重
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ChangeStep"
        warnings:
          type: array
          items:
            type: string
          description: 界面上需要显著提示的内容。
        notes:
          type: array
          items:
            type: string
          description: 背景说明。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ChangeStep:
      type: object
      required: [id, title, state]
      properties:
        id:
          type: string
        title:
          type: string
        state:
          type: string
          enum: [pending, applied, failed, reverted, skipped]
        diff:
          type: array
          items:
            $ref: "#/components/schemas/ChangeDiffLine"
        error:
          type: string

    ChangeDiffLine:
      type: object
      required: [op, text]
      properties:
        op:
          type: string
          enum: [add, remove, keep, change]
        text:
          type: string

    # ------------------------------------------------------------------
    # 外部验证
    # ------------------------------------------------------------------

    VerifySessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VerifySession"

    VerifyStartRequest:
      type: object
      properties:
        port:
          type: integer
          minimum: 0
          maximum: 65535
          description: |
            要监听的端口。为 0 或省略时由内核分配一个空闲端口。

            用随机端口有个好处：它几乎不可能与用户已有的服务冲突，
            也不需要用户在验证前先去关掉什么。
        target_ip:
          type: string
          description: |
            给用户打开的公网地址。留空时内核自动取当前的全局 IPv6。

            只有在机器有多个公网地址、用户想指定其中一个时才需要填。

    VerifySession:
      type: object
      required: [id, port, token, status, hits, created_at, expires_at, message]
      properties:
        id:
          type: string
        port:
          type: integer
        token:
          type: string
          description: URL 里的随机路径段。
        target_ip:
          type: string
        url:
          type: string
          description: |
            让用户在手机上打开的完整地址。

            IPv6 字面量已经带上方括号 —— 不带的话 URL 解析会把地址里的
            冒号当成端口分隔符。
        status:
          type: string
          enum: [waiting, reachable, hairpin_only, unreachable, stopped]
          description: |
            - `waiting`        等待外部访问
            - `reachable`      收到了来自**公网地址**的访问 —— 链路确实通
            - `hairpin_only`   只收到了来自本机或内网的访问。
              **这什么也证明不了**：用户在自己电脑上打开、或者手机
              还连着 Wi-Fi，都会走不经过运营商的路径
            - `unreachable`    超时，始终没有收到任何访问
            - `stopped`        被用户主动停止
        message:
          type: string
          description: 一句话结论（已本地化）。
        hits:
          type: array
          items:
            $ref: "#/components/schemas/VerifyHit"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    VerifyHit:
      type: object
      required: [remote_addr, kind, at]
      properties:
        remote_addr:
          type: string
        kind:
          type: string
          enum: [public, self, loopback, private, link_local]
          description: |
            来源分类。只有 `public` 能证明链路可用。

            `self` 是最容易被误判成成功的一类：**IPv6 没有 NAT**，
            从本机访问自己的公网 IPv6 地址时连接是直连的，
            来源地址就是那个全局单播地址 —— 光看地址类型完全正常。
        user_agent:
          type: string
        at:
          type: string
          format: date-time
