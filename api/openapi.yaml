openapi: 3.1.0

info:
  title: ISC Core API
  version: 0.1.0
  description: |
    ISC（接入编排器）内核的本地管理接口。

    ## 设计约束

    - **本地面仅本机可达**：内核的管理面只监听命名管道 / Unix socket / 回环，
      绝不对外暴露。所有请求（含回环）都必须携带 `Authorization: Bearer <token>`，
      token 从数据目录下的 `runtime.json` 读取。见 docs/DECISIONS.md D09。
    - **远程面是另一条监听**：手机端（ISC Mizar）走的是独立的 TLS 监听 +
      独立的设备令牌链，只暴露本文件里标注的 `/v1/remote/*` 与一份**只读
      优先**的路径白名单。本文件里的其余路径在远程面上不存在（403）。
      见 docs/DECISIONS.md D38。
    - **`/v1/remote/pair` 只在远程面上存在**，且是那里唯一免鉴权的路径。
    - **快同步 + 慢异步**：列表与详情查询同步返回；所有可能耗时的操作
      （证书签发、凭据校验、防火墙应用、外部可达性验证）返回 `202` 与
      `job_id`，进度通过 `GET /v1/jobs/{id}` 或 WebSocket 事件流获取。
      见 docs/DECISIONS.md D08。
    - **契约优先**：本文件是接口的唯一真理。Go 服务端接口由 oapi-codegen 生成，
      前端类型由 openapi-typescript 生成。修改接口必须先改本文件。

    ## M0 阶段范围

    当前仅有元信息、健康检查、事件流与任务引擎。业务端点随里程碑加入。

servers:
  - url: http://localhost
    description: 实际地址由运行时的 runtime.json 决定（命名管道 / Unix socket / 回环）

tags:
  - name: Meta
    description: 版本、平台能力与健康状态
  - name: Events
    description: 实时事件流
  - name: Jobs
    description: 异步任务
  - name: Providers
    description: DNS 服务商元信息与能力矩阵
  - name: Credentials
    description: DNS 服务商凭据（加密存储）
  - name: IP
    description: 本机地址与 IPv6 前缀
  - name: DdnsTasks
    description: 动态解析任务
  - name: Zones
    description: DNS 区域（Tier-1 服务商）
  - name: Records
    description: DNS 记录管理（Tier-1 服务商）
  - name: Reach
    description: 可达性（让服务能从公网访问）
  - name: Changes
    description: 系统变更记录与撤销
  - name: Verify
    description: 引导式外部验证
  - name: Certs
    description: TLS 证书的申请与续期
  - name: Notify
    description: 通知通道与投递记录
  - name: Service
    description: 把内核注册为系统服务（开机自启、崩溃重启）
  - name: Settings
    description: 运行时设置
  - name: Audit
    description: 审计日志
  - name: Config
    description: 配置导入导出与迁移
  - name: Remote
    description: 远程访问（ISC Mizar）—— 独立监听、配对与设备管理
  - name: Debug
    description: 仅用于管线自检的调试端点，不属于产品接口

security:
  - bearerAuth: []

paths:
  /v1/health:
    get:
      tags: [Meta]
      operationId: getHealth
      summary: 存活检查
      description: 不依赖任何子系统的最小存活探针，供 CLI 与 GUI 判断内核是否在运行。
      security: []
      responses:
        "200":
          description: 内核存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"

  /v1/meta:

    get:
      tags: [Meta]
      operationId: getMeta
      summary: 元信息与平台能力
      description: |
        返回版本、构建信息、运行平台，以及各平台后端（防火墙 / 服务管理 /
        网卡监控 / 密钥库 / 传输 / 低端口绑定）的实现状态。

        下游 GUI 应当依据 `capabilities` 决定是否置灰相关功能，
        而不是自己去猜 `runtime.GOOS`。
      responses:
        "200":
          description: 元信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        default:
          $ref: "#/components/responses/Problem"

  /v1/events:

    get:
      tags: [Events]
      operationId: subscribeEvents
      summary: 订阅事件流（WebSocket）
      description: |
        升级为 WebSocket 连接后，服务端持续推送内核事件。

        事件带单调递增的 `seq`。客户端断线重连时携带 `lastEventId`，
        服务端会补发序号大于该值的事件；若请求的序号已超出环形缓冲范围，
        则先推送一条 `events.gap` 事件告知客户端需要重新拉取全量状态。
      parameters:
        - name: lastEventId
          in: query
          required: false
          description: 客户端已收到的最后一个事件序号，用于断线补发。
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "101":
          description: 协议升级成功，开始推送事件
        "400":
          description: |
            无法升级为 WebSocket（例如缺少 Upgrade 头）。
            该响应为普通 HTTP 响应，不是 WebSocket 帧。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/jobs:

    get:
      tags: [Jobs]
      operationId: listJobs
      summary: 任务列表
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          description: 按状态过滤，可重复传入。
          schema:
            type: array
            items:
              $ref: "#/components/schemas/JobStatus"
          style: form
          explode: true
        - name: kind
          in: query
          required: false
          description: 按任务类型过滤。
          schema:
            type: string
      responses:
        "200":
          description: 任务列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/jobs/{id}:

    get:
      tags: [Jobs]
      operationId: getJob
      summary: 任务详情
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/jobs/{id}/cancel:

    post:
      tags: [Jobs]
      operationId: cancelJob
      summary: 取消任务
      description: |
        请求取消一个尚未结束的任务。取消是协作式的：任务实现需自行响应
        `context.Context` 的取消信号。对已结束的任务调用返回 `409`。
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: 已受理取消请求（任务可能仍处于 canceling 状态）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/presets:

    get:
      tags: [Hosting]
      operationId: listPresets
      summary: 列出建站预设
      description: |
        预设描述"某种技术栈该怎么装、怎么构建、怎么启动"。命令一律是
        固定 argv，**不经 shell**；参数里的 `{port}` 在部署时替换为分配到的
        本地端口。
      responses:
        "200":
          description: 预设目录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresetCatalog"
        default:
          $ref: "#/components/responses/Problem"

  /v1/sources/inspect:

    post:
      tags: [Hosting]
      operationId: inspectSource
      summary: 只读识别一份源码目录
      description: |
        只做目录列举与少量标志文件的内容读取。**不执行**源码里的任何东西、
        不联网、不写入任何文件。

        结果里包含识别证据、候选预设与推荐预设。识别不出已知技术栈时
        推荐自定义服务器，并在 `warnings` 里说明。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceInspectRequest"
      responses:
        "200":
          description: 识别结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceInspection"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/runtimes:

    get:
      tags: [Hosting]
      operationId: listRuntimes
      summary: 列出可用的运行时
      description: |
        包含两类：系统里已安装且可用的解释器（`source=system`），
        以及内核此前下载并校验过的托管运行时（`source=managed`）。
      responses:
        "200":
          description: 运行时清单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/runtimes/provision:

    post:
      tags: [Hosting]
      operationId: provisionRuntimes
      summary: 准备运行时（必要时下载）
      description: |
        按"系统已装 → 已供给 → 下载固定发行版"的顺序让运行时可用。
        下载是长操作，因此返回 202 与任务 id，进度经 `job.progress` 事件推送。

        Docker 不在供给范围内：内核只检测它，不代为安装。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeProvisionRequest"
      responses:
        "202":
          description: 任务已提交
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/runtimes/{kind}:

    parameters:
      - name: kind
        in: path
        required: true
        description: 运行时类型，例如 node / python / php / go / java / dotnet。
        schema:
          type: string

    delete:
      tags: [Hosting]
      operationId: removeRuntime
      summary: 删除内核安装的运行时
      description: |
        只删除**内核自己装的**运行时（目录里有标记文件）。系统里已安装的
        解释器不受影响 —— 内核没有装它，也就没有资格卸它。
      responses:
        "204":
          description: 已删除（或本来就没有托管的该运行时）
        default:
          $ref: "#/components/responses/Problem"

  /v1/apps:

    get:
      tags: [Apps]
      operationId: listApps
      summary: 列出托管的站点
      responses:
        "200":
          description: 应用列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppList"
        default:
          $ref: "#/components/responses/Problem"

    post:
      tags: [Apps]
      operationId: createApp
      summary: 登记一个站点
      description: |
        只做登记：只读识别源码、生成构建与启动方案、分配本地端口。
        **不执行**任何构建命令；部署是 POST /v1/apps/{id}/deploy。

        分开是为了让登记保持即时（界面能立刻显示出来），而把耗时动作
        放进可取消的任务。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppCreateRequest"
      responses:
        "201":
          description: 已登记
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/apps/{id}:

    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}

    get:
      tags: [Apps]
      operationId: getApp
      summary: 读取站点详情
      description: |
        `domains` 里每一条都会带上公网侧的真实状态（反代规则是否存在、
        证书是否有效），这些是**读的时候**从内核其余部分查出来的，
        而不是应用自己的字段。
      responses:
        "200":
          description: 站点详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

    delete:
      tags: [Apps]
      operationId: deleteApp
      summary: 停止并删除站点
      description: |
        先停进程、撤掉公网绑定，再删记录。磁盘上的日志会保留 ——
        用户往往正是在删掉它之前想看一眼它为什么起不来。
      responses:
        "204":
          description: 已删除
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/apps/{id}/deploy:

    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}

    post:
      tags: [Apps]
      operationId: deployApp
      summary: 部署（准备运行时、装依赖、构建、启动、绑公网）
      description: |
        长操作，返回 202 与任务 id，进度经 `job.progress` 事件推送。

        公网绑定是**尽力而为**的：站点本地跑起来之后才尝试绑域名，
        绑定失败不会把部署判成失败 —— 否则用户会在面对一个真正可用的
        服务时以为一切都白做了。
      responses:
        "202":
          description: 任务已提交
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/apps/{id}/start:

    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}

    post:
      tags: [Apps]
      operationId: startApp
      summary: 启动（不重新装依赖或构建）
      responses:
        "202":
          description: 任务已提交
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/apps/{id}/stop:

    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}

    post:
      tags: [Apps]
      operationId: stopApp
      summary: 停止
      description: 先请求优雅退出，超时后强杀整个进程组。幂等。
      responses:
        "204":
          description: 已停止
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/apps/{id}/restart:

    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}

    post:
      tags: [Apps]
      operationId: restartApp
      summary: 重启
      responses:
        "202":
          description: 任务已提交
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/apps/{id}/logs:

    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}

    get:
      tags: [Apps]
      operationId: getAppLogs
      summary: 读取站点日志
      description: |
        日志是**拉取**的，不走事件流：事件总线的容量有限且慢订阅者会被
        断开，应用日志会把真正的状态变化挤出去。
      parameters:
        - name: tail
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 2000, default: 200}
      responses:
        "200":
          description: 日志行（按时间顺序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppLogs"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/metrics:

    get:
      tags: [Insights]
      operationId: getMetrics
      summary: 主机与站点的资源占用
      description: |
        采样后的**最近一份**快照，附带主机指标的近期历史。

        两点刻意不做：

        - **不按站点归因网络流量**。同一台机器上的多个站点共享网络栈，
          摊到某个站点上的数字只能是编的。因此网络只有主机级。
        - **静态站点没有独立的资源数字**。它们由内核进程自己托管，
          没有独立进程可测；此时只报运行时长，`pid` 为 0。

        平台不支持采样时，本接口仍返回 200，但 `backend` 为 `unsupported`
        且数字为零 —— 界面据此显示"不支持"，而不是显示"什么都没占用"。
      responses:
        "200":
          description: 指标快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSnapshot"
        default:
          $ref: "#/components/responses/Problem"

  /v1/advisories:

    get:
      tags: [Insights]
      operationId: listAdvisories
      summary: 当前值得用户处理的事情
      description: |
        把"应用跑不起来但界面一切正常"这类沉默的失败翻译成一句可行动的
        话：缺什么、为什么、点一下能不能修好。

        `action` 是**方法 + 路径 + 载荷**，界面据此渲染一个按钮。
      responses:
        "200":
          description: 建议列表，重的在前
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvisoryList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/debug/noop:

    post:
      tags: [Debug]
      operationId: runNoopJob
      summary: 提交一个空转任务（仅用于管线自检）
      description: |
        **非产品接口。** 提交一个按步进上报进度的空转任务，用于验证
        任务引擎与事件流是否正常。计划在 M1 之后移除。

        `steps` 控制步数，`step_ms` 控制每步耗时。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoopRequest"
      responses:
        "202":
          description: 任务已提交
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # DNS 服务商元信息
  # ---------------------------------------------------------------------------

  /v1/providers:

    get:
      tags: [Providers]
      operationId: listProviders
      summary: 列出支持的 DNS 服务商及其能力与凭据字段
      description: |
        返回内核支持的全部 DNS 服务商，以及每家所需的凭据字段定义。

        **这是下游 GUI 渲染凭据表单的唯一依据** —— GUI 不需要为每家服务商
        写死表单，只需遍历 `credential_fields` 生成输入框。新增服务商时
        内核与 GUI 都不用改代码。

        `capabilities` 声明该服务商支持哪些操作（区域列表、记录增删改查、
        全记录类型、TTL、代理开关、能否用于 ACME DNS-01 校验）。
        GUI 应当据此置灰不支持的功能，而不是等用户点了才报错。
      responses:
        "200":
          description: 服务商列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Provider"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 凭据
  # ---------------------------------------------------------------------------

  /v1/credentials:

    get:
      tags: [Credentials]
      operationId: listCredentials
      summary: 列出全部凭据
      description: |
        返回的凭据中，**敏感字段一律以掩码形式呈现**（例如 `abcd****wxyz`），
        明文永不离开内核。客户端提交更新时若某字段的值等于掩码，
        内核会保留原值而不是把掩码当作新值写入。
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 凭据列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialList"
        default:
          $ref: "#/components/responses/Problem"

    post:
      tags: [Credentials]
      operationId: createCredential
      summary: 新建凭据
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialInput"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          description: 同名凭据已存在
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/credentials/{id}:

    parameters:
      - $ref: "#/components/parameters/CredentialId"

    get:
      tags: [Credentials]
      operationId: getCredential
      summary: 凭据详情
      responses:
        "200":
          description: 凭据详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

    patch:
      tags: [Credentials]
      operationId: updateCredential
      summary: 修改凭据
      description: |
        只更新请求体中出现的字段。敏感字段若提交掩码值则保留原值 ——
        这让"改个标签"不需要重新输入密钥。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialInput"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

    delete:
      tags: [Credentials]
      operationId: deleteCredential
      summary: 删除凭据
      responses:
        "204":
          description: 已删除
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: 凭据仍被引用（例如有动态解析任务或证书在使用它）
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 设置
  # ---------------------------------------------------------------------------

  /v1/settings:

    get:
      tags: [Settings]
      operationId: getSettings
      summary: 读取运行时设置
      responses:
        "200":
          description: 设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Problem"

    patch:
      tags: [Settings]
      operationId: updateSettings
      summary: 修改运行时设置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: 修改后的完整设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 审计
  # ---------------------------------------------------------------------------

  /v1/audit:

    get:
      tags: [Audit]
      operationId: listAudit
      summary: 查询审计日志
      description: |
        记录所有**写操作**（谁、什么时候、对什么、做了什么、结果如何）。

        存在的意义：内核以系统服务身份运行、能改防火墙、能重写整个 DNS 区域。
        出问题时"最后一次改动是什么、谁改的"是排查的第一入口。
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: action
          in: query
          required: false
          description: 按动作过滤（精确匹配）。
          schema:
            type: string
        - name: action_prefix
          in: query
          required: false
          description: |
            按动作前缀过滤，例如 `remote.` 取全部远程访问相关记录。
            与 `action` 同时给出时两者都要满足。
          schema:
            type: string
        - name: result
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AuditResult"
      responses:
        "200":
          description: 审计记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 配置导入导出
  # ---------------------------------------------------------------------------

  /v1/config/export:

    get:
      tags: [Config]
      operationId: exportConfig
      summary: 导出配置
      description: |
        导出为 YAML，用于备份与迁移。

        `include_secrets` 默认为 **false**：导出的凭据字段为掩码，
        导入到另一台机器时需要重新填写密钥。这是刻意的默认值 ——
        一个"顺手导出"产生的明文密钥文件是常见的事故来源。
      parameters:
        - name: include_secrets
          in: query
          required: false
          description: 设为 true 才会导出明文凭据（务必妥善保管导出文件）。
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: 配置 YAML
          content:
            application/yaml:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"

  /v1/config/import:

    get:
      tags: [Config]
      operationId: describeImport
      summary: 说明导入行为
      description: |
        该端点只做说明，不做任何事。真正的导入用 POST。

        （保留它是因为 OpenAPI 3.1 的 `GET` 与 `POST` 语义需要分开表达，
        而客户端需要能发现"导入会做什么、会不会覆盖现有配置"。）
      responses:
        "200":
          description: 导入行为的说明
          content:
            application/json:
              schema:
                type: object
                properties:
                  dry_run_supported:
                    type: boolean
                  notes:
                    type: string
        default:
          $ref: "#/components/responses/Problem"

    post:
      tags: [Config]
      operationId: importConfig
      summary: 导入配置
      description: |
        `dry_run` 默认为 **true**：先返回"将会发生什么"（新建多少条、
        覆盖多少条、哪些会失败），确认后再以 `dry_run=false` 提交。

        这与 `docs/DECISIONS.md` D10 的"计划 → 预览 → 应用 → 回滚"
        是同一套思路：导入是破坏性操作，不该一步到位。
      parameters:
        - name: dry_run
          in: query
          required: false
          schema:
            type: boolean
            default: true
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: 导入结果（dry_run 时为预览）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/config/import/ddns-go:

    post:
      tags: [Config]
      operationId: importDdnsGoConfig
      summary: 导入 ddns-go 配置
      description: |
        把 ddns-go 的 YAML 配置迁移为 ISC 的凭据与动态解析任务。

        迁移要点：
        - ddns-go 的每个 `dnsconf` 条目里，`dns.name` / `dns.id` / `dns.secret`
          被抽取为一个凭据（多条条目共用同一凭据时只建一个）；
        - `ipv4` / `ipv6` 的获取方式（网卡 / URL / 命令）与域名列表
          被转换为动态解析任务；
        - ddns-go 的 webhook 配置被转换为一个通知通道（M4 接入通知中心后生效）。
      parameters:
        - name: dry_run
          in: query
          required: false
          schema:
            type: boolean
            default: true
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
      responses:
        "200":
          description: 迁移结果（dry_run 时为预览）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # IP 状态
  # ---------------------------------------------------------------------------

  /v1/ip/current:

    get:
      tags: [IP]
      operationId: getCurrentIP
      summary: 读取当前网卡地址与 IPv6 前缀
      description: |
        返回全部物理网卡的地址，以及**可用于公网访问的 IPv6 地址所对应的前缀**。

        前缀是本产品的核心概念：ISP 重拨后变化的是整个 /64 前缀，
        该前缀下的所有 AAAA 记录都要重写，而不是只改一个地址。

        回环与虚拟网卡（Docker 网桥、VPN 隧道等）被排除 ——
        它们的变化与"公网地址变了"毫无关系。
      responses:
        "200":
          description: 当前地址状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IPStatus"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 动态解析任务
  # ---------------------------------------------------------------------------

  /v1/ddns-tasks:

    get:
      tags: [DdnsTasks]
      operationId: listDdnsTasks
      summary: 列出动态解析任务
      responses:
        "200":
          description: 任务列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdnsTaskList"
        default:
          $ref: "#/components/responses/Problem"

    post:
      tags: [DdnsTasks]
      operationId: createDdnsTask
      summary: 新建动态解析任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DdnsTaskInput"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdnsTask"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/ddns-tasks/{id}:

    parameters:
      - $ref: "#/components/parameters/DdnsTaskId"

    get:
      tags: [DdnsTasks]
      operationId: getDdnsTask
      summary: 任务详情
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdnsTask"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

    patch:
      tags: [DdnsTasks]
      operationId: updateDdnsTask
      summary: 修改任务
      description: |
        修改后内核会**清空该任务的防抖缓存**，使下一次执行必定与服务商比对。

        没有这一步的话，用户改了域名却发现"半天没生效" ——
        因为防抖逻辑认为地址没变、还没到比对时机。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DdnsTaskInput"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdnsTask"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

    delete:
      tags: [DdnsTasks]
      operationId: deleteDdnsTask
      summary: 删除任务
      responses:
        "204":
          description: 已删除
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/ddns-tasks/{id}/run:

    parameters:
      - $ref: "#/components/parameters/DdnsTaskId"

    post:
      tags: [DdnsTasks]
      operationId: runDdnsTask
      summary: 立即执行一次任务
      description: |
        忽略防抖缓存，立刻执行一次。用于"配好了想马上验证"。

        返回 202 与任务 ID：一次执行可能包含多个域名的更新，
        在服务商限流时可能耗时数秒，做成同步会让界面卡住。
      responses:
        "202":
          description: 已开始执行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # DNS 区域与记录（Tier-1 服务商）
  # ---------------------------------------------------------------------------

  /v1/credentials/{id}/verify:

    post:
      tags: [Credentials]
      operationId: verifyCredential
      summary: 校验凭据是否可用（"测试连接"）
      description: |
        **不是所有服务商都支持。** 阿里云 / 腾讯云 / 华为云 / GoDaddy 没有
        只读的校验端点，而用"列一次域名"来冒充会要求额外的权限 —— 那会把
        只有 DNS 编辑权限的最小权限账号误判为无效。

        不支持时返回 `ok: false`，而 `message` 会说明是**不支持**而不是
        **连不上** —— 否则用户会去查一个根本不存在的连接问题。

        这个端点始终返回 200：校验失败是一种**结果**，而不是请求错误。
        用 4xx/5xx 表达它会让客户端难以区分"凭据不可用"与"请求本身有问题"。
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "200":
          description: 校验结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialVerifyResult"
        default:
          $ref: "#/components/responses/Problem"

  /v1/credentials/{id}/zones:

    parameters:
      - $ref: "#/components/parameters/CredentialId"

    get:
      tags: [Zones]
      operationId: listZones
      summary: 列出该凭据可管理的 DNS 区域
      description: |
        路径里带上凭据 ID 而不是把区域 ID 做成全局唯一：区域存在于服务商
        那边，内核不持久化它们。若把 (凭据, 区域) 压成一个本地 ID，
        就得维护一份缓存并处理它过期的问题 —— 而每次实时查询既简单又准确。

        `capabilities.zone_list` 为 false 的服务商会返回 400，
        而不是一个空列表：空列表会让用户以为"我这个账号下没有域名"。
      responses:
        "200":
          description: 区域列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneList"
        "400":
          description: 该服务商不支持列出区域
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/credentials/{id}/zones/{zoneId}/records:

    parameters:
      - $ref: "#/components/parameters/CredentialId"
      - $ref: "#/components/parameters/ZoneId"

    get:
      tags: [Records]
      operationId: listRecords
      summary: 列出区域内的 DNS 记录
      parameters:
        - name: type
          in: query
          required: false
          description: 按记录类型过滤。
          schema:
            type: string
        - name: name
          in: query
          required: false
          description: 按记录名精确过滤（完整域名）。
          schema:
            type: string
      responses:
        "200":
          description: 记录列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordList"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

    post:
      tags: [Records]
      operationId: createRecord
      summary: 新增 DNS 记录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordInput"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/credentials/{id}/zones/{zoneId}/records/{recordId}:

    parameters:
      - $ref: "#/components/parameters/CredentialId"
      - $ref: "#/components/parameters/ZoneId"
      - $ref: "#/components/parameters/RecordId"

    get:
      tags: [Records]
      operationId: getRecord
      summary: 读取单条记录
      responses:
        "200":
          description: 记录详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

    put:
      tags: [Records]
      operationId: updateRecord
      summary: 修改 DNS 记录
      description: |
        用 PUT 而不是 PATCH：请求体是**完整的记录**，服务商那边也是
        整体替换语义。用 PATCH 的话，"清空备注"这类操作需要显式传 null，
        而各家对 null 的处理不一致，容易产生歧义。

        注意：部分服务商（如 GoDaddy）的记录没有独立 ID，
        且"同名同类型"可以有多条值。那类服务商的删除语义会退化为
        "删除该名字该类型的全部记录" —— 详见 `docs/PROVIDER-MATRIX.md`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordInput"
      responses:
        "200":
          description: 修改后的记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

    delete:
      tags: [Records]
      operationId: deleteRecord
      summary: 删除 DNS 记录
      responses:
        "204":
          description: 已删除
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 可达性
  # ---------------------------------------------------------------------------

  /v1/reach/providers:

    get:
      tags: [Reach]
      operationId: listReachProviders
      summary: 列出全部可达方式
      description: |
        「可达方式」是让本机服务能从公网访问的途径。

        默认是 IPv6 直连（不需要公网 IPv4、不需要中转服务器、
        流量不经过第三方）。后续会加入经中转服务器的方案，
        供运营商封禁入站连接时换路。
      responses:
        "200":
          description: 可达方式列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReachProviderList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/reach/providers/{name}/probe:

    parameters:
      - $ref: "#/components/parameters/ReachProviderName"

    get:
      tags: [Reach]
      operationId: probeReachProvider
      summary: 探测某种可达方式当前是否可用
      description: |
        **只读操作**，不产生任何系统变更。

        返回的检测项按「从下到上」排列（本机地址 → 委派前缀 →
        防火墙后端 → 服务监听 → 上游可达性），用户按顺序逐项修复即可。

        注意 `scope` 字段：

        - `local`    本机做的检测，失败说明本机还需要配置
        - `upstream` 需要外部视角才能做的检测

        本机**无法**验证上游可达性 —— 从本机访问自己的公网地址通常走
        回环（NAT 发夹），无论运营商是否放行都会"成功"。因此那一项
        永远是 `unknown`，必须用手机流量做外部验证才能确认。
      responses:
        "200":
          description: 探测结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReachReadiness"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 变更记录
  # ---------------------------------------------------------------------------

  /v1/changes:

    get:
      tags: [Changes]
      operationId: listChanges
      summary: 列出历史系统变更
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 变更记录列表（按时间倒序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/changes/{planId}:

    parameters:
      - $ref: "#/components/parameters/PlanId"

    get:
      tags: [Changes]
      operationId: getChange
      summary: 读取单条变更记录
      responses:
        "200":
          description: 变更记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRecord"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/changes/interrupted:

    get:
      tags: [Changes]
      operationId: listInterruptedChanges
      summary: 列出被中断的变更
      description: |
        返回停留在「执行中」状态的变更 —— 它们说明内核上次没有走完
        整个流程（多半是异常退出），系统里可能留有半成品。

        **内核不会自动撤销它们**，这是刻意的：一次执行中的变更可能
        已经部分生效，而用户可能正依赖那部分（例如他已经通过新开的
        端口连上了服务）。启动时擅自撤掉会拿走用户正在用的东西，
        而他完全不知道发生了什么。

        因此这里只报告，由用户决定是否撤销。
      responses:
        "200":
          description: 被中断的变更列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeList"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 外部验证
  # ---------------------------------------------------------------------------

  /v1/verify/sessions:

    get:
      tags: [Verify]
      operationId: listVerifySessions
      summary: 列出外部验证会话
      responses:
        "200":
          description: 会话列表（最近的在前）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifySessionList"
        default:
          $ref: "#/components/responses/Problem"

    post:
      tags: [Verify]
      operationId: startVerifySession
      summary: 开始一次外部验证
      description: |
        在本机临时监听一个端口，生成一个带随机路径的 URL，
        引导用户用手机（关闭 Wi-Fi，走 4G/5G）打开它。

        这是唯一能回答"从外面到底能不能连上"的手段 —— 本机做不到，
        因为从本机访问自己的公网地址走的是回环或直连，无论运营商
        是否放行都会"成功"。

        **判断依据是来源地址**，分三档：

        - 来自公网地址        → `reachable`，链路确实通
        - 只来自本机/内网地址  → `hairpin_only`，**什么也证明不了**
        - 超时没有收到任何访问 → `unreachable`，结合本机检测全绿，
          结论指向上游封禁
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyStartRequest"
      responses:
        "201":
          description: 会话已开始
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifySession"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/verify/sessions/{id}:

    parameters:
      - $ref: "#/components/parameters/VerifySessionId"

    get:
      tags: [Verify]
      operationId: getVerifySession
      summary: 读取验证会话
      responses:
        "200":
          description: 会话详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifySession"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

    delete:
      tags: [Verify]
      operationId: stopVerifySession
      summary: 停止验证会话
      description: |
        关闭临时监听并保留记录 —— 用户可能想回看上次验证的结果。
      responses:
        "204":
          description: 已停止
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/reach/providers/{name}/plan:

    parameters:
      - $ref: "#/components/parameters/ReachProviderName"

    post:
      tags: [Reach]
      operationId: planReachExpose
      summary: 生成一份"放行端口"的变更计划
      description: |
        **不产生任何系统变更** —— 它只计算差异并把计划登记在内核里，
        返回一份可读的预览。

        确认之后调用 `POST /v1/changes/{planId}/apply` 才会真正执行。

        计划在内核里保留 10 分钟后过期。过期是刻意的：预览里的差异是
        基于**当时**的系统状态算出来的，放太久之后状态可能已经变了
        （别人手工加了规则），那时再应用会让实际效果与用户看到的
        差异不符。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExposeRequest"
      responses:
        "200":
          description: 计划预览
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePreview"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/changes/pending:

    get:
      tags: [Changes]
      operationId: listPendingChanges
      summary: 列出待确认的变更计划
      responses:
        "200":
          description: 待确认的计划（最近的在前）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePreviewList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/changes/{planId}/apply:

    parameters:
      - $ref: "#/components/parameters/PlanId"

    post:
      tags: [Changes]
      operationId: applyChange
      summary: 应用一个已确认的变更计划
      description: |
        计划在取出时即被消费，因此**重复调用会返回 404** ——
        用户双击"应用"不会执行两次。

        失败时内核会**自动按相反顺序撤销已生效的步骤**。若自动回滚
        本身也失败，状态会是 `rollback_failed`，那意味着系统处于
        既非原状也非目标的中间态 —— 界面必须显著提示。
      responses:
        "200":
          description: 执行结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRecord"
        "404":
          description: 计划不存在或已过期，需要重新生成
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/changes/{planId}/rollback:

    parameters:
      - $ref: "#/components/parameters/PlanId"

    post:
      tags: [Changes]
      operationId: rollbackChange
      summary: 撤销一次已生效的变更
      description: |
        它走各后端登记的撤销器，因此**跨越内核重启依然可用**。

        幂等：已经撤销过的计划再撤一次会返回成功。用户重试是常见操作
        （网络卡了、按钮点重了），把重试当失败会让他以为撤销没生效，
        进而做出更激进的处置。
      responses:
        "200":
          description: 撤销结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRecord"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: |
            变更仍处于执行中状态，暂时不能撤销 —— 那个进程可能还在写
            系统状态，两边同时动手会得到谁也没预料到的结果。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 反向代理
  # ---------------------------------------------------------------------------

  /v1/tunnel:

    get:
      tags: [Proxy]
      operationId: getTunnelStatus
      summary: 读取 Cloudflare 隧道的状态
      description: |
        隧道是为了让**没有公网地址**的网络也能发布站点：本机主动向
        Cloudflare 建一条长连接，外面来的请求顺着它进来。

        `state` 有六种取值，客户端要分别说明，因为它们要用户采取的动作
        完全不同：

        - `disabled` —— 用户没开；
        - `no_binary` —— 找不到 cloudflared；
        - `no_account` —— 缺账号授权；
        - `starting` —— 进程起来了，还没连上边缘；
        - `running` —— 至少有一条到边缘的连接；
        - `failed` —— 启动或运行失败（看 `last_error`）。

        只把 `enabled` 当布尔量用的界面会把后四种混成"开着但没用"，
        而用户需要知道的是**卡在哪一步**。
      responses:
        "200":
          description: 状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TunnelStatus"
        default:
          $ref: "#/components/responses/Problem"

  /v1/tunnel/enable:

    post:
      tags: [Proxy]
      operationId: enableTunnel
      summary: 开启隧道
      responses:
        "200":
          description: 开启后的状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TunnelStatus"
        default:
          $ref: "#/components/responses/Problem"

  /v1/tunnel/disable:

    post:
      tags: [Proxy]
      operationId: disableTunnel
      summary: 关闭隧道
      responses:
        "200":
          description: 关闭后的状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TunnelStatus"
        default:
          $ref: "#/components/responses/Problem"

  /v1/proxy/status:

    get:
      tags: [Proxy]
      operationId: getProxyStatus
      summary: 读取反向代理的运行时状态
      responses:
        "200":
          description: 状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyStatus"
        default:
          $ref: "#/components/responses/Problem"

  /v1/proxy/routes:

    get:
      tags: [Proxy]
      operationId: listProxyRoutes
      summary: 列出全部转发规则
      responses:
        "200":
          description: 规则列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyRouteList"
        default:
          $ref: "#/components/responses/Problem"

    put:
      tags: [Proxy]
      operationId: replaceProxyRoutes
      summary: 整体替换转发规则
      description: |
        **整体替换**，不是增删改。

        规则表必须始终自洽：同一个域名不能同时指向两个上游。增量修改会
        让"检查冲突"变成一件需要跨多次调用才能完成的事，而中间任何一个
        时刻的状态都可能有冲突 —— 那期间进来的请求会打到哪一条是不确定的。

        整体替换让"检查 + 生效"变成一次原子操作。保存成功后会**立即生效**，
        不需要重启监听（在途请求不会被切断）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProxyRouteList"
      responses:
        "200":
          description: 保存后的规则列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyRouteList"
        "400":
          description: |
            规则不合法。常见的几种：上游不是本机地址、上游缺少端口、
            域名格式不对、同一个域名被两条路由使用。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 证书
  # ---------------------------------------------------------------------------

  /v1/certs:

    get:
      tags: [Certs]
      operationId: listCerts
      summary: 列出证书与它们的续期状态
      description: |
        每张证书会带上 `needs_renew` 与 `reason` —— 后者解释**为什么**
        需要续期。用户在界面上看到"需要续期"时的第一个问题就是"为什么"，
        少了理由他只能猜。
      responses:
        "200":
          description: 证书列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/certs/renew:

    post:
      tags: [Certs]
      operationId: renewCerts
      summary: 立即检查并为全部 HTTPS 路由申请（或续期）证书
      description: |
        正常情况下证书会在到期前自动续期。这个端点用于**手动触发**——
        典型场景是刚加了一条 HTTPS 路由，想立刻拿到证书而不想等下一轮检查。

        它是**幂等**的：已经有效的证书不会被重新签发（那会白白消耗
        ACME 的配额）。
      responses:
        "200":
          description: 续期后的证书列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertList"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 通知
  # ---------------------------------------------------------------------------

  /v1/notify/channels:

    get:
      tags: [Notify]
      operationId: listNotifyChannels
      summary: 列出通知通道
      responses:
        "200":
          description: 通道列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifyChannelList"
        default:
          $ref: "#/components/responses/Problem"

    put:
      tags: [Notify]
      operationId: replaceNotifyChannels
      summary: 整体替换通知通道
      description: |
        **整体替换**，理由是顺序与冲突（同一个 ID）在整体替换下才有
        明确的语义。

        保存前会**逐个构造一遍**：模板语法错误之类的"构造期才暴露"的
        问题因此在这里就被挡住，而不是等到某天真的要发通知时才发现。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifyChannelList"
      responses:
        "200":
          description: 保存后的通道列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifyChannelList"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/notify/deliveries:

    get:
      tags: [Notify]
      operationId: listNotifyDeliveries
      summary: 列出最近的通知投递结果
      description: |
        回答那个配置通道时最常被问到的问题：**"我的通知到底发出去了没有"**。

        只写日志的话，用户得去翻日志文件才答得上来。
      responses:
        "200":
          description: 投递记录（最新的在前）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifyDeliveryList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/notify/test:

    post:
      tags: [Notify]
      operationId: testNotifyChannels
      summary: 向全部通道发送一条测试通知
      description: |
        **绕过去重与队列**：用户点了按钮之后期待立刻看到结果，
        而不是等下一个投递循环。

        返回每个通道的结果 —— 某个通道配错了应当立刻看得出来。
      responses:
        "200":
          description: 各通道的投递结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifyDeliveryList"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 系统服务
  # ---------------------------------------------------------------------------

  /v1/service/status:

    get:
      tags: [Service]
      operationId: getServiceStatus
      summary: 查询系统服务状态
      description: |
        它同时报出两件事：

        	daemon_reachable   内核现在是否真的能连通（**不需要权限**）
        	status             操作系统里的服务状态（**需要管理员权限**）

        分开报是有原因的：Windows 上**查询**服务状态同样需要管理员
        （打开 SCM 要完全访问权），而用户真正想知道的往往是前者。
        因此服务查询失败时 `error` 有值、`status` 缺省，而接口本身
        仍然返回 200。
      responses:
        "200":
          description: 服务状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStatusInfo"
        default:
          $ref: "#/components/responses/Problem"

  /v1/service/install:

    post:
      tags: [Service]
      operationId: installService
      summary: 安装系统服务（需要管理员权限）
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInstallRequest"
      responses:
        "200":
          $ref: "#/components/responses/ServiceOK"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/service/uninstall:

    post:
      tags: [Service]
      operationId: uninstallService
      summary: 停止并删除系统服务（需要管理员权限）
      description: |
        **幂等**：服务本来就不存在时返回成功。报错会让"先卸再装"这类
        部署脚本失败，而那是最常见的写法。

        数据目录**不会**被删除。
      responses:
        "200":
          $ref: "#/components/responses/ServiceOK"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/service/start:

    post:
      tags: [Service]
      operationId: startService
      summary: 启动系统服务（需要管理员权限）
      responses:
        "200":
          $ref: "#/components/responses/ServiceOK"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/service/stop:

    post:
      tags: [Service]
      operationId: stopService
      summary: 停止系统服务（需要管理员权限）
      responses:
        "200":
          $ref: "#/components/responses/ServiceOK"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 远程访问（ISC Mizar）—— 配置面
  #
  # 这些接口跑在**本地面**上：只有本机的 Phecda / CLI 能调。它们负责开关
  # 远程监听、开配对会话、管已配对设备。真正的远程请求走的是另一条
  # 独立监听 + 独立认证链（见 docs/DECISIONS.md D38）。
  # ---------------------------------------------------------------------------

  /v1/remote/status:

    get:
      tags: [Remote]
      operationId: getRemoteStatus
      summary: 远程访问的当前状态
      description: |
        界面（Phecda 的「远程访问」页）只需要这一个接口就能把整页画出来：
        开关、监听状态、候选地址、证书指纹、设备数、进行中的配对会话、
        APNs 是否已配置。
      responses:
        "200":
          description: 状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteStatus"
        default:
          $ref: "#/components/responses/Problem"

  /v1/remote/settings:

    patch:
      tags: [Remote]
      operationId: updateRemoteSettings
      summary: 开关远程访问、改监听端口
      description: |
        开关与端口变化会**立即重启监听**。

        改端口失败（被占用、权限不足）时仍返回 200，失败原因放在
        `last_error` 里：调用方需要的是一份可以显示的状态，而不是一个
        没有上下文的错误码。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteSettingsPatch"
      responses:
        "200":
          description: 更新后的状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteStatus"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/remote/pairing:

    post:
      tags: [Remote]
      operationId: startRemotePairing
      summary: 开一个配对会话（生成二维码与六位手输码）
      description: |
        会话五分钟后过期，且**一次性**：成功配对即销毁。

        二维码里的 `secret` 是 256 位随机值；手输码是六位、字母表去掉了
        `I/L/O/U` 与 `0/1`（读错是这类码最常见的失败）。两者指向同一个
        会话，走哪条路由用户选。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingRequest"
      responses:
        "201":
          description: 配对会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingSession"
        "409":
          description: 已经有一个未过期的会话，请先取消或等它过期
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/remote/pairing/{id}:

    delete:
      tags: [Remote]
      operationId: cancelRemotePairing
      summary: 取消配对会话
      parameters:
        - $ref: "#/components/parameters/PairingId"
      responses:
        "204":
          description: 已取消
        default:
          $ref: "#/components/responses/Problem"

  /v1/remote/devices:

    get:
      tags: [Remote]
      operationId: listRemoteDevices
      summary: 已配对的设备
      responses:
        "200":
          description: 设备列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteDeviceList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/remote/devices/{id}:

    patch:
      tags: [Remote]
      operationId: updateRemoteDevice
      summary: 改设备的名称、角色或通知开关
      parameters:
        - $ref: "#/components/parameters/RemoteDeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteDevicePatch"
      responses:
        "200":
          description: 更新后的设备
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteDevice"
        default:
          $ref: "#/components/responses/Problem"

    delete:
      tags: [Remote]
      operationId: revokeRemoteDevice
      summary: 吊销一台设备（级联吊销它派生的设备）
      description: |
        级联是必要的：手表的令牌来自手机。只吊销手机而留下手表，会让
        "我丢的手机已经断开了"这句话不成立。
      parameters:
        - $ref: "#/components/parameters/RemoteDeviceId"
      responses:
        "204":
          description: 已吊销
        default:
          $ref: "#/components/responses/Problem"

  /v1/remote/devices/{id}/test-push:

    post:
      tags: [Remote]
      operationId: testRemotePush
      summary: 给一台设备发一条测试推送
      description: |
        推送是本项目里最难自查的一环：凭据错、topic 错、令牌过期、环境
        搞混（sandbox / production），失败现场都在 Apple 那一侧。因此
        必须有一个"现在给我发一条"的按钮。
      parameters:
        - $ref: "#/components/parameters/RemoteDeviceId"
      responses:
        "200":
          $ref: "#/components/responses/ServiceOK"
        default:
          $ref: "#/components/responses/Problem"

  /v1/remote/ping:
    get:
      tags: [Remote]
      operationId: pingRemoteFace
      summary: 探针端点（免鉴权）
      description: |
        它存在的理由很具体：用户最需要"公网通不通"这个答案的时刻，
        恰好是**还没配对成功**的时候（想确认能不能连上，然后扫码）。
        因此它不能要求鉴权。

        它返回的东西刻意只有"到了"这一个事实 —— 身份由 TLS 证明
        （公网路径是受信任证书，局域网路径是固定公钥），
        这里多说一个字都是多余的暴露面。
      responses:
        "200":
          description: 到了
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean}
        default:
          $ref: "#/components/responses/Problem"

  /v1/remote/public/check:
    post:
      tags: [Remote]
      operationId: reportRemotePublicCheck
      summary: 回报一次可达性自检的结果
      description: |
        由已配对的客户端回报 —— 它是唯一处在正确网络位置上的探针。

        内核据此决定要不要写 A 记录：**只有实测过 IPv4 可达才写**。
        写一条连不上的 A 比不写更糟，因为客户端默认先试 IPv4。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemotePublicCheckReport"
      responses:
        "200":
          description: 记录后的状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemotePublicStatus"
        default:
          $ref: "#/components/responses/Problem"

  /v1/remote/public/domains:
    get:
      tags: [Remote]
      operationId: listRemotePublicDomains
      summary: 列出可以承载公网子域名的域名
      description: |
        供界面把"挂在哪个域名下"做成一个**列表**而不是一个输入框。

        用户不需要记住自己的区域名，更不该把它打错 —— 打错的后果是
        找不到区域，或者更糟：在一个同名但不同账号的区域下建记录。

        只返回**能新建记录**的凭据下的区域：23 家内置服务商里只有
        6 家能建记录，而选中其余的症状是一句"该服务商不支持此操作"。
      responses:
        "200":
          description: 可选域名
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [domain, provider]
                  properties:
                    domain:
                      type: string
                      description: 区域名，例如 example.com
                    provider:
                      type: string
                      description: 这个域名归哪个服务商管
        default:
          $ref: "#/components/responses/Problem"

  /v1/remote/public/sync:
    post:
      tags: [Remote]
      summary: 立即同步公网子域名的 DNS 记录
      description: |
        让记录与本机当前地址一致。**幂等**：地址没变就不发写请求，
        因此可以被反复调用（开机时、地址变化时、用户点"立即同步"时）。

        它只碰内核自己建的那几条记录（按记录 ID），
        绝不会按名字去改用户区域里的其它记录。
      operationId: syncRemotePublic
      responses:
        "200":
          description: 同步后的状态
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RemoteStatus"}
        default:
          $ref: "#/components/responses/Problem"

  /v1/remote/public:
    delete:
      tags: [Remote]
      summary: 删除公网子域名与其 DNS 记录
      description: |
        只删内核自己建的那几条记录（按记录 ID）。区域里的其它记录
        一律不动 —— 一次"顺手清理"就可能毁掉用户的站点。
      operationId: deleteRemotePublic
      responses:
        "204":
          description: 已删除
        default:
          $ref: "#/components/responses/Problem"

  /v1/remote/apns:

    put:
      tags: [Remote]
      operationId: setRemoteApns
      summary: 保存 APNs 凭据（.p8 鉴权密钥）
      description: |
        凭据走既有的加密凭据存储（provider key `apns`），**只写不读**：
        查询只返回是否已配置与 key_id 的末四位，私钥永不回显 ——
        它出现在任何响应或日志里都是缺陷。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApnsCredentials"
      responses:
        "200":
          description: 保存后的状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApnsStatus"
        default:
          $ref: "#/components/responses/Problem"

    delete:
      tags: [Remote]
      operationId: deleteRemoteApns
      summary: 删除 APNs 凭据
      responses:
        "204":
          description: 已删除
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 远程面独有：配对与设备自述
  #
  # 下面几条**只在远程监听上存在**。在本地面上调用没有意义（本机已经有
  # token 了，不需要配对），因此本地面不为它们注册路由。
  # ---------------------------------------------------------------------------

  /v1/remote/pair:

    post:
      tags: [Remote]
      operationId: completeRemotePairing
      summary: 用配对密钥或六位手输码换取设备令牌
      description: |
        远程面上**唯一**免鉴权的路径，因此它是限流的重点：每源 IP 10 次/分、
        单会话 5 次失败即销毁、跨会话连续失败锁 15 分钟。

        `secret` 来自二维码（256 位随机），`code` 是手输的六位码，两者指向
        同一个会话，成功后会话立即销毁（一次性）。

        手输路径下客户端拿不到证书指纹，因此返回体里带 `spki_sha256`：
        客户端**必须**把它显示给用户与另一端的短码核对，核对通过才落库。
        没有这一步，一次中间人就足以长期冒名这台服务器。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemotePairRequest"
      responses:
        "200":
          description: 配对成功。`token` 只在这一个响应里出现。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemotePairResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: 配对码错误、已过期，或尝试次数已用尽
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: 触发限流或锁定，请稍后再试
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/remote/self:

    get:
      tags: [Remote]
      operationId: getRemoteSelf
      summary: 当前设备自己的身份与角色
      description: |
        客户端据此决定界面里哪些操作可用 —— **而不是自己猜**。
        服务端是权限的判定者，界面只把它的结论画出来。
      responses:
        "200":
          description: 自身信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteSelf"
        default:
          $ref: "#/components/responses/Problem"

    delete:
      tags: [Remote]
      operationId: unpairRemoteSelf
      summary: 设备自我解绑
      responses:
        "204":
          description: 已解绑
        default:
          $ref: "#/components/responses/Problem"

  /v1/remote/self/derive:

    post:
      tags: [Remote]
      operationId: deriveRemoteDevice
      summary: 派生一台新设备（给 Apple Watch）
      description: |
        手表既没有摄像头也没有键盘，无法自己扫码。让它复用手机的令牌会
        绕开"手表只读"这条约束 —— 而约束必须在**服务端**成立，不能靠
        客户端自律。

        因此派生出的设备角色必须**不高于**父设备；它在设备列表里是一台
        独立设备，可以单独吊销；吊销父设备会级联吊销它。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteDeriveRequest"
      responses:
        "200":
          description: 派生出的设备与它的令牌
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemotePairResult"
        "403":
          description: 请求的角色高于父设备
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/remote/self/push-token:

    post:
      tags: [Remote]
      operationId: registerRemotePushToken
      summary: 登记这台设备的 APNs 令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemotePushTokenRequest"
      responses:
        "204":
          description: 已登记
        default:
          $ref: "#/components/responses/Problem"

    delete:
      tags: [Remote]
      operationId: unregisterRemotePushToken
      summary: 注销这台设备的 APNs 令牌
      responses:
        "204":
          description: 已注销
        default:
          $ref: "#/components/responses/Problem"

  /v1/events/poll:

    get:
      tags: [Events]
      operationId: pollEvents
      summary: 订阅事件流（游标长轮询）
      description: |
        与 `GET /v1/events`（WebSocket）语义一致，但走普通 HTTP。

        移动端刻意用长轮询而不是 WebSocket：进程被系统挂起、网络切换、
        经过中间代理之后，长轮询只需要重新发一个请求，而 WebSocket 要重建
        握手并重新对齐游标。

        参数与 `isc_events_json` 逐字对齐：`since <= 0` 表示"从现在开始"；
        `timeout_ms` 内没有新事件就空返回；游标跌出环形缓冲时 `gap` 为
        true，此时**必须全量重拉**，不要试图补齐。
      parameters:
        - name: since
          in: query
          required: false
          description: 客户端已收到的最后一个事件序号；0 或省略表示从现在开始。
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: timeout_ms
          in: query
          required: false
          description: 没有新事件时最多阻塞多久。上限 55 秒：再长会被中间代理掐断。
          schema:
            type: integer
            minimum: 0
            maximum: 55000
            default: 25000
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        "200":
          description: 一批事件
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPoll"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------------------
  # 动态解析：启停
  #
  # 远程面刻意**不允许** `PATCH /v1/ddns-tasks/{id}`：那个接口能改域名与
  # 取址来源，权限面远大于"启停"。手机要的只是开关，因此把开关拆成两个
  # 窄接口 —— 权限的粒度由服务端决定，不能指望客户端"只发它想发的字段"。
  # ---------------------------------------------------------------------------

  /v1/ddns-tasks/{id}/enable:

    post:
      tags: [DdnsTasks]
      operationId: enableDdnsTask
      summary: 启用一个动态解析任务
      parameters:
        - $ref: "#/components/parameters/DdnsTaskId"
      responses:
        "200":
          description: 更新后的任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdnsTask"
        default:
          $ref: "#/components/responses/Problem"

  /v1/ddns-tasks/{id}/disable:

    post:
      tags: [DdnsTasks]
      operationId: disableDdnsTask
      summary: 停用一个动态解析任务
      parameters:
        - $ref: "#/components/parameters/DdnsTaskId"
      responses:
        "200":
          description: 更新后的任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdnsTask"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      description: |
        token 位于数据目录的 `runtime.json` 中（字段 `token`），
        由内核首次启动时生成的 32 字节随机值经 base64url 编码得到。

  parameters:

    JobId:
      name: id
      in: path
      required: true
      description: 任务 ID
      schema:
        type: string
        minLength: 1

    CredentialId:
      name: id
      in: path
      required: true
      description: 凭据 ID
      schema:
        type: string
        minLength: 1

    DdnsTaskId:
      name: id
      in: path
      required: true
      description: 动态解析任务 ID
      schema:
        type: string
        minLength: 1

    ZoneId:
      name: zoneId
      in: path
      required: true
      description: 服务商侧的 DNS 区域 ID
      schema:
        type: string
        minLength: 1

    RecordId:
      name: recordId
      in: path
      required: true
      description: 服务商侧的记录 ID
      schema:
        type: string
        minLength: 1

    ReachProviderName:
      name: name
      in: path
      required: true
      description: 可达方式标识，例如 ipv6-native
      schema:
        type: string
        minLength: 1

    PlanId:
      name: planId
      in: path
      required: true
      description: 变更计划 ID
      schema:
        type: string
        minLength: 1

    VerifySessionId:
      name: id
      in: path
      required: true
      description: 外部验证会话 ID
      schema:
        type: string
        minLength: 1

    PairingId:
      name: id
      in: path
      required: true
      description: 配对会话 ID
      schema:
        type: string
        minLength: 1

    RemoteDeviceId:
      name: id
      in: path
      required: true
      description: 远程设备 ID
      schema:
        type: string
        minLength: 1

    Cursor:
      name: cursor
      in: query
      required: false
      description: 分页游标，取自上一次响应的 next_cursor。
      schema:
        type: string

    Limit:
      name: limit
      in: query
      required: false
      description: 单页条数。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  responses:

    ServiceOK:
      description: 操作成功
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ServiceActionResult"

    Problem:
      description: 错误响应（RFC 9457 problem+json）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    # ------------------------------------------------------------------
    # 错误
    # ------------------------------------------------------------------

    Problem:
      type: object
      description: RFC 9457 定义的错误对象。
      required: [type, title, status]
      properties:
        type:
          type: string
          description: 标识错误类型的 URI。
          examples: ["https://isc.local/problems/not-found"]
        title:
          type: string
          description: 简短的人类可读摘要（已本地化）。
        status:
          type: integer
          description: HTTP 状态码。
          minimum: 100
          maximum: 599
        detail:
          type: string
          description: 本次错误的具体说明（已本地化）。
        instance:
          type: string
          description: 出错的具体请求路径。
        code:
          type: string
          description: |
            稳定的机器可读错误码，供客户端分支判断。
            与 title/detail 不同，该字段不随语言变化。
          examples: ["job_not_found", "job_not_cancelable"]
        request_id:
          type: string
          description: 请求 ID，便于在内核日志中定位。

    # ------------------------------------------------------------------
    # 元信息
    # ------------------------------------------------------------------

    Health:
      type: object
      required: [status, uptime_seconds]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: degraded 表示存活但至少有子系统不可用。
        uptime_seconds:
          type: integer
          format: int64
          minimum: 0
        version:
          type: string

    Meta:
      type: object
      required: [version, api_version, os, arch, started_at, capabilities]
      properties:
        version:
          type: string
          description: 内核版本，开发构建为 dev。
        api_version:
          type: string
          description: 本接口的版本，当前为 v1。
        commit:
          type: string
          description: 构建时的 git commit，未知时为空串。
        build_time:
          type: string
          description: 构建时间（RFC 3339），未知时为空串。
        os:
          type: string
          description: 运行平台（GOOS）。
          examples: [windows, linux, darwin]
        arch:
          type: string
          description: 运行架构（GOARCH）。
          examples: [amd64, arm64]
        started_at:
          type: string
          format: date-time
        capabilities:
          $ref: "#/components/schemas/Capabilities"

    Capabilities:
      type: object
      description: 各平台后端的实现状态。不可用的后端意味着对应功能降级为引导模式。
      required: [firewall, service_manager, ip_monitor, secret_store, transport, low_port_binder]
      properties:
        firewall:
          $ref: "#/components/schemas/ImplState"
        service_manager:
          $ref: "#/components/schemas/ImplState"
        ip_monitor:
          $ref: "#/components/schemas/ImplState"
        secret_store:
          $ref: "#/components/schemas/ImplState"
        transport:
          $ref: "#/components/schemas/ImplState"
        low_port_binder:
          $ref: "#/components/schemas/ImplState"
        # 远程面（ISC Mizar）。它是纯 Go 标准库实现（TLS + HTTP），
        # 因此各平台都可用；但客户端仍要据此判断"这台服务器有没有这个能力"
        # —— 老版本内核不会返回这个字段。
        remote:
          $ref: "#/components/schemas/ImplState"
        metrics_gpu:
          $ref: "#/components/schemas/ImplState"

    ImplState:
      type: object
      required: [available, backend]
      properties:
        available:
          type: boolean
          description: 为 false 时该功能降级为引导模式（只提示用户该做什么）。
        backend:
          type: string
          description: 后端名称。
          examples: ["nftables", "netsh", "unsupported:firewall"]
        note:
          type: string
          description: 给用户看的补充说明（已本地化）。

    # ------------------------------------------------------------------
    # 任务
    # ------------------------------------------------------------------

    JobStatus:
      type: string
      enum:
        - pending
        - running
        - succeeded
        - failed
        - canceled
      description: |
        pending  已提交，尚未开始
        running  执行中
        succeeded 成功结束
        failed   失败结束（见 error 字段）
        canceled 被取消

    Job:
      type: object
      required: [id, kind, status, progress, created_at]
      properties:
        id:
          type: string
        kind:
          type: string
          description: 任务类型标识，供客户端分类展示。
          examples: ["debug.noop", "credentials.verify", "certs.issue"]
        status:
          $ref: "#/components/schemas/JobStatus"
        progress:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: 进度，0 到 1。未知进度时为 0。
        message:
          type: string
          description: 当前步骤的人类可读描述（已本地化）。
        result:
          description: 任务成功时的结果，结构由任务类型决定。
        error:
          $ref: "#/components/schemas/Problem"
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time

    JobAccepted:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string

    HostMetrics:
      type: object
      required: [cpu_percent, memory_used_bytes, memory_total_bytes, net_rx_bytes_per_sec, net_tx_bytes_per_sec]
      properties:
        at: {type: string, format: date-time}
        # double 而不是 number：number 默认映射成 float32，而字节速率
        # 很容易超过 float32 能精确表示的范围。
        cpu_percent: {type: number, format: double, minimum: 0, maximum: 100}
        memory_used_bytes: {type: integer}
        memory_total_bytes: {type: integer}
        net_rx_bytes_per_sec: {type: number, format: double}
        net_tx_bytes_per_sec: {type: number, format: double}
        backend:
          type: string
          description: 采样后端名；`unsupported` 表示此平台没有实现采样。
        # 挂载点只在**当前快照**里出现，`history` 条目里没有：
        # 60 个历史点各带一遍全部挂载点，会让一次轮询的响应体膨胀十几倍，
        # 而曲线只用到标量。这条取舍是刻意的，不是遗漏。
        disks:
          type: array
          description: 主机的真实挂载点（已排除伪文件系统）。仅当前快照有。
          items:
            $ref: "#/components/schemas/DiskMetrics"
        gpu:
          $ref: "#/components/schemas/GpuMetrics"

    DiskMetrics:
      type: object
      required: [mount_point, total_bytes, used_bytes, free_bytes]
      properties:
        mount_point:
          type: string
          description: 挂载点路径。
          examples: ["/", "/Volumes/Data"]
        fs_type:
          type: string
          description: 文件系统类型。
          examples: ["apfs", "ext4"]
        total_bytes: {type: integer}
        used_bytes: {type: integer}
        free_bytes: {type: integer}

    GpuMetrics:
      type: object
      required: [backend]
      properties:
        backend:
          type: string
          description: |
            采样后端名；`unsupported` 表示此平台没有实现 GPU 采样。
            与主机指标同一个约定：不支持时**仍然返回 200**，界面据此
            显示"此平台不支持"，而不是显示一个假的 0%。
          examples: ["darwin-ioreg", "unsupported"]
        name: {type: string}
        utilization_percent:
          type: number
          format: double
          minimum: 0
          maximum: 100

    AppMetrics:
      type: object
      required: [app_id, pid, cpu_percent, memory_bytes, uptime_seconds]
      properties:
        app_id: {type: string}
        pid:
          type: integer
          description: 为 0 表示该站点没有独立进程（静态站点由内核托管）。
        cpu_percent: {type: number, format: double}
        memory_bytes: {type: integer}
        uptime_seconds: {type: integer}

    FootprintMetrics:
      type: object
      required: [cpu_percent, memory_bytes, net_backend, processes]
      description: |
        **内核自己 + 它托管的站点**的合计占用。

        与 `HostMetrics` 回答的是两个不同的问题：后者是整台机器，前者是
        "这套东西占了多少"。界面拿 footprint 当主数字、host 当对照，用户
        才不会在机器变卡时先去怀疑 Phecda（或者反过来，以为它什么都没占）。

        口径的三条边界：

        - 进程集合是内核自身 + 站点的**进程树**（含后代）。预设里的
          `npm start` 会再 fork 出 node，只看被监管的那个 PID 会把占用
          算成一个零头；
        - `cpu_percent` 是各进程之和，**可能超过 100**：macOS 上单进程的
          100% 指"一个核跑满"，10 核机器上的 180% 读作 1.8 个核。这里不
          归一化，否则就再也看不出是几个核了；
        - `memory_bytes` 是各进程 RSS 之和，共享页会被重复计入 —— 它是
          一个上界，不是精确值。
      properties:
        at: {type: string, format: date-time}
        cpu_percent:
          type: number
          format: double
          minimum: 0
          description: 各进程占用率之和；多核机器上可能超过 100。
        memory_bytes:
          type: integer
          description: 各进程 RSS 之和（上界，共享页会重复计入）。
        net_rx_bytes_per_sec:
          type: number
          format: double
          description: |
            按进程归因后求和的接收速率。**仅当 `net_backend` 是后端名时
            才存在**：`unsupported` 与 `unavailable` 两种情况下字段缺省，
            界面据此显示"不支持"/"未读到"，而不是显示一个假的 0。
        net_tx_bytes_per_sec:
          type: number
          format: double
          description: 按进程归因后求和的发送速率（存在条件同上）。
        net_backend:
          type: string
          description: |
            网络数字的来源，沿用其它指标的后端约定：

            - 后端名（如 `darwin-nettop`）—— 数字有效；
            - `unsupported` —— 这个平台没有进程级网络采样（Linux 的
              `/proc/net/dev` 是接口级的，没有等价物）；
            - `unavailable` —— 实现了，但这一次没读到（命令超时等）。

            三态必须分开：把"没读到"显示成 0，会让用户以为它不占网络。
          examples: ["darwin-nettop", "unsupported", "unavailable"]
        processes:
          type: integer
          description: 参与合计的进程数，供界面解释"这个数字算了几个人"。

    MetricsSnapshot:
      type: object
      required: [host, apps]
      properties:
        host:
          $ref: "#/components/schemas/HostMetrics"
        footprint:
          $ref: "#/components/schemas/FootprintMetrics"
        apps:
          type: array
          items:
            $ref: "#/components/schemas/AppMetrics"
        history:
          type: array
          description: |
            主机指标的近期历史（最旧在前）。

            只有 host，**没有 footprint**：曲线只用到标量，多带一份 60 点
            的历史会让一次轮询的响应体凭空翻倍。
          items:
            $ref: "#/components/schemas/HostMetrics"

    AdvisoryAction:
      type: object
      required: [label]
      properties:
        label: {type: string}
        # 一个动作要么是一次 API 调用（method + path），要么是一次界面跳转
        # （navigation）。早先只有前者，于是"去添加凭据"这种纯粹是导航的
        # 建议只能伪装成 `POST /v1/credentials` —— 而它不带请求体，内核会
        # 直接返回 400，用户在界面上点到一个坏掉的按钮。
        navigation:
          type: string
          description: |
            跳转到界面上的某个位置，而不是发请求。与 method/path 互斥。
          enum: [credentials, settings, ddns, services]
        method:
          type: string
          description: 与 path 一起构成一次 API 调用；与 navigation 互斥。
        path: {type: string}
        body:
          type: object
          additionalProperties: true


    Advisory:
      type: object
      required: [id, severity, title]
      properties:
        id: {type: string}
        severity:
          type: string
          enum: [info, warning, blocking]
        title: {type: string}
        detail: {type: string}
        action:
          $ref: "#/components/schemas/AdvisoryAction"

    AdvisoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Advisory"

    App:
      type: object
      required: [id, name, preset_id, kind, source_path, local_port, state, health]
      properties:
        id: {type: string}
        name: {type: string}
        preset_id: {type: string}
        kind:
          type: string
          description: 运行时类型；空串表示静态站点（由内核直接托管）。
        source_path: {type: string}
        local_port: {type: integer}
        state:
          type: string
          enum: [draft, provisioning, installing, building, starting, running, stopping, stopped, failed]
        health:
          type: string
          enum: [unknown, starting, healthy, unhealthy]
        health_detail: {type: string}
        auto_start: {type: boolean}
        max_restarts: {type: integer}
        restart_count: {type: integer}
        last_error: {type: string}
        domains:
          type: array
          items:
            $ref: "#/components/schemas/AppDomain"
        runtime:
          $ref: "#/components/schemas/RuntimeInfo"
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    AppDomain:
      type: object
      required: [name]
      properties:
        name: {type: string}
        # 公网侧状态是读的时候查出来的，不是应用自己的字段。
        route_ready:
          type: boolean
          description: 反向代理里是否已经有一条指向本应用的规则。
        cert_expires_at: {type: string, format: date-time}
        cert_needs_renew: {type: boolean}
        cert_staging: {type: boolean}
        cert_reason: {type: string}
        cert_error: {type: string}

    AppList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/App"

    AppCreateRequest:
      type: object
      required: [name, preset_id, source_path]
      properties:
        name: {type: string, minLength: 1}
        preset_id: {type: string}
        source_path: {type: string, minLength: 1}
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: 留空表示自动分配一个空闲端口。
        domains:
          type: array
          items: {type: string}
        auto_start: {type: boolean}
        max_restarts:
          type: integer
          minimum: 0
          maximum: 10
        custom_executable:
          type: string
          description: |
            仅自定义服务器使用：覆盖预设给出的启动命令。
            **不经 shell**，可执行文件与参数逐项传递。
        custom_args:
          type: array
          items: {type: string}

    AppLogs:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          items: {type: string}

    Preset:
      type: object
      required: [id, version, title, kind, default_port]
      properties:
        id: {type: string}
        version: {type: string}
        title: {type: string}
        kind:
          type: string
          description: |
            所需的运行时类型；空串表示静态站点（由内核直接托管，无需下载）。
            `docker` 表示需要本机已安装 Docker，内核不代为安装。
          enum: ["", node, python, php, go, java, dotnet, docker]
        min_version: {type: string}
        default_port: {type: integer, minimum: 1, maximum: 65535}
        docker_only: {type: boolean}
        detector_files:
          type: array
          items: {type: string}
        detector_suffixes:
          type: array
          items: {type: string}
        note: {type: string}

    PresetCatalog:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Preset"

    SourceInspectRequest:
      type: object
      required: [path]
      properties:
        path: {type: string, minLength: 1}

    SourceEvidence:
      type: object
      required: [file, signal, confidence]
      properties:
        file: {type: string}
        signal: {type: string}
        confidence: {type: number, minimum: 0, maximum: 1}

    SourceInspection:
      type: object
      required: [root, evidence, candidates, recommended_preset_id]
      properties:
        root: {type: string}
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/SourceEvidence"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/Preset"
        recommended_preset_id: {type: string}
        warnings:
          type: array
          items: {type: string}

    RuntimeInfo:
      type: object
      required: [kind, version, source]
      properties:
        kind: {type: string}
        version: {type: string}
        source:
          type: string
          enum: [system, managed, none]
        path: {type: string}
        executable: {type: string}
        size_bytes: {type: integer}

    RuntimeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeInfo"

    RuntimeProvisionRequest:
      type: object
      required: [kinds]
      properties:
        kinds:
          type: array
          minItems: 1
          items: {type: string}
        min_versions:
          type: object
          description: 可选的按类型给出的最低版本要求。
          additionalProperties: {type: string}

    JobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        next_cursor:
          type: string
          description: 为空表示没有更多数据。

    NoopRequest:
      type: object
      properties:
        steps:
          type: integer
          minimum: 1
          maximum: 100
          default: 5
        step_ms:
          type: integer
          minimum: 0
          maximum: 10000
          default: 200
        fail_at_step:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
          description: 大于 0 时在第 N 步失败，用于验证失败路径。

    # ------------------------------------------------------------------
    # DNS 服务商
    # ------------------------------------------------------------------

    Provider:
      type: object
      required: [name, display_name, capabilities, credential_fields]
      properties:
        name:
          type: string
          description: 服务商标识，用于凭据的 provider 字段。
          examples: [cloudflare, alidns, dnspod]
        display_name:
          type: string
          description: 展示名称（已本地化）。
        tier:
          type: integer
          enum: [1, 2]
          description: |
            能力分层：
              1 = 完整记录 CRUD + 动态解析（Tier-1）
              2 = 仅 A/AAAA 动态解析（Tier-2，移植自 ddns-go）
        capabilities:
          $ref: "#/components/schemas/ProviderCapabilities"
        credential_fields:
          type: array
          description: |
            该服务商所需的凭据字段。GUI 遍历它生成表单，
            因此**不需要为每家服务商写死界面**。
          items:
            $ref: "#/components/schemas/ProviderField"
        console_url:
          type: string
          format: uri
          description: |
            该服务商**创建 API 凭据**的控制台页面。

            存在的理由只有一个：把用户直接送到正确的那一页。这几家的
            凭据入口都藏得不浅（Cloudflare 在"我的个人资料 → API 令牌"，
            阿里云在 RAM 控制台），让用户自己翻一遍是纯粹的摩擦 ——
            翻错地方还会顺手把权限过大的 Global API Key 抄出来。

            为空表示这家没有稳定的凭据页面，界面就不提供跳转。
          examples: ["https://dash.cloudflare.com/profile/api-tokens"]

    ProviderField:
      type: object
      required: [key, label, secret, required]
      properties:
        key:
          type: string
          description: 字段名，用作凭据 fields 中的键。
          examples: [id, secret, ext_param]
        label:
          type: string
          description: 展示名称（已本地化）。
        secret:
          type: boolean
          description: |
            为 true 时该字段是敏感值：读取时被掩码，界面应使用密码输入框，
            且不参与日志与导出（除非显式要求导出明文）。
        required:
          type: boolean
        placeholder:
          type: string
          description: 输入提示。
        help:
          type: string
          description: 补充说明，例如"在何处获取该密钥"。
        example:
          type: string

    ProviderCapabilities:
      type: object
      description: 该服务商实际支持的操作。GUI 据此置灰不支持的功能。
      required:
        - available
        - verify
        - dynamic
        - zone_list
        - record_list
        - record_create
        - record_update
        - record_delete
        - all_record_types
        - custom_ttl
        - proxy
        - dns01
      properties:
        available:
          type: boolean
          description: |
            该服务商的实现是否已就绪。

        verify:
          type: boolean
          description: |
            能否校验凭据（"测试连接"）。

            为 false 时界面必须把"测试连接"藏起来或置灰，而不是让用户
            点了才发现这家服务商根本没有只读的校验端点。阿里云 / 腾讯云 /
            华为云 / GoDaddy 当前都没有 —— 用"列一次域名"来冒充会要求
            额外的权限，把只有 DNS 编辑权限的最小权限账号误判为无效。

            为 false 时，服务商出现在列表里只是为了让配置导入与界面展示
            完整，其能力位一律为 false。GUI 应当明确显示"尚未实现"，
            而不是让用户对着一排灰按钮猜原因。
        dynamic:
          type: boolean
          description: |
            能执行动态解析：把 A/AAAA 记录更新到指定 IP。

            Tier-2 服务商只有这一项能力为 true —— 它们存在的意义就是让
            动态地址能被解析，记录管理交给 Tier-1。
        zone_list:
          type: boolean
          description: 能列出账号下的 DNS 区域。
        record_list:
          type: boolean
        record_create:
          type: boolean
        record_update:
          type: boolean
        record_delete:
          type: boolean
        all_record_types:
          type: boolean
          description: 支持 A/AAAA 之外的记录类型（CNAME/MX/TXT/NS/SRV/CAA 等）。
        custom_ttl:
          type: boolean
        proxy:
          type: boolean
          description: 支持 CDN 代理开关（如 Cloudflare 的橙云）。
        dns01:
          type: boolean
          description: 可用于 ACME DNS-01 证书校验。

    # ------------------------------------------------------------------
    # 凭据
    # ------------------------------------------------------------------

    Credential:
      type: object
      required: [id, provider, label, fields, created_at, updated_at]
      properties:
        id:
          type: string
        provider:
          type: string
        label:
          type: string
          description: 用户可读的备注名，用于在界面上区分同一服务商的多组凭据。
        fields:
          type: object
          additionalProperties:
            type: string
          description: |
            凭据字段。**敏感字段一律为掩码值**，明文永不通过接口返回。
            客户端提交更新时若原样回传掩码，内核会保留原值。
        capabilities:
          $ref: "#/components/schemas/ProviderCapabilities"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_verified_at:
          type: string
          format: date-time
        last_verify_ok:
          type: boolean
        last_verify_error:
          type: string

    CredentialInput:
      type: object
      required: [provider, label]
      properties:
        provider:
          type: string
        label:
          type: string
          minLength: 1
        fields:
          type: object
          additionalProperties:
            type: string
          description: |
            凭据字段明文。更新时只提交需要修改的字段；
            敏感字段若提交掩码值则保留原值。

    CredentialList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Credential"
        next_cursor:
          type: string

    # ------------------------------------------------------------------
    # 设置
    # ------------------------------------------------------------------

    Settings:
      type: object
      required: [lang, log_level]
      properties:
        lang:
          type: string
          enum: [zh-CN, en]
        log_level:
          type: string
          enum: [debug, info, warn, error]
        event_buffer_size:
          type: integer
          minimum: 100
          maximum: 100000
          description: 事件环形缓冲容量。调大可延长断线补发的覆盖窗口。
        notify_on_ip_change:
          type: boolean
          description: 地址或 IPv6 前缀变化时是否发送通知。
        proxy_enabled:
          type: boolean
          description: |
            是否启动反向代理。

            默认**关闭**：反代监听在公网上，开启它是一个需要明确决定的
            动作。默认开着会让"我只是想用动态解析"的用户莫名其妙地多出
            一个对外的监听端口。
        proxy_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: |
            反向代理的监听端口。

            默认 443 而不是 8080：用户访问的地址里不该带端口号，
            而 443 是浏览器默认补的那个。
        proxy_tls:
          type: boolean
          description: |
            反向代理是否用 HTTPS 提供服务。

            开启它需要同时配置 ACME（DNS-01 凭据），否则证书签不出来，
            而症状是"浏览器报证书错误"。
        tunnel_enabled:
          type: boolean
          description: |
            是否用 Cloudflare 隧道发布站点。

            它解决的是直连模型解决不了的那类网络：大内网（CGNAT）后的
            家宽、校园网、公司网 —— 入站连接在网关上就被丢掉了，本机
            怎么配都没用。隧道换方向：本机主动向 Cloudflare 建一条长
            连接，外面来的请求顺着它进来。

            与 proxy_enabled 是**叠加**关系：隧道把流量送到本机反代上，
            因此两个要一起开。
        tunnel_binary:
          type: string
          description: |
            cloudflared 的路径；留空则按常见位置自动寻找。

            留这个入口是因为"找不到 cloudflared"是这条链路上最常见的
            一步卡住，而用户装在一个非常规位置时，直接指过去比去猜快。
        acme_email:
          type: string
          description: |
            ACME 账户的联系邮箱。

            它很重要：证书快要过期而自动续期失败时，CA 会用它来提醒。
            不填会让"续期静默失败"变成"站点某天突然打不开"。
        acme_directory:
          type: string
          description: |
            ACME 目录地址。留空用生产环境。

            测试环境（staging）签发的证书**不被浏览器信任**，但配额宽松
            得多 —— 首次配置时值得用它试一遍，因为生产环境的失败配额是
            每小时 5 次，调配置很容易把它用光。
        remote_public_enabled:
          type: boolean
          description: |
            公网访问：在**用户自己的**域名下建一条随机子域名，用 AAAA
            指向本机的公网 IPv6，并给它签一张受信任的证书。

            与 `remote_enabled` 分开而不是合并成一个开关，因为两者的
            **代价**不同：局域网监听只在局域网内可见，而公网访问会把
            内核暴露在互联网上。
        remote_public_domain:
          type: string
          description: |
            子域名挂在哪个域名下（用户选的），例如 `example.com`。

            用户只回答这一个问题：哪把凭据、哪个区域由这个域名唯一决定，
            内核自己反查得出来。填错会一路走到"找不到区域"或者更糟 ——
            在**别的区域**里建了一条记录。
        acme_dns_credential_id:
          type: string
          description: |
            做 DNS-01 校验用的凭据 ID。

            该凭据对应的服务商必须支持完整的记录管理（Tier-1 六家之一）——
            DNS-01 需要在你的 DNS 里创建一条 TXT 记录。

    SettingsPatch:
      type: object
      description: 只提交需要修改的字段。
      properties:
        proxy_enabled:
          type: boolean
        proxy_port:
          type: integer
          minimum: 1
          maximum: 65535
        proxy_tls:
          type: boolean
        acme_email:
          type: string
        acme_directory:
          type: string
        acme_dns_credential_id:
          type: string
        lang:
          type: string
          enum: [zh-CN, en]
        log_level:
          type: string
          enum: [debug, info, warn, error]
        event_buffer_size:
          type: integer
          minimum: 100
          maximum: 100000
        notify_on_ip_change:
          type: boolean

    # ------------------------------------------------------------------
    # 审计
    # ------------------------------------------------------------------

    AuditResult:
      type: string
      enum: [success, failure, denied]

    AuditEntry:
      type: object
      required: [id, ts, action, result]
      properties:
        id:
          type: integer
          format: int64
        ts:
          type: string
          format: date-time
        action:
          type: string
          description: 稳定的机器可读动作名。
          examples: ["credential.create", "credential.update", "config.import"]
        target:
          type: string
          description: 操作对象的标识（例如凭据 ID 或名称）。
        result:
          $ref: "#/components/schemas/AuditResult"
        detail:
          type: string
          description: 补充说明（已本地化，**不含敏感值**）。
        request_id:
          type: string
        remote:
          type: string
          description: 来源描述。本机管理通道下通常是传输类型而非 IP。

    AuditList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_cursor:
          type: string

    # ------------------------------------------------------------------
    # 配置导入导出
    # ------------------------------------------------------------------

    ImportResult:
      type: object
      required: [dry_run, summary]
      properties:
        dry_run:
          type: boolean
        summary:
          $ref: "#/components/schemas/ImportSummary"
        warnings:
          type: array
          description: 不会导致失败、但用户应当知晓的问题（已本地化）。
          items:
            type: string
        errors:
          type: array
          description: 导致对应条目被跳过的错误（已本地化）。
          items:
            type: string

    ImportSummary:
      type: object
      properties:
        credentials_created:
          type: integer
        credentials_updated:
          type: integer
        credentials_skipped:
          type: integer
        tasks_created:
          type: integer
        tasks_updated:
          type: integer
        tasks_skipped:
          type: integer
        settings_updated:
          type: integer

    # ------------------------------------------------------------------
    # IP 状态
    # ------------------------------------------------------------------

    IPStatus:
      type: object
      required: [interfaces]
      properties:
        interfaces:
          type: array
          description: 参与解析的网卡（已排除回环与虚拟网卡）。
          items:
            $ref: "#/components/schemas/InterfaceAddrs"
        # 便捷字段：多数用户只有一个上联网卡，界面上直接展示它即可。
        primary_ipv4:
          type: string
        primary_ipv6:
          type: string
        primary_prefix:
          type: string

    InterfaceAddrs:
      type: object
      required: [name]
      properties:
        name:
          type: string
        index:
          type: integer
        ipv4:
          type: array
          items:
            type: string
        ipv6:
          type: array
          description: 全部 IPv6 地址（含链路本地，供排查用）。
          items:
            type: string
        global_ipv6:
          type: array
          description: |
            可用于公网访问的 IPv6 地址（已排除链路本地、ULA、回环）。
            动态解析只该用这些地址。
          items:
            type: string
        prefixes:
          type: array
          description: |
            该网卡的 IPv6 委派前缀，例如 240e:3b0:1234:5600::/64。
            **这是 ISP 重拨后真正变化的东西。**
          items:
            type: string
        is_up:
          type: boolean

    # ------------------------------------------------------------------
    # 动态解析任务
    # ------------------------------------------------------------------

    DdnsTask:
      type: object
      required: [id, credential_id, label, enabled, ipv4, ipv6, created_at, updated_at]
      properties:
        id:
          type: string
        credential_id:
          type: string
        label:
          type: string
        enabled:
          type: boolean
        ipv4:
          $ref: "#/components/schemas/DdnsSource"
        ipv6:
          $ref: "#/components/schemas/DdnsSource"
        ttl:
          type: string
          description: 记录生存时间（秒）。空串表示使用服务商默认值。
        http_interface:
          type: string
          description: 发送请求时绑定的网卡名；为空表示默认网卡。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

        # --- 运行状态（只读，由内核写入） ---
        last_run_at:
          type: string
          format: date-time
        last_status:
          $ref: "#/components/schemas/DdnsStatus"
        last_message:
          type: string
          description: 上次执行的说明（已本地化）。
        last_ipv4:
          type: string
        last_ipv6:
          type: string

    DdnsStatus:
      type: string
      enum: ["", success, unchanged, failed]
      description: |
        空串表示从未执行过。

        unchanged 与 success 的区别很重要：前者表示"记录本来就是对的"，
        不该触发通知；后者表示"真的改动了"，值得告诉用户。

    DdnsSource:
      type: object
      required: [enable, get_type, value, domains]
      properties:
        enable:
          type: boolean
          description: 为 false 时该记录类型不参与解析。
        get_type:
          type: string
          enum: [netInterface, url, cmd]
          description: |
            netInterface  从网卡读取（走内核的地址快照，已过滤不可用于公网的地址）
            url           通过外部接口查询，可填多个并用逗号分隔
            cmd           执行命令并从输出中抓取
        value:
          type: string
          description: 网卡名 / URL 列表 / 命令，含义由 get_type 决定。
        domains:
          type: array
          items:
            type: string
          description: |
            要更新的域名。支持两种写法：

              www.example.com   自动识别根域名
              www:example.com   显式指定"子域名:根域名"

            后者用于 publicsuffix 无法正确判断的域名。
        selector:
          type: string
          description: |
            仅 IPv6 使用：地址选择器。

              "@2"        取第 2 个（从 1 开始）
              "^240e:.*"  正则筛选，取第一个匹配的
              留空        取第一个

    DdnsTaskInput:
      type: object
      required: [credential_id, label]
      properties:
        credential_id:
          type: string
        label:
          type: string
          minLength: 1
        enabled:
          type: boolean
        ipv4:
          $ref: "#/components/schemas/DdnsSource"
        ipv6:
          $ref: "#/components/schemas/DdnsSource"
        ttl:
          type: string
        http_interface:
          type: string

    DdnsTaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DdnsTask"

    # ------------------------------------------------------------------
    # DNS 区域与记录
    # ------------------------------------------------------------------

    ZoneList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Zone"

    CredentialVerifyResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        message:
          type: string
          description: |
            结果说明。校验失败时这里是**已经翻译过**的原因 ——
            服务商返回的原始错误文本不会告诉用户该去改什么。

    Zone:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: 服务商侧的区域 ID，用于后续的记录操作。
        name:
          type: string
          description: 区域名，例如 example.com（**不含结尾的点**）。

    Record:
      type: object
      required: [id, name, type, content]
      properties:
        id:
          type: string
          description: |
            服务商侧的记录 ID。

            注意：少数服务商（如 GoDaddy）没有记录 ID，此时内核会合成一个
            稳定标识。合成 ID 在记录内容变化后会失效 —— 详见
            `docs/PROVIDER-MATRIX.md`。
        name:
          type: string
          description: 完整记录名，例如 www.example.com。
        type:
          type: string
          description: 记录类型，例如 A / AAAA / CNAME / MX / TXT / NS / SRV / CAA。
        content:
          type: string
        ttl:
          type: integer
          description: 生存时间（秒）。0 表示使用服务商默认值。
        proxied:
          type: boolean
          description: CDN 代理开关。仅部分服务商的部分记录类型支持。
        comment:
          type: string
        priority:
          type: integer
          description: MX / SRV 记录的优先级。

    RecordInput:
      type: object
      required: [name, type, content]
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        content:
          type: string
        ttl:
          type: integer
          minimum: 0
        proxied:
          type: boolean
        comment:
          type: string
        priority:
          type: integer

    RecordList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Record"

    # ------------------------------------------------------------------
    # 可达性
    # ------------------------------------------------------------------

    ReachProviderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReachProvider"

    ReachProvider:
      type: object
      required: [name, display_name, description, needs_external_server, tier]
      properties:
        name:
          type: string
        display_name:
          type: string
        description:
          type: string
          description: 工作原理的简要说明，用户据此在多种方式间做选择。
        needs_external_server:
          type: boolean
          description: |
            是否依赖一台外部服务器。

            这是用户决策时最关键的一条信息：要不要另外买一台机器、
            流量会不会经过别人的设备。
        tier:
          type: integer
          description: 实现成熟度。1 = 完整实现，2 = 骨架。

    ReachReadiness:
      type: object
      required: [viable, checks, summary]
      properties:
        viable:
          type: boolean
          description: |
            当前是否可用。

            判定只看 `local` 作用域的检测项 —— 上游不通不代表本机
            配置有问题。
        summary:
          type: string
          description: 一句话结论，先给结论再给下一步。
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ReachCheck"

    ReachCheck:
      type: object
      required: [name, scope, status]
      properties:
        name:
          type: string
        scope:
          type: string
          enum: [local, upstream]
        status:
          type: string
          enum: [pass, fail, warn, unknown, blocked]
          description: |
            - `pass`    通过
            - `fail`    未通过，且这是**本机**能够修复的问题
            - `warn`    有隐患但不阻断
            - `unknown` 无法判定（例如需要外部视角）
            - `blocked` 本机一切正常，但**上游**挡住了

            `fail` 与 `blocked` 刻意分开：前者是"去改本机设置"，
            后者是"本机已经没得改了"。把它们混在一起正是让用户
            白白折腾几小时的原因。
        detail:
          type: string
          description: 观察到的具体事实。
        hint:
          type: string
          description: |
            **该怎么办**。

            这一栏是整套检测里最有价值的部分 —— 用户能自己看到
            "没有 IPv6 地址"，但他真正需要的是"去路由器的 IPv6 设置里
            确认前缀委派已开启"。

    # ------------------------------------------------------------------
    # 变更记录
    # ------------------------------------------------------------------

    ChangeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChangeRecord"

    # ------------------------------------------------------------------
    # 变更预览与应用
    # ------------------------------------------------------------------

    ExposeRequest:
      type: object
      required: [port]
      properties:
        port:
          type: integer
          minimum: 1
          maximum: 65535
        protocol:
          type: string
          enum: [tcp, udp]
          default: tcp
        label:
          type: string
          description: |
            规则的可读名称，例如服务名。它会出现在系统防火墙界面里，
            因此应当填一个用户认得出的名字。

            非 ASCII 字符会被丢弃 —— 防火墙规则的名称在不同平台上对
            字符集的要求不一致，塞进去会变成一条无法创建、也无法删除
            的幽灵规则。

    ChangePreviewList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChangePreview"

    ChangePreview:
      type: object
      required: [id, kind, title, risk, diff, steps, empty, created_at, expires_at]
      properties:
        id:
          type: string
        kind:
          type: string
        title:
          type: string
        risk:
          type: string
          enum: [low, medium, high]
        diff:
          type: array
          items:
            $ref: "#/components/schemas/ChangeDiffLine"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ChangeStepPreview"
        warnings:
          type: array
          items:
            type: string
          description: 界面上需要显著提示的内容。
        notes:
          type: array
          items:
            type: string
          description: 背景说明。
        empty:
          type: boolean
          description: |
            无需改动（已是目标状态）。

            界面应当把它显示成"无需改动"而不是"操作失败"：用户点
            "开放 443"而 443 已经开放时，那不是错误。
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: 超过这个时间计划会失效，需要重新生成。

    ChangeStepPreview:
      type: object
      required: [id, title, revertable]
      properties:
        id:
          type: string
        title:
          type: string
        details:
          type: string
        diff:
          type: array
          items:
            $ref: "#/components/schemas/ChangeDiffLine"
        revertable:
          type: boolean
          description: |
            这一步出问题时能否撤销。

            界面必须在应用**之前**显示它 —— 用户有权知道"这一步做错了
            能不能退"。

    # ------------------------------------------------------------------
    # 反向代理
    # ------------------------------------------------------------------

    TunnelStatus:
      type: object
      required: [enabled, state, name, connections, proxy_port]
      properties:
        enabled: {type: boolean}
        state:
          type: string
          enum: [disabled, no_binary, no_account, starting, running, failed]
        name:
          type: string
          description: 隧道名。内核固定用同一个名字，便于识别与复用。
        id:
          type: string
          description: 隧道 id；没有隧道时缺省。
        hostname:
          type: string
          description: |
            DNS 上 CNAME 应该指向的目标（`<id>.cfargotunnel.com`）。
            域名绑定用它；没有隧道时缺省。
        connections:
          type: integer
          description: 最近一次看到的到 Cloudflare 边缘的连接数。
        binary:
          type: string
          description: 实际会用到的 cloudflared 路径；找不到时缺省。
        proxy_port: {type: integer}
        last_error:
          type: string
          description: 最近一次失败的原因。
        log_tail:
          type: array
          description: 隧道进程最近几行输出，供排查。
          items: {type: string}

    ProxyStatus:
      type: object
      required: [running, port, routes]
      properties:
        running:
          type: boolean
        port:
          type: integer
        routes:
          type: integer
        error:
          type: string
          description: |
            最近一次启动失败的原因。

            它必须被展示 —— 端口被占用之类的失败如果只写进日志，
            用户在界面上看到的就是"代理没开"，而不知道为什么。

    ProxyRouteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProxyRoute"

    ProxyRoute:
      type: object
      required: [id, domains, upstream]
      properties:
        id:
          type: string
        label:
          type: string
          description: 用户可读的名称。
        domains:
          type: array
          items:
            type: string
          description: |
            要匹配的域名。支持两种写法：

              home.example.com    精确匹配
              *.example.com       匹配**一级**子域名

            `*.example.com` 不匹配 `example.com` 本身，也不匹配
            `a.b.example.com` —— 这与 TLS 证书的通配规则一致。
            放宽它的后果是用户拿到一个证书不匹配的域名，
            而浏览器只会说"证书无效"。
        upstream:
          type: string
          description: |
            转发目标，形如 `http://127.0.0.1:8096`。

            **必须是本机或内网地址。** 反代监听在公网上，若允许任意
            上游，任何人都能拿它当跳板 —— 而所有流量都记在用户头上。
        tls:
          type: boolean
          description: 该域名是否需要 HTTPS。

    # ------------------------------------------------------------------
    # 证书
    # ------------------------------------------------------------------

    CertList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CertStatus"

    CertStatus:
      type: object
      required: [name, needs_renew]
      properties:
        name:
          type: string
          description: 证书在存储里的名字（通常是主域名）。
        domains:
          type: array
          items:
            type: string
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        staging:
          type: boolean
          description: |
            是否来自 ACME 测试环境。

            必须暴露出来：测试环境签发的证书**不被浏览器信任**，
            而用户在界面上只会看到"证书无效"。
        needs_renew:
          type: boolean
        reason:
          type: string
          description: 为什么需要续期。
        error:
          type: string
          description: 最近一次签发失败的原因。

    # ------------------------------------------------------------------
    # 通知
    # ------------------------------------------------------------------

    NotifyChannelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotifyChannel"

    NotifyChannel:
      type: object
      required: [id, name, kind]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [webhook, log]
        enabled:
          type: boolean
        url:
          type: string
          description: Webhook 的目标地址。只允许 http / https。
        method:
          type: string
          description: HTTP 方法，默认 POST。
        headers:
          type: object
          additionalProperties:
            type: string
          description: |
            附加请求头。

            **不要在这里放明文密钥** —— 这个字段会被接口原样返回。
            需要鉴权时请让接收端校验来源地址。
        body_template:
          type: string
          description: |
            请求体模板，留空时发送默认的 JSON 结构。

            可用变量：`{{.Event}}` `{{.Title}}` `{{.Body}}`
            `{{.Severity}}` `{{.At}}`（RFC3339）。

            各家的消息格式差异很大（飞书要嵌套的 `msg_type`，
            Slack 只要一个 `text`），模板让用户不必等内核适配。

            模板**语法错误会在保存时被拒绝**，而不是等到发送时。
        min_severity:
          type: string
          enum: [info, warning, error]
          description: |
            该通道的最低发送级别。

            每个通道可以有自己的阈值 —— "错误发到手机，全部发到日志"
            是常见需求。
          default: info

    NotifyDeliveryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotifyDelivery"

    NotifyDelivery:
      type: object
      required: [channel, kind, ok, at]
      properties:
        channel:
          type: string
        kind:
          type: string
        ok:
          type: boolean
        error:
          type: string
        at:
          type: string
          format: date-time

    # ------------------------------------------------------------------
    # 系统服务
    # ------------------------------------------------------------------

    ServiceStatusInfo:
      type: object
      required: [daemon_reachable, backend]
      properties:
        daemon_reachable:
          type: boolean
          description: 内核现在是否真的能连通。这一项**不需要任何权限**。
        status:
          type: string
          enum: [unknown, stopped, running]
        backend:
          type: string
          description: 平台后端名，例如 windows-scm / systemd / launchd。
        error:
          type: string
          description: 查询服务状态失败的原因（通常是权限不足）。

    ServiceInstallRequest:
      type: object
      properties:
        auto_start:
          type: boolean
          description: 开机自启（Windows 上使用延迟自启，等网络就绪后再启动）。
          default: true
        restart_on_failure:
          type: boolean
          description: 崩溃后自动重启（递增延迟，避免持续崩溃时无限重启）。
          default: true

    ServiceActionResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        message:
          type: string

    ChangeRecord:
      type: object
      required: [plan_id, kind, title, risk, status, steps, created_at, updated_at]
      properties:
        plan_id:
          type: string
        kind:
          type: string
          description: 变更类型，例如 firewall.expose_port。
        title:
          type: string
        risk:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [applying, applied, failed, rolled_back, rollback_failed]
          description: |
            - `applying`        正在执行。**这个状态停着不动说明内核上次异常退出**
            - `applied`         全部步骤成功
            - `failed`          有步骤失败，但已完成自动回滚
            - `rolled_back`     已撤销
            - `rollback_failed` 回滚本身失败 —— 系统处于中间态，最严重
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ChangeStep"
        warnings:
          type: array
          items:
            type: string
          description: 界面上需要显著提示的内容。
        notes:
          type: array
          items:
            type: string
          description: 背景说明。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ChangeStep:
      type: object
      required: [id, title, state]
      properties:
        id:
          type: string
        title:
          type: string
        state:
          type: string
          enum: [pending, applied, failed, reverted, skipped]
        diff:
          type: array
          items:
            $ref: "#/components/schemas/ChangeDiffLine"
        error:
          type: string

    ChangeDiffLine:
      type: object
      required: [op, text]
      properties:
        op:
          type: string
          enum: [add, remove, keep, change]
        text:
          type: string

    # ------------------------------------------------------------------
    # 外部验证
    # ------------------------------------------------------------------

    VerifySessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VerifySession"

    VerifyStartRequest:
      type: object
      properties:
        port:
          type: integer
          minimum: 0
          maximum: 65535
          description: |
            要监听的端口。为 0 或省略时由内核分配一个空闲端口。

            用随机端口有个好处：它几乎不可能与用户已有的服务冲突，
            也不需要用户在验证前先去关掉什么。
        target_ip:
          type: string
          description: |
            给用户打开的公网地址。留空时内核自动取当前的全局 IPv6。

            只有在机器有多个公网地址、用户想指定其中一个时才需要填。

    VerifySession:
      type: object
      required: [id, port, token, status, hits, created_at, expires_at, message]
      properties:
        id:
          type: string
        port:
          type: integer
        token:
          type: string
          description: URL 里的随机路径段。
        target_ip:
          type: string
        url:
          type: string
          description: |
            让用户在手机上打开的完整地址。

            IPv6 字面量已经带上方括号 —— 不带的话 URL 解析会把地址里的
            冒号当成端口分隔符。
        status:
          type: string
          enum: [waiting, reachable, hairpin_only, unreachable, stopped]
          description: |
            - `waiting`        等待外部访问
            - `reachable`      收到了来自**公网地址**的访问 —— 链路确实通
            - `hairpin_only`   只收到了来自本机或内网的访问。
              **这什么也证明不了**：用户在自己电脑上打开、或者手机
              还连着 Wi-Fi，都会走不经过运营商的路径
            - `unreachable`    超时，始终没有收到任何访问
            - `stopped`        被用户主动停止
        message:
          type: string
          description: 一句话结论（已本地化）。
        hits:
          type: array
          items:
            $ref: "#/components/schemas/VerifyHit"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    VerifyHit:
      type: object
      required: [remote_addr, kind, at]
      properties:
        remote_addr:
          type: string
        kind:
          type: string
          enum: [public, self, loopback, private, link_local]
          description: |
            来源分类。只有 `public` 能证明链路可用。

            `self` 是最容易被误判成成功的一类：**IPv6 没有 NAT**，
            从本机访问自己的公网 IPv6 地址时连接是直连的，
            来源地址就是那个全局单播地址 —— 光看地址类型完全正常。
        user_agent:
          type: string
        at:
          type: string
          format: date-time

    # ------------------------------------------------------------------
    # 远程访问（ISC Mizar）
    # ------------------------------------------------------------------

    RemoteState:
      type: string
      enum: [disabled, starting, running, failed]
      description: |
        disabled  总开关关闭
        starting  正在启动监听
        running   正在监听
        failed    启动失败（原因见 `last_error`）

    RemoteRole:
      type: string
      enum: [viewer, operator]
      description: |
        权限只有两级，刻意不做细粒度 scope：

        viewer   只读监控 —— 所有 GET
        operator 只读 + DNS 记录增删改、DDNS 任务启停、站点启停重启、
                 证书手动续期

        两级的判据是"这台设备能不能改到用户的东西"，而不是按接口分类：
        多一级就要在契约、存储、中间件与授权界面四处都引入能力位，而
        多出来的表达力在三五个接口上换不回等价的可理解性。

    PairingSession:
      type: object
      required: [id, role, fingerprint_short, spki_sha256, addresses, expires_at, qr_payload, qr_link]
      properties:
        id: {type: string}
        role:
          $ref: "#/components/schemas/RemoteRole"
        label:
          type: string
          description: 给将要配对的设备预留的名字；留空表示由设备自称。
            这几个字符靠读音与字形都分不开，是这类码最常见的失败。
        fingerprint_short:
          type: string
          description: 证书公钥指纹的短形式，形如 `A1B2-C3D4`，供两端人工核对。
        spki_sha256:
          type: string
          description: 自签证书公钥（SubjectPublicKeyInfo）的 SHA-256，base64url。
        addresses:
          type: array
          description: 候选地址（含端口）。IPv4 在前，IPv6 与主机名在后。
          items: {type: string}
        expires_at:
          type: string
          format: date-time
        qr_payload:
          type: string
          description: |
            二维码里要编码的原文。**由内核生成** —— payload 是契约的一部分，
            GUI 只负责把它渲染成像素。两个实现意味着两处会漂移。
        qr_link:
          type: string
          description: |
            同一份载荷的**可复制**形式：`isc-remote://pair?d=<base64url>`。

            它是给"新设备没法扫码"准备的 —— 用户在 Phecda 上点复制、
            发给自己、在新设备上粘贴一次即可，全程不用碰地址。

            与 `qr_payload` 一样**由内核生成**：链接的格式是契约，
            让 GUI 自己拼一遍意味着两个实现，而它们会漂移 ——
            症状是"某个版本的 App 粘不进去"。

            ⚠️ 它在有效期内**是一张通行证**：谁拿到谁就能配对。
            因此是一次性的，且 5 分钟过期。

    PairingRequest:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/RemoteRole"
        label:
          type: string
          description: 设备名；留空由内核给一个默认名。

    RemoteDevice:
      type: object
      required: [id, label, role, notifications_enabled]
      properties:
        id: {type: string}
        label: {type: string}
        role:
          $ref: "#/components/schemas/RemoteRole"
        parent_device_id:
          type: string
          description: 派生令牌的来源设备；空串表示直接配对而来。
        platform: {type: string}
        model: {type: string}
        os_version: {type: string}
        app_version: {type: string}
        notifications_enabled:
          type: boolean
          description: 是否接收推送。默认关闭 —— 推送需要设备侧显式开启。
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_seen_at:
          type: string
          format: date-time
          description: 最后一次通过鉴权的请求时间。
        last_seen_ip: {type: string}
        revoked_at:
          type: string
          format: date-time
          description: 吊销时间；已吊销的设备保留在列表里以便追溯。

    RemoteDeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RemoteDevice"

    RemoteDevicePatch:
      type: object
      properties:
        label: {type: string}
        role:
          $ref: "#/components/schemas/RemoteRole"
        notifications_enabled: {type: boolean}

    RemoteServerInfo:
      type: object
      required: [name, version, api_version]
      properties:
        name:
          type: string
          description: 服务器显示名。默认取主机名。
        version: {type: string}
        api_version: {type: string}
        platform: {type: string}
        spki_sha256: {type: string}
        fingerprint_short: {type: string}
        apns_topic:
          type: string
          description: 若已配置 APNs，这里给出通知该登记的 topic。
        notifications_enabled: {type: boolean}

    RemoteSelf:
      type: object
      required: [device, role, server]
      properties:
        device:
          $ref: "#/components/schemas/RemoteDevice"
        role:
          $ref: "#/components/schemas/RemoteRole"
        server:
          $ref: "#/components/schemas/RemoteServerInfo"
        public:
          $ref: "#/components/schemas/RemotePublicProbe"

    RemotePublicProbe:
      type: object
      required: [port, targets]
      description: |
        可达性自检的**探测计划**。

        内核测不了自己的入站可达性：本机发起的连接走的是内部路径
        （同网段二层、跨网段 NAT 环回），与真实客户端的路径不同。
        而手机就在真实客户端要走的网络上，因此由内核下发计划、
        手机逐个试、再把结果报回来。
      properties:
        host:
          type: string
          description: 子域名；还没建立时为空。
        port: {type: integer}
        targets:
          type: array
          items:
            type: object
            required: [family, url]
            properties:
              family:
                type: string
                description: 地址族标签（host / ipv6 / ipv4）。只用于显示。
              url:
                type: string
                description: |
                  完整可请求的地址。给完整 URL 而不是 host:port：
                  手机不该自己拼路径，路径属于契约。
              address: {type: string}
        lan_addresses:
          type: array
          items: {type: string}
          description: |
            **手机必须先试这些。** 局域网能通就说明它和内核在同一个
            网络里，那次公网探测不作数 —— 那个连接根本没出局域网。
            把它当成"公网可达"会让用户以为已经验证过，而其实没有。
        note:
          type: string
          description: 没有可探测的地址时说明为什么。

    RemotePublicCheckReport:
      type: object
      required: [family, reachable]
      properties:
        family:
          type: string
          enum: [ipv6, ipv4]
        reachable: {type: boolean}
        same_lan:
          type: boolean
          description: |
            手机自己判断"我和内核在同一个网络里"。为真时这次探测
            **不作数**，内核会记成 unknown 而不是 reachable。
        detail:
          type: string
          description: 失败原因，由手机原样带回来给用户看。

    RemoteDeviceInfo:
      type: object
      required: [name]
      properties:
        name: {type: string}
        platform: {type: string}
        model: {type: string}
        os_version: {type: string}
        app_version: {type: string}

    RemotePairRequest:
      type: object
      required: [device]
      properties:
        secret:
          type: string
          description: |
            配对密钥。**唯一**的配对凭证，来自二维码载荷或配对链接。

            以前还有一个六位手输码作为替代，已删除 —— 它只有约 10 亿
            种可能、靠按来源锁定兜底，而且携带不了任何身份信息
            （所以那时必须让用户人工比对公钥指纹）。
        device:
          $ref: "#/components/schemas/RemoteDeviceInfo"

    RemotePairResult:
      type: object
      required: [device_id, token, role, server]
      properties:
        device_id: {type: string}
        token:
          type: string
          description: |
            设备令牌。**只在这一个响应里出现**：服务端只存它的 SHA-256。
            丢了这个响应只能重新配对，这是刻意的。
        role:
          $ref: "#/components/schemas/RemoteRole"
        server:
          $ref: "#/components/schemas/RemoteServerInfo"

    RemoteDeriveRequest:
      type: object
      required: [role]
      properties:
        # 派生设备的角色；必须不高于父设备（服务端强制，见 D38）。
        role:
          $ref: "#/components/schemas/RemoteRole"
        label: {type: string}
        device:
          $ref: "#/components/schemas/RemoteDeviceInfo"

    RemotePushTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: APNs 设备令牌（十六进制）。
        environment:
          type: string
          enum: [sandbox, production]
        topic: {type: string}

    ApnsCredentials:
      type: object
      required: [team_id, key_id, bundle_id, private_key]
      properties:
        team_id: {type: string}
        key_id: {type: string}
        bundle_id:
          type: string
          description: 同时用作 `apns-topic`。
        private_key:
          type: string
          description: "`.p8` 鉴权密钥的文本内容。只写不读：它出现在任何响应或日志里都是缺陷。"

    ApnsStatus:
      type: object
      required: [configured]
      properties:
        configured: {type: boolean}
        team_id: {type: string}
        key_id: {type: string}
        bundle_id: {type: string}

    RemoteStatus:
      type: object
      required: [state, enabled, port, device_count, notifications_enabled]
      properties:
        state:
          $ref: "#/components/schemas/RemoteState"
        enabled: {type: boolean}
        port: {type: integer}
        listening:
          type: boolean
          description: 监听是否真的起来了（`state == running` 时才是 true）。
        addresses:
          type: array
          description: |
            可供客户端尝试的候选地址（含端口）。顺序即建议的尝试顺序：
            IPv4 私有地址在前，IPv6 与 `<hostname>.local` 在后。
          items: {type: string}
        hostname: {type: string}
        spki_sha256: {type: string}
        fingerprint_short: {type: string}
        tls_not_after:
          type: string
          format: date-time
        device_count: {type: integer}
        pairing:
          $ref: "#/components/schemas/PairingSession"
        apns_configured: {type: boolean}
        apns_status:
          $ref: "#/components/schemas/ApnsStatus"
        notifications_enabled: {type: boolean}
        last_error:
          type: string
          description: 最近一次监听失败的原因（本地化）。空串表示正常。
        public:
          $ref: "#/components/schemas/RemotePublicStatus"

    RemotePublicStatus:
      type: object
      required: [enabled, ready]
      description: |
        公网访问：在**用户自己的**域名下建一条随机子域名，用 AAAA 指向
        本机的公网 IPv6，并给它签一张受信任的证书。

        与局域网监听分开描述，因为两者的**代价**不同：局域网监听只在
        局域网内可见，而公网访问会把内核暴露在互联网上。
      properties:
        enabled:
          type: boolean
          description: 用户是否开启了公网访问。
        ready:
          type: boolean
          description: |
            凭据与区域都配好了、可以开始同步。
            与 `enabled` 分开：勾了开关但没选凭据时，用户需要知道
            差的是哪一步，而不是看到一个"已开启"却什么都没发生。
        domain:
          type: string
          description: |
            子域名挂在哪个域名下（用户选的），例如 `example.com`。

            **不是**凭据 ID 与区域 ID：那两件事由这个域名唯一决定 ——
            区域是域名的最长后缀匹配，而区域只可能在一把凭据下。
            让用户填两个内部 ID 是在要求他心算一件内核明明知道的事，
            而他没有任何办法验证自己填对了。
        host:
          type: string
          description: |
            完整的子域名，例如 `mizar-a7f3k9x2n4bd5e6f.example.com`。
            它一旦生成就**长期不变** —— 变化会让手机上的二维码、
            书签与防火墙规则全部失效。
        records:
          type: object
          additionalProperties: {type: string}
          description: |
            "记录类型 → 地址值"。只含内核自己写的那几条。
            按规则**只会**出现 AAAA；A 只在实测过 IPv4 可达之后才写
            （家用宽带多为大内网，写一条连不上的 A 比不写更糟）。
        last_check:
          $ref: "#/components/schemas/RemotePublicCheck"

    RemotePublicCheck:
      type: object
      required: [at, verdict]
      description: |
        一次可达性自检的结论。

        三值而不是布尔：**"没测过"与"测了但不通"是两件事**，
        用户该做的事完全不同 —— 前者是"去测一下"，后者是"去查路由器"。
      properties:
        at: {type: string, format: date-time}
        verdict:
          type: string
          enum: [unknown, reachable, unreachable]
        family:
          type: string
          description: 被验证的地址族（ipv6 / ipv4）。
        detail:
          type: string
          description: 给用户看的一句话。

    RemoteSettingsPatch:
      type: object
      properties:
        enabled:
          type: boolean
          description: 总开关。默认关闭 —— 对外监听是需要用户明确决定的动作。
        port:
          type: integer
          minimum: 1
          maximum: 65535
        notifications_enabled:
          type: boolean
          description: 推送总开关。默认关闭。

    KernelEvent:
      type: object
      required: [seq, ts, type]
      properties:
        seq:
          type: integer
          format: int64
          description: 单调递增的事件序号，用作游标。
        ts:
          type: string
          format: date-time
        type:
          type: string
          examples: ["app.state_changed", "cert.issued", "dns.updated"]
        payload:
          type: object
          additionalProperties: true

    EventPoll:
      type: object
      required: [events, next, gap]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/KernelEvent"
        next:
          type: integer
          format: int64
          description: 下次请求应当携带的游标。
        gap:
          type: boolean
          description: |
            为 true 表示游标已跌出环形缓冲（或内核重启过），中间的事件
            已经丢失。此时**不要试图补齐** —— 全量重拉一次状态即可。
