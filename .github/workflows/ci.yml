name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 默认最小权限：CI 只需要读代码。
permissions:
  contents: read

env:
  # 本项目硬约束：构建产物不得依赖 cgo（见 docs/PLAN.md §0）。
  # 这样三平台交叉编译与发布都不需要 C 工具链。
  CGO_ENABLED: "0"

  # 构建与检查用的 Go 版本 —— 单一真理来源是 scripts/tool-versions.env，
  # 两边由 TestCIToolchainMatchesPinnedVersion 钉住。
  #
  # 为什么不能"跟 go.mod 的 go 指令走"：gofmt 的输出**随版本变化**
  # （1.26 与 1.27 对含 CJK 的 map 对齐宽度算法不同），于是同一个文件
  # 会在一边干净、在另一边被判定未格式化 —— 这一条真实发生过。
  # matrix-build 那一组刻意保留 go.mod 的版本，验证"最低版本仍能构建"。
  GO_VERSION: "1.27.1"

jobs:
  # ---------------------------------------------------------------------------
  # 交叉编译矩阵
  #
  # 存在意义见 docs/DECISIONS.md D11 与 docs/PLAN.md R2：
  # 内核是一套 Go 代码，必须保证**任何时刻**所有目标平台都能编译通过，
  # 未实现的平台后端靠 stub 兜底。某个平台"先不管"是不允许的。
  # ---------------------------------------------------------------------------
  matrix-build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: freebsd, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      # 这一组刻意**用 go.mod 里的最低版本**，而不是固定的 GO_VERSION：
      # 别的 job 验证"用我们自己的工具链一切正常"，这里验证
      # "声明的最低版本仍然能构建"。两条是不同的承诺，不能合成一条。
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 交叉编译
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

      - name: 确认没有 cgo 依赖
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          # CGO_ENABLED=0 时若有依赖需要 cgo，构建会直接失败。
          # 这里额外打印一次，便于在日志里确认约束确实生效。
          echo "CGO_ENABLED=$CGO_ENABLED"

  # ---------------------------------------------------------------------------
  # 测试
  #
  # 分两组：
  #   - 三平台原生测试，CGO_ENABLED=0，验证产品构建形态下行为正确；
  #   - 在 Linux / macOS 上额外开 cgo 跑 -race。
  #     Windows 开发机没有 C 工具链，竞态检测只能在 CI 的这一组里做。
  # ---------------------------------------------------------------------------
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: gofmt 检查
        if: runner.os != 'Windows'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

  race:
    name: race (linux, cgo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # 竞态检测需要 cgo，因此这里显式覆盖全局的 CGO_ENABLED=0。
      # 这只影响测试，不影响发布产物的构建形态。
      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: go test -race ./... -count=1

  # ---------------------------------------------------------------------------
  # 发布构建
  #
  # 它验证的不只是"能构建"：矩阵那一组已经保证了每个平台能编译。这一组
  # 验证的是**打包链路**（产物内容、版本注入、校验和），而那是用户真正
  # 拿到的东西 —— 一个"能编译但打不出包"的仓库对用户毫无价值。
  # ---------------------------------------------------------------------------
  release-build:
    name: 发布构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 版本号由 git describe 推导，浅克隆会让它退化成一个裸哈希。
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 构建全部平台
        run: go run ./scripts/release -out dist -version 0.0.0-ci

      - name: 核对产物
        run: |
          set -euo pipefail

          # 七个平台一个都不能少。
          expected="windows-amd64 windows-arm64 linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 freebsd-amd64"
          for label in $expected; do
            if [ "$label" = "windows-amd64" ] || [ "$label" = "windows-arm64" ]; then
              ext=zip
            else
              ext=tar.gz
            fi
            test -f "dist/isc-0.0.0-ci-$label.$ext" || {
              echo "::error::缺少产物 $label"
              exit 1
            }
          done

          # 校验和必须覆盖全部产物（7 个压缩包 + 2 个 .deb + 2 个 .rpm）。
          lines=$(wc -l < dist/SHA256SUMS)
          if [ "$lines" -ne 11 ]; then
            echo "::error::SHA256SUMS 应当有 11 行，实际 $lines 行"
            exit 1
          fi
          (cd dist && sha256sum -c SHA256SUMS)

      - name: 核对包内容
        run: |
          set -euo pipefail

          # 许可证必须随包分发（GPLv3 的要求）。
          mkdir -p /tmp/x
          tar -xzf dist/isc-0.0.0-ci-linux-amd64.tar.gz -C /tmp/x
          for f in isc LICENSE THIRD_PARTY_NOTICES.md README.md; do
            test -f "/tmp/x/$f" || { echo "::error::包里缺少 $f"; exit 1; }
          done

          # 可执行位必须保留 —— tar.gz 在 Unix 上是标准，
          # 而丢了这个位会让用户解压后无法直接运行。
          test -x /tmp/x/isc || { echo "::error::isc 没有可执行位"; exit 1; }

      - name: 核对 .deb
        run: |
          set -euo pipefail

          # CI 跑在 Ubuntu 上，因此可以用真正的 dpkg 来验证 ——
          # 这是比单元测试更强的证据：单元测试用的是我们自己写的
          # ar 解析器，而这里是 Debian 自己的工具。
          #
          # 名字由 TestPackageFileNames 钉住，这里不重复写死一遍
          # （写死过一次，而且写错了：`isc-0.0.0-ci-linux-amd64.deb`
          #  是发布压缩包的命名，.deb 从第一天起叫 `isc_<版本>_<架构>.deb`）。
          #
          # ⚠️ 一次构建产出**两个** .deb（linux/amd64 与 linux/arm64）。
          # 上一版写成 `deb=$(ls dist/*.deb)` 再 `dpkg-deb --info "$deb"`，
          # 变量里其实是**两行**路径 —— dpkg-deb 收到带换行的参数后以退出码 2
          # 失败，且它不输出我们的 ::error::，于是 CI 只报
          # "Process completed with exit code 2"，指不到原因。
          # 因此这里用数组逐个处理，并且每一条外部命令失败时都自己报出来。
          debs=(dist/*.deb)
          if [ ${#debs[@]} -eq 0 ]; then
            echo "::error::缺少 .deb"
            exit 1
          fi
          echo "找到 ${#debs[@]} 个 .deb：${debs[*]}"

          for d in "${debs[@]}"; do
            echo "--- dpkg-deb --info $d ---"
            dpkg-deb --info "$d" || { echo "::error::$d 不是 dpkg 认得的包"; exit 1; }

            echo "--- dpkg-deb --contents $d ---"
            contents=$(dpkg-deb --contents "$d") || {
              echo "::error::$d 的内容读不出来"
              exit 1
            }
            echo "$contents"

            # 可执行文件必须在，且必须带执行位。
            #
            # 刻意**不**去匹配整行的空格数量：dpkg-deb 的列宽、以及路径是
            # `./usr/bin/isc` 还是 `usr/bin/isc`，都会随版本/后端变化。
            # 上一版写的是 `^-rwxr-xr-x .* \./usr/bin/isc$`，于是把一份
            # 结构完全合规的包判成了"没有执行位" —— 而错误信息里也没有
            # 它到底看到了什么。
            #
            # 现在只做两件事：取出含 usr/bin/isc 的那一行，看第一列是不是
            # -rwxr-xr-x；不匹配时**把那一行原样打出来**。
            line=$(echo "$contents" | grep -F 'usr/bin/isc' | head -1 || true)
            case "$line" in
              "")
                echo "::error::$d 的清单里没有 usr/bin/isc"
                echo "$contents"
                exit 1
                ;;
              -rwxr-xr-x*)
                echo "  ✓ $(echo "$line" | awk '{print $1, $NF}')"
                ;;
              *)
                echo "::error::$d 里 usr/bin/isc 的权限位不是 -rwxr-xr-x"
                echo "  实际那一行：$line"
                exit 1
                ;;
            esac

            # 二进制**不该**被复制进文档目录 —— 那会让包大出一倍。
            if echo "$contents" | grep -q 'usr/share/doc/isc/isc$'; then
              echo "::error::$d 把可执行文件复制进了文档目录，包体积会翻倍"
              exit 1
            fi

            # GPLv3 要求许可证随包分发。
            echo "$contents" | grep -q 'usr/share/doc/isc/LICENSE' || {
              echo "::error::$d 里缺少 LICENSE"
              exit 1
            }
          done

          # 真正安装一遍再卸载 —— 这是端到端的证据。
          # 只有本机架构那个装得上，因此这里显式挑 amd64。
          deb=$(ls dist/*_amd64.deb)

          # GitHub 的 runner 上有 unattended-upgrades 在后台跑，它会持有 dpkg
          # 的**前端锁**。撞上时 dpkg 报的是
          # "dpkg frontend lock is locked by another process" ——
          # 那是环境竞争，不是包的问题，重试几次即可。
          #
          # 但**只对锁重试**：其它任何错误立刻失败，并把 dpkg 自己的话带进
          # 注解 —— 否则 CI 上只剩一句"dpkg -i 失败"，而日志在 API 里是 403。
          installed=0
          for attempt in 1 2 3 4 5; do
            if out=$(sudo dpkg -i "$deb" 2>&1); then
              installed=1
              echo "$out"
              break
            fi
            if echo "$out" | grep -qi 'lock'; then
              echo "第 $attempt 次撞上 dpkg 锁，5 秒后重试"
              sleep 5
              continue
            fi
            break
          done
          if [ "$installed" -ne 1 ]; then
            echo "$out"
            echo "::error::dpkg -i 失败：$deb —— $(printf '%s' "$out" | grep -v '^$' | tail -4 | tr '\n' ' ')"
            exit 1
          fi

          if ! out=$(isc version 2>&1); then
            echo "$out"
            echo "::error::安装之后 isc version 跑不起来 —— $(printf '%s' "$out" | tail -3 | tr '\n' ' ')"
            exit 1
          fi
          echo "$out"
          sudo dpkg -r isc

      - name: 核对 .rpm
        run: |
          set -euo pipefail

          # Ubuntu runner 上装了 rpm，因此可以用它自己来验证 ——
          # 比单元测试更强：单元测试用的是我们自己写的解析器。
          #
          # 同 .deb：一次产出两个（amd64 / arm64），因此用数组逐个处理 ——
          # 把两行路径塞进一个变量会让下一条命令以退出码 2 静默失败。
          rpms=(dist/*.rpm)
          if [ ${#rpms[@]} -eq 0 ]; then
            echo "::error::缺少 .rpm"
            exit 1
          fi
          echo "找到 ${#rpms[@]} 个 .rpm：${rpms[*]}"

          # 每一条 rpm 命令都把**它自己的报错**带进注解：CI 日志通过 API 取
          # 是 403，注解是唯一能看见错误原文的通道（.deb 那一步的教训）。
          run_rpm() {
            local out
            if ! out=$("$@" 2>&1); then
              echo "$out"
              echo "::error::$1 失败 —— $(printf '%s' "$out" | grep -v '^$' | tail -3 | tr '\n' ' ')"
              return 1
            fi
            printf '%s\n' "$out"
          }

          for r in "${rpms[@]}"; do
            echo "--- rpm -qip $r ---"
            run_rpm rpm -qip "$r" || exit 1

            echo "--- rpm -qlp $r ---"
            paths=$(run_rpm rpm -qlp "$r") || exit 1

            echo "--- rpm -qplv $r ---"
            verbose=$(run_rpm rpm -qplv "$r") || exit 1

            # 可执行文件必须在，且必须带执行位。
            # 与 .deb 那处同样的理由：不匹配列宽，失败时把那一行打出来。
            #
            # `|| true` 是必须的：`set -o pipefail` 下，grep 没匹配就让整个
            # 管道返回非零，`set -e` 于是**静默**结束这一步 —— 连我们自己的
            # ::error:: 都来不及打（上一轮就是这么失败的，注解里只有一句
            # "exit code 1"）。
            line=$(echo "$verbose" | grep -F '/usr/bin/isc' | head -1 || true)
            case "$line" in
              "")
                echo "::error::$r 的清单里没有 /usr/bin/isc"
                echo "$verbose"
                exit 1
                ;;
              -rwxr-xr-x*)
                echo "  ✓ $(echo "$line" | awk '{print $1, $NF}')"
                ;;
              *)
                echo "::error::$r 里 /usr/bin/isc 的权限位不是 -rwxr-xr-x"
                echo "  实际那一行：$line"
                exit 1
                ;;
            esac

            # 二进制**不该**被复制进文档目录 —— 那会让包大出一倍。
            if echo "$paths" | grep -q '/usr/share/doc/isc/isc$'; then
              echo "::error::$r 把可执行文件复制进了文档目录，包体积会翻倍"
              exit 1
            fi
          done

          # 载荷完整性：rpm -K 会校验签名 header 里的校验和。
          # 校验和算错时它只说"包已损坏"，而那是很难归因的。
          for r in "${rpms[@]}"; do
            run_rpm rpm -K "$r" || {
              echo "::error::$r 的校验和不通过"
              exit 1
            }
          done

      - name: 核对版本注入
        run: |
          set -euo pipefail
          # -ldflags 注入的版本必须真的出现在二进制里。
          # 少了它，用户报障时我们无法知道他在跑哪个版本。
          out=$(/tmp/x/isc version)
          echo "$out"
          echo "$out" | grep -q "0.0.0-ci" || {
            echo "::error::版本号没有被注入到二进制里"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 可复现构建
  #
  # 这个内核会拿到用户的 DNS 凭据，因此"校验和一致"应当能证明"两个产物
  # 来自同一份源码" —— 而如果构建本身不可复现，那个证明是不成立的。
  #
  # 这一组存在的意义是把那条性质**持续钉住**，而不是只在某一次提交里
  # 手工验过一次。它已经抓到过两次：ldflags 里的构建时间，以及
  # zip.FileInfoHeader 写进包头的文件 mtime。
  # ---------------------------------------------------------------------------
  reproducible:
    name: 可复现构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 用同一个 SOURCE_DATE_EPOCH 构建两次
        env:
          # 固定时刻：SOURCE_DATE_EPOCH 是可复现构建的通行约定。
          SOURCE_DATE_EPOCH: "1700000000"
        run: |
          set -euo pipefail
          go run ./scripts/release -out dist-a -version 1.2.3 -skip-tests
          go run ./scripts/release -out dist-b -version 1.2.3 -skip-tests

      - name: 逐字节比对
        run: |
          set -euo pipefail

          fail=0
          for f in dist-a/*; do
            name=$(basename "$f")
            if ! cmp -s "dist-a/$name" "dist-b/$name"; then
              echo "::error::$name 两次构建不一致"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "构建不可复现。常见原因："
            echo "  · 往产物里写了当前时间（应当用 SOURCE_DATE_EPOCH）"
            echo "  · 打包时带了文件在磁盘上的 mtime"
            echo "  · 目录遍历顺序没有排序"
            exit 1
          fi

          echo "✅ 全部产物逐字节一致"
          cat dist-a/SHA256SUMS
  # ---------------------------------------------------------------------------
  # 契约漂移检查
  #
  # api/openapi.yaml 是接口的唯一真理（docs/DECISIONS.md D07）。
  # 生成物必须与它同步提交，否则"契约优先"就退化成口号。
  # ---------------------------------------------------------------------------
  spec-drift:
    name: openapi 生成物同步
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 重新生成
        run: make generate-go

      - name: 检查是否有未提交的差异
        run: |
          if ! git diff --quiet -- internal/api/gen; then
            echo "::error::internal/api/gen 与 api/openapi.yaml 不同步。"
            echo "请在本机运行 'make generate' 并提交结果。"
            git --no-pager diff --stat -- internal/api/gen
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # i18n 完整性
  #
  # 文案硬编码检查在 M1 引入；当前先做 key 集合一致性
  # （由 internal/i18n 的单元测试保证，这里只是显式跑一次）。
  # ---------------------------------------------------------------------------
  i18n:
    name: i18n 完整性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: go test ./internal/i18n/... -count=1 -v

  # ---------------------------------------------------------------------------
  # Windows 安装包
  #
  # 单独一个 job 而不是塞进 release-build：那个跑在 ubuntu 上，而 .msi
  # 需要 WiX —— 它虽然是个 .NET 工具、任何平台都能装，但**产物只有
  # Windows 用户会下载**，在 ubuntu 上产出它没有意义。
  #
  # 与 reproducible 一样，这个 job 验证的是**用户真正拿到的东西**。
  # 一个"能编译但装不上"的仓库，对 Windows 用户来说和没有发布一样。
  # ---------------------------------------------------------------------------
  release-msi:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # **锁定 5.0.2**：v7 起要求接受 Open Source Maintenance Fee 的 EULA，
      # 那是使用者要做的法律决定，CI 不该替他接受。
      #
      # 版本号与 scripts/release/msi_def.go 里的 msiWixVersion 是同一个 ——
      # 两处都要改，因此那个常量旁边写了注释。
      - name: 安装 WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 构建全部平台
        run: go run ./scripts/release -out dist -version 0.0.0-ci -skip-tests

      - name: 核对 msi
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # 两个架构都要有。
          foreach ($arch in @('amd64', 'arm64')) {
            $p = "dist/isc_0.0.0-ci_$arch.msi"
            if (-not (Test-Path $p)) {
              Write-Error "缺少产物 $p"
              exit 1
            }
            # 一个空的或截断的 msi 比没有更糟：用户会下载它然后装不上。
            if ((Get-Item $p).Length -lt 100KB) {
              Write-Error "$p 只有 $((Get-Item $p).Length) 字节，不像是完整的安装包"
              exit 1
            }
          }

          # 让 **Windows Installer 自己**判断产物合不合法。
          #
          # /a 是管理安装：校验数据库并把文件解到指定目录，**不真正安装**，
          # 因此在 CI 里是安全的。
          #
          # 这一步不能省：文件存在、大小对，与"它是一份能装的包"是两件事。
          $target = Join-Path $env:RUNNER_TEMP 'msi-check'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $proc = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            '/a', (Resolve-Path 'dist/isc_0.0.0-ci_amd64.msi').Path, '/qn', "TARGETDIR=$target"
          )
          if ($proc.ExitCode -ne 0) {
            Write-Error "msiexec /a 退出 $($proc.ExitCode) —— 产物不是 Windows Installer 认得的包"
            exit 1
          }

          $exe = Get-ChildItem $target -Recurse -Filter isc.exe | Select-Object -First 1
          if (-not $exe) {
            Write-Error "管理安装没有解出 isc.exe —— 包合法但内容不对"
            exit 1
          }
          Write-Host "解出 $($exe.FullName)（$($exe.Length) 字节）"
  # ---------------------------------------------------------------------------
  # macOS 安装包
  #
  # 与 release-msi 对称。这里**不需要安装任何东西**：pkgbuild 是 macOS
  # 自带的 —— 而 .pkg 本来就只能在 macOS 上构建（它是 xar 归档，载荷是
  # cpio.gz，还有一份格式未公开的二进制 Bom）。所以这个 job 存在的意义
  # 不是"检查工具在不在"，而是**检查脚本真的能在它该跑的地方跑通**。
  # ---------------------------------------------------------------------------
  release-pkg:
    name: macOS 安装包
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 构建全部平台
        run: go run ./scripts/release -out dist -version 0.1.0-ci -skip-tests

      - name: 核对 pkg
        run: |
          set -euo pipefail

          for arch in amd64 arm64; do
            p="dist/isc_0.1.0-ci_${arch}.pkg"
            test -f "$p" || { echo "::error::缺少产物 $p"; exit 1; }

            # 一个空的或截断的 pkg 比没有更糟：用户会下载它然后装不上。
            size=$(wc -c < "$p")
            if [ "$size" -lt 102400 ]; then
              echo "::error::$p 只有 $size 字节，不像是完整的安装包"
              exit 1
            fi

            # 让 **macOS 自己**判断产物合不合法。
            #
            # 文件存在、大小对，与"它是一份能装的包"是两件事 ——
            # 这一点在 .msi 那边已经吃过一次（当时我在字节层面反推，
            # 而正确的动作是去问真正会读它的程序）。
            #
            # `pkgutil --check-signature` 会在未签名时报非零，而
            # **未签名是当前预期**（证书还没买），因此不能用它。
            # 用 `installer -pkginfo` 的展开检查代替：它解析 xar 与
            # Distribution，失败即说明包结构有问题。
            if ! installer -pkginfo -pkg "$p" > /dev/null 2>&1; then
              # -pkginfo 在某些 macOS 版本上只对分发型包有效；退回到
              # xar 层面确认它至少是个能解开的包。
              echo "::notice::installer -pkginfo 未通过，退回到 xar 结构检查"
              xar -tf "$p" > /dev/null || {
                echo "::error::$p 不是合法的 xar 归档"
                exit 1
              }
            fi
          done